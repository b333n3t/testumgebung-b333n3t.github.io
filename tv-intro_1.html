  <style>
    :root { --fade-ms: 1000ms; --bg:#930010; }

    html,body{
      margin:0;height:100%;
      background:var(--bg);
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    canvas#c{
      position:fixed; inset:0;
      width:100vw; height:100vh;
      display:block;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      opacity:0;
      transition:opacity var(--fade-ms) ease;
      z-index:1;
    }
    body.ready canvas#c{opacity:1;}
    body.fadeout canvas#c{opacity:0;}
    body.fadeout canvas#egg{opacity:0 !important; pointer-events:none;}

    /* Hidden autostereogram layer (easter egg) */
    canvas#egg{
      position:fixed; inset:0;
      width:100vw; height:100vh;
      display:block;
      z-index:6;
      opacity:0;
      pointer-events:none;
      transition:opacity 350ms ease;
    }
    canvas#egg.show{opacity:1; pointer-events:auto;}

    .skip{
      position:fixed; top:14px; right:14px; z-index:10;
      background:#fff; color:#000; border:0; border-radius:999px;
      padding:.45rem .8rem; font-weight:700; cursor:pointer;
    }
    .skip:focus-visible{outline:2px solid #fff; outline-offset:2px;}

    .loaderWrap{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      opacity:0;
      transition:opacity var(--fade-ms) ease;
      z-index:5;
      pointer-events:none;
    }
    body.ready .loaderWrap{opacity:1;}
    body.fadeout .loaderWrap{opacity:0;}
    body.eggphase .loaderWrap{opacity:0;}

    .loader{
      width:min(720px,78vw);
      padding:18px 18px 16px;
      box-sizing:border-box;
    }

    .barFrame{
      width:100%; height:16px;
      border:2px solid #fff;
      border-radius:0;
      padding:2px;
      box-sizing:border-box;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.6),
        inset 0 0 0 1px rgba(0,0,0,0.6);
    }

    .bar{
      height:100%;
      width:0%;
      border-radius:0;
      background:
        repeating-linear-gradient(
          90deg,
          #fff 0px,
          #fff 6px,
          rgba(255,255,255,0.65) 6px,
          rgba(255,255,255,0.65) 8px
        );
    }

    .hint{
      margin-top:10px;
      color:rgba(255,255,255,.9);
      font-size:14px;
      letter-spacing:.2px;
      text-align:center;
      user-select:none;
      text-shadow: 0 1px 0 rgba(0,0,0,0.35);
    }

    @media (prefers-reduced-motion: reduce){
      body{animation:none !important;}
      canvas#c,.loaderWrap{transition:none;}
    }

<script>
/* =========================================================
   ✅ Speculation Rules (nur wenn sinnvoll)
   - kein Save-Data
   - kein reduced-motion
   - kein Bot/Lighthouse
   ========================================================= */
(function setupSpeculationRules(){
  try{
    const ua = navigator.userAgent || "";
    const isBot = /bot|crawl|slurp|spider|preview|Chrome-Lighthouse|Lighthouse|Google-InspectionTool|Google-PageRenderer|Google-StructuredDataTestingTool/i.test(ua);
    const saveData = !!(navigator.connection && navigator.connection.saveData);
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if(isBot || saveData || reduceMotion) return;

    const s = document.createElement('script');
    s.type = 'speculationrules';
    s.textContent = JSON.stringify({
      prefetch:  [{ source: "document", urls: ["index.html"] }],
      prerender: [{ source: "document", urls: ["index.html?nointro=1"] }]
    });
    document.head.appendChild(s);
  }catch(e){}
})();

/* =========================================================
   ✅ Return URL robust + garantiert nointro=1
   ========================================================= */
function buildIntroReturnUrl(){
  try{
    const raw = sessionStorage.getItem("introReturn") || "index.html";
    const u = new URL(raw, location.href);
    u.searchParams.set("nointro", "1");
    return u.pathname + (u.search ? u.search : "") + (u.hash ? u.hash : "");
  }catch(e){
    return "index.html?nointro=1";
  }
}
const INTRO_RETURN_URL = buildIntroReturnUrl();

/* =========================================================
   ✅ Skip & Reduced Motion (SOFORT aktiv)
   ========================================================= */
(function setupSkipAndA11y(){
  const skipBtn = document.querySelector('.skip');

  function goNow(){
    try { sessionStorage.setItem("introPlayed","1"); } catch(e){}
    document.body.classList.add('fadeout');
    setTimeout(()=>location.replace(INTRO_RETURN_URL), 250);
  }

  if (skipBtn) skipBtn.addEventListener('click', goNow);

  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      goNow();
      return;
    }
  } catch(e){}
})();

/* =========================================================
   ✅ PRELOAD: nur was du wirklich willst
   - reel1.avif ... reel7.avif: entfernt (du hast jetzt -320/-640/-960)
   - YouTube thumbs: optional (bleiben drin, aber NICHT zwingend)
   - B3NN3T.mp4: bleibt & wird weiterhin vorab geladen
   ========================================================= */

/* Optional: YouTube Thumbs als Fallback-Warmup (kannst du auch leer lassen) */
const preloadImages = [
  "https://img.youtube.com/vi/ZSaj_FuqPN8/hqdefault.jpg",
  "https://img.youtube.com/vi/DMNl40Tip1w/hqdefault.jpg",
  "https://img.youtube.com/vi/K5pKG0Smdfc/hqdefault.jpg",
  "https://img.youtube.com/vi/4I9vlcGvFGQ/hqdefault.jpg",
  "https://img.youtube.com/vi/w0pNdnlb96M/hqdefault.jpg",
  "https://img.youtube.com/vi/rV1U891RKLo/hqdefault.jpg",
  "https://img.youtube.com/vi/fq8zhAQMam0/hqdefault.jpg"
];

/* ✅ Video Preload bleibt */
const preloadVideos = [ "assets/gesehen/B3NN3T.mp4" ];

function preloadAllImages(urls){
  urls.forEach(url=>{
    const img = new Image();
    img.referrerPolicy = "no-referrer";
    img.src = url;
  });
}
function preloadAllVideos(urls){
  urls.forEach(url=>{
    const v = document.createElement('video');
    v.preload = 'auto';
    v.muted = true;
    v.playsInline = true;
    v.src = url;
    v.load();
  });
}

if(!window._preloaded){
  window._preloaded = true;
  preloadAllImages(preloadImages);
  preloadAllVideos(preloadVideos);
}

/* =========================================================
   Canvas Setup
   ========================================================= */
const c = document.getElementById('c');
const ctx = c && c.getContext ? c.getContext('2d') : null;

if(!ctx){
  document.body.classList.add('ready');
  console.warn("Canvas/2D context nicht verfügbar.");
} else {

  let W=0,H=0,DPR=1;

  function resize(){
    DPR = Math.max(1, Math.floor(window.devicePixelRatio || 1));
    W = c.width  = Math.floor(innerWidth * DPR);
    H = c.height = Math.floor(innerHeight * DPR);
    c.style.width  = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    ctx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', resize);
  resize();

  /* ================== Line Helpers (fein, stabil) ================== */
  const snap = (v)=>Math.round(v);
  const clamp01 = (t)=>Math.max(0,Math.min(1,t));
  function hash01(n){ const x=Math.sin(n*127.1)*43758.5453123; return x-Math.floor(x); }
  function smoothstep(t){ t=clamp01(t); return t*t*(3-2*t); }
  function noise1D(seed, t){
    const s=t*10, i=Math.floor(s), f=s-i;
    const a=hash01(seed*1000+i*19.19), b=hash01(seed*1000+(i+1)*19.19);
    const u=smoothstep(f);
    return (a*(1-u)+b*u)*2-1;
  }

  /* ============== 80s Vector-Scope Drift ============== */
  function scopeLine(x1,y1,x2,y2,seed,alpha,width){
    const dx=x2-x1, dy=y2-y1;
    const len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;

    const segs=Math.max(16, Math.min(90, Math.floor(len/(10*DPR))));
    const tNow = performance.now()*0.001;

    const freq = 1.2 + (hash01(seed*3.3))*1.1;
    const wob  = (0.7 + hash01(seed*7.7))*1.8;
    const amp  = (0.55 + hash01(seed*11.1))*2.2 * DPR;
    const phase = (hash01(seed*5.5))*Math.PI*2;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = width;
    ctx.lineCap='round';
    ctx.lineJoin='round';

    ctx.strokeStyle = 'rgba(255,255,255,0.58)';
    ctx.beginPath();
    for(let i=0;i<=segs;i++){
      const t=i/segs;

      let x=x1+dx*t;
      let y=y1+dy*t;

      const sin = Math.sin((t*freq*2*Math.PI) + phase + tNow*0.55*wob);
      const n   = noise1D(seed, t + tNow*0.06);

      const off = (sin*0.70 + n*0.30) * amp;

      x = snap(x + nx*off);
      y = snap(y + ny*off);

      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();

    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle = 'rgba(0,255,255,0.10)';
    ctx.lineWidth = width + 0.8*DPR;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,0,200,0.08)';
    ctx.lineWidth = width + 1.3*DPR;
    ctx.stroke();

    ctx.restore();
  }

  /* ================== Tunnel-Grid (Vector-Scope) ================== */
  function drawTunnelGrid(now, reveal01){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#930010';
    ctx.fillRect(0,0,W,H);

    const outer = [
      {x:0, y:0}, {x:W, y:0}, {x:W, y:H}, {x:0, y:H}
    ];

    const cx = W*0.5, cy = H*0.5;
    const innerW = W*0.44;
    const innerH = H*0.32;
    const inner = [
      {x:cx - innerW/2, y:cy - innerH/2},
      {x:cx + innerW/2, y:cy - innerH/2},
      {x:cx + innerW/2, y:cy + innerH/2},
      {x:cx - innerW/2, y:cy + innerH/2}
    ];

    const RINGS = 34;
    const RAD   = 26;

    const ringCount = Math.max(1, Math.floor(reveal01 * RINGS));
    const radCount  = Math.max(2, Math.floor(reveal01 * RAD));

    const speed = 0.00038;
    const phase = (now*speed) % 1;

    const baseW = Math.max(0.75, 0.85*DPR);

    for(let i=0;i<=radCount;i++){
      const t = i/radCount;

      const A = { x: outer[0].x + (outer[1].x-outer[0].x)*t, y: outer[0].y };
      const B = { x: inner[0].x + (inner[1].x-inner[0].x)*t, y: inner[0].y };
      scopeLine(A.x,A.y,B.x,B.y, 10+i*0.13, 0.62, baseW);

      const C = { x: outer[3].x + (outer[2].x-outer[3].x)*t, y: outer[3].y };
      const D = { x: inner[3].x + (inner[2].x-inner[3].x)*t, y: inner[3].y };
      scopeLine(C.x,C.y,D.x,D.y, 20+i*0.13, 0.62, baseW);
    }

    for(let i=0;i<=radCount;i++){
      const t = i/radCount;

      const A = { x: outer[0].x, y: outer[0].y + (outer[3].y-outer[0].y)*t };
      const B = { x: inner[0].x, y: inner[0].y + (inner[3].y-inner[0].y)*t };
      scopeLine(A.x,A.y,B.x,B.y, 30+i*0.13, 0.62, baseW);

      const C = { x: outer[1].x, y: outer[1].y + (outer[2].y-outer[1].y)*t };
      const D = { x: inner[1].x, y: inner[1].y + (inner[2].y-inner[1].y)*t };
      scopeLine(C.x,C.y,D.x,D.y, 40+i*0.13, 0.62, baseW);
    }

    for(let i=0;i<ringCount;i++){
      const u = (i/(RINGS-1));
      let z = u*u;
      z = (z + phase*0.22) % 1;
      z = z*z;

      const q0 = { x: outer[0].x + (inner[0].x-outer[0].x)*z, y: outer[0].y + (inner[0].y-outer[0].y)*z };
      const q1 = { x: outer[1].x + (inner[1].x-outer[1].x)*z, y: outer[1].y + (inner[1].y-outer[1].y)*z };
      const q2 = { x: outer[2].x + (inner[2].x-outer[2].x)*z, y: outer[2].y + (inner[2].y-outer[2].y)*z };
      const q3 = { x: outer[3].x + (inner[3].x-outer[3].x)*z, y: outer[3].y + (inner[3].y-outer[3].y)*z };

      const front = (1 - z);
      const alpha = 0.10 + 0.26*front;

      scopeLine(q0.x,q0.y,q1.x,q1.y, 100+i*0.21, alpha, baseW);
      scopeLine(q1.x,q1.y,q2.x,q2.y, 200+i*0.21, alpha, baseW);
      scopeLine(q2.x,q2.y,q3.x,q3.y, 300+i*0.21, alpha, baseW);
      scopeLine(q3.x,q3.y,q0.x,q0.y, 400+i*0.21, alpha, baseW);
    }

    scopeLine(inner[0].x,inner[0].y,inner[1].x,inner[1].y, 900, 0.78, baseW+0.2*DPR);
    scopeLine(inner[1].x,inner[1].y,inner[2].x,inner[2].y, 901, 0.78, baseW+0.2*DPR);
    scopeLine(inner[2].x,inner[2].y,inner[3].x,inner[3].y, 902, 0.78, baseW+0.2*DPR);
    scopeLine(inner[3].x,inner[3].y,inner[0].x,inner[0].y, 903, 0.78, baseW+0.2*DPR);
  }

  /* ================== Loader Timing ================== */
  const START_DELAY_MS = 1000;
  const INTRO_MS = 3500;
  const FADEOUT_MS = 1700;
  const EXTRA_MS = 300;

  function startTransition(){
    try { sessionStorage.setItem("introPlayed","1"); } catch(e){}
    document.body.classList.add('fadeout');
    setTimeout(()=>{ window.location.replace(INTRO_RETURN_URL); }, FADEOUT_MS + EXTRA_MS);
  }

  const EGG_PHASE_MS = 4500;

  function runEggPhaseThenTransition(){
    document.body.classList.add('eggphase');
    if(window.__b3EggReveal) window.__b3EggReveal();

    let done = false;
    function finish(){
      if(done) return;
      done = true;
      if(window.__b3EggHide) window.__b3EggHide();
      document.body.classList.remove('eggphase');
      startTransition();
    }

    // Ein Klick/Tap während der Stereogramm-Phase überspringt sie sofort
    document.addEventListener('click', finish, {once:true});

    setTimeout(finish, EGG_PHASE_MS);
  }

  function startProgressAndTunnel(){
    const bar = document.getElementById('bar');
    const start = performance.now();

    function frame(now){
      const t = (now - start) / INTRO_MS;
      const clamped = Math.max(0, Math.min(1, t));
      const reveal = Math.min(1, clamped * 1.20);

      drawTunnelGrid(now, reveal);

      const steps = 32;
      const stepped = Math.floor(clamped * steps) / steps;
      if(bar) bar.style.width = (stepped * 100).toFixed(2) + "%";

      if(clamped >= 1){
        if(bar) bar.style.width = "100%";
        runEggPhaseThenTransition();
        return;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ================== Start ================== */
  setTimeout(() => {
    document.body.classList.add('ready');
    startProgressAndTunnel();
  }, START_DELAY_MS);
}

/* =========================================================
   ✅ Verstecktes Easter Egg: Autostereogram (SIRDS)
   Dreimal schnell hintereinander auf den Intro-Bildschirm tippen/klicken
   (innerhalb von 700ms), um ein Random-Dot-Stereogramm ("Magic Eye")
   erscheinen zu lassen. Es bleibt sichtbar (mit zwei kleinen
   Fokussier-Punkten oben), bis erneut dreimal getippt wird oder nach
   12 Sekunden automatisch. Kein sichtbarer Hinweis im UI.

   Zum Sehen: Bildschirm entspannt anschauen, Blick "durch" den Screen
   hindurch auf einen imaginären Punkt dahinter richten (auseinander-
   schielen), bis aus den zwei Punkten oben drei werden - dann in
   dieser Fokusebene bleiben und das Bild "einrasten" lassen.
   ========================================================= */
(function setupAutostereogramEgg(){
  const TAP_WINDOW_MS = 700;
  const AUTO_HIDE_MS = 12000;
  const DOT_UNIT = 2; // Blockbreite pro "Rauschpunkt" - größer = leichter fusionierbar

  const egg = document.getElementById('egg');
  const eggCtx = egg && egg.getContext ? egg.getContext('2d') : null;
  if(!eggCtx) return;

  let rendered = false;
  let tapCount = 0;
  let tapTimer = null;
  let hideTimer = null;
  let lastEyeSep = 0;

  function resizeEgg(){
    egg.width  = innerWidth;
    egg.height = innerHeight;
    rendered = false;
  }
  addEventListener('resize', resizeEgg);
  resizeEgg();

  /* Tiefenkarte: ein weiches Herz, Weiß = nah, Schwarz = fern */
  function buildDepthMap(w,h){
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d');
    octx.fillStyle = '#000';
    octx.fillRect(0,0,w,h);
    octx.fillStyle = '#fff';
    octx.save();
    octx.translate(w/2, h/2);
    const scale = Math.min(w,h) / 6;
    octx.scale(scale, scale);
    octx.beginPath();
    octx.moveTo(0, -1.0);
    octx.bezierCurveTo(-2.2, -3.2, -4.8, -0.6, 0, 2.6);
    octx.bezierCurveTo(4.8, -0.6, 2.2, -3.2, 0, -1.0);
    octx.closePath();
    octx.fill();
    octx.restore();

    if(octx.filter !== undefined){
      octx.filter = 'blur(18px)';
      octx.drawImage(off, 0, 0);
      octx.filter = 'none';
    }
    return octx.getImageData(0,0,w,h);
  }

  /* Klassischer SIRDS-Algorithmus (Union-Find, links->rechts),
     in horizontalen Blöcken von DOT_UNIT Pixeln für leichter
     erkennbare Punkte. */
  function renderStereogram(){
    const w = egg.width, h = egg.height;
    if(w < 10 || h < 10) return;

    const depth = buildDepthMap(w,h);
    const outImg = eggCtx.createImageData(w,h);

    const wB = Math.ceil(w / DOT_UNIT);
    const eyeSepPx = Math.max(90, Math.floor(w/7));
    const eyeSepB  = Math.max(6, Math.round(eyeSepPx / DOT_UNIT));
    const depthMaxB = Math.max(1, Math.round(eyeSepB * 0.30));
    lastEyeSep = eyeSepB * DOT_UNIT;

    for(let y=0; y<h; y++){
      const same = new Int32Array(wB);
      for(let bx=0; bx<wB; bx++) same[bx] = bx;

      for(let bx=0; bx<wB; bx++){
        const sampleX = Math.min(w-1, bx*DOT_UNIT + (DOT_UNIT>>1));
        const dv = depth.data[(y*w+sampleX)*4] / 255;
        const sep = eyeSepB - Math.round(dv * depthMaxB);
        const left = bx - (sep >> 1);
        const right = left + sep;
        if(left >= 0 && right < wB){
          let s = right;
          while(same[s] !== s) s = same[s];
          let l = left;
          while(same[l] !== l) l = same[l];
          if(l !== s) same[s] = l;
        }
      }

      const rowVals = new Uint8Array(wB);
      for(let bx=0; bx<wB; bx++){
        let s = bx;
        while(same[s] !== s) s = same[s];
        rowVals[bx] = (s === bx) ? (40 + Math.floor(Math.random()*215)) : rowVals[s];
      }

      for(let bx=0; bx<wB; bx++){
        const val = rowVals[bx];
        const xStart = bx*DOT_UNIT;
        const xEnd = Math.min(w, xStart+DOT_UNIT);
        for(let x=xStart; x<xEnd; x++){
          const idx = (y*w+x)*4;
          outImg.data[idx] = val;
          outImg.data[idx+1] = val;
          outImg.data[idx+2] = val;
          outImg.data[idx+3] = 255;
        }
      }
    }
    eggCtx.putImageData(outImg, 0, 0);

    /* Fokussier-Punkte oben: bei korrekter Divergenz verschmelzen
       die äußeren zwei zu einem mittleren dritten Punkt. */
    const dotY = Math.max(24, Math.floor(h*0.06));
    const cx = w/2;
    eggCtx.save();
    eggCtx.fillStyle = 'rgba(255,255,255,0.85)';
    [cx - lastEyeSep/2, cx + lastEyeSep/2].forEach(dx=>{
      eggCtx.beginPath();
      eggCtx.arc(dx, dotY, 4, 0, Math.PI*2);
      eggCtx.fill();
    });
    eggCtx.restore();

    rendered = true;
  }

  function reveal(){
    if(!rendered) renderStereogram();
    egg.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hide, AUTO_HIDE_MS);
  }
  function hide(){
    egg.classList.remove('show');
    clearTimeout(hideTimer);
  }

  // Für den automatischen Ablauf aus dem Intro heraus verfügbar machen
  window.__b3EggReveal = reveal;
  window.__b3EggHide = hide;

  function registerTap(){
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>{ tapCount = 0; }, TAP_WINDOW_MS);
    if(tapCount >= 3){
      tapCount = 0;
      clearTimeout(tapTimer);
      if(egg.classList.contains('show')) hide();
      else reveal();
    }
  }

  if(c){
    c.addEventListener('click', registerTap);
  }
  egg.addEventListener('click', registerTap);
})();
</script>
