<style>

html, body{

.presave-button:hover {

.presave-button:focus-visible {

.presave-icon {

@media(max-width:768px){

        max-width:100%;

}
</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* =====================================
   RELEASE COUNTDOWN
===================================== */

(function(){
    const targetDate =
    new Date("2026-01-09T00:00:00+01:00").getTime();

    const el =
    document.getElementById("awb-countdown-timer");

    if(!el) return;

    let countdownTimer = null;

    function updateCountdown(){
        const diff =
        targetDate - Date.now();

        if(diff <= 0){
            el.textContent = "OUT NOW";

            if(countdownTimer){
                clearInterval(countdownTimer);
                countdownTimer = null;
            }

            return;
        }

        const seconds =
        Math.floor(diff / 1000);

        const days =
        Math.floor(seconds / 86400);

        const hours =
        String(
            Math.floor((seconds % 86400) / 3600)
        ).padStart(2, "0");

        const mins =
        String(
            Math.floor((seconds % 3600) / 60)
        ).padStart(2, "0");

        const secs =
        String(seconds % 60).padStart(2, "0");

        el.textContent =
        days > 0
        ? days + "d " + hours + ":" + mins + ":" + secs
        : hours + ":" + mins + ":" + secs;
    }

    countdownTimer =
    setInterval(updateCountdown, 1000);

    updateCountdown();
}());

/* =====================================
   SUPABASE CONFIG
===================================== */

let supabaseClient = null;

const SUPABASE_URL =
    "https://xqucqbyzklmptyjgghgo.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MRJcYGadARj5Es6fiNcD2A_FJyZ_bX3";

function setStartStatus(text){
    const el =
    document.getElementById("startStatus");

    if(el){
        el.textContent = text || "";
    }
}

if(typeof window.supabase !== "undefined"){
    try{
        supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        console.log("Supabase client created");

    }catch(err){
        console.error("Supabase init failed:", err);
        setStartStatus("Leaderboard offline. Game funktioniert trotzdem.");
    }
}else{
    console.error("Supabase library missing. CDN not loaded.");
    setStartStatus("Leaderboard offline. Game funktioniert trotzdem.");
}

/* =====================================
   RETRY LOGIC
===================================== */

let retryCount = 0;
let waitingForNewName = true;

/* =====================================
   CANVAS
===================================== */

const c =
document.getElementById("c");

const ctx =
c.getContext("2d");

const DPR =
window.devicePixelRatio || 1;

function resize(){
    c.width =
    Math.floor(window.innerWidth * DPR);

    c.height =
    Math.floor(window.innerHeight * DPR);

    c.style.width =
    window.innerWidth + "px";

    c.style.height =
    window.innerHeight + "px";

    ctx.setTransform(
        1,0,0,1,0,0
    );

    ctx.scale(DPR,DPR);
}

resize();

window.addEventListener(
    "resize",
    resize
);

const isMobile =
window.innerWidth < 768;

/* =====================================
   STATE
===================================== */

let running = false;
let ending = false;

let score = 0;
let time = 60;

let timerInterval = null;
let animationFrameId = null;

let gameStartTime = 0;
let lastSpawnTime = 0;
let nextSpawnDelay = 1300;

const song =
document.getElementById("song");

const obstacleColors = [
    "#2f80ff",
    "#ff2e2e",
    "#22c55e",
    "#a855f7",
    "#ff8a00",
    "#00d5ff",
    "#ff3fb4",
    "#facc15"
];

const savedName =
localStorage.getItem("playerName");

if(savedName){
    document
    .getElementById("name")
    .value = savedName;
}

const player = {
    x:isMobile
        ? window.innerWidth * 0.22
        : window.innerWidth * 0.25,

    y:window.innerHeight * 0.5,

    w:isMobile ? 48 : 40,
    h:isMobile ? 48 : 40,

    vy:0
};

let obstacles = [];
let particles = [];
let orbs = [];

/* =====================================
   SPEED / DIFFICULTY
===================================== */

function getElapsedSeconds(){
    if(!gameStartTime) return 0;

    return Math.max(
        0,
        (performance.now() - gameStartTime) / 1000
    );
}

function getCurrentSpeed(){
    const elapsed =
    getElapsedSeconds();

    if(elapsed < 6){
        const start =
        isMobile ? 2.6 : 3.2;

        const end =
        isMobile ? 3.8 : 4.5;

        const p =
        elapsed / 6;

        return start + (end - start) * p;
    }

    if(time > 10){
        const p =
        Math.min(
            1,
            (elapsed - 6) / 44
        );

        const start =
        isMobile ? 4.0 : 4.8;

        const end =
        isMobile ? 6.3 : 7.3;

        return start + (end - start) * p;
    }

    const lastP =
    Math.min(
        1,
        (10 - time) / 10
    );

    const start =
    isMobile ? 7.0 : 8.0;

    const end =
    isMobile ? 9.2 : 10.4;

    return start + (end - start) * lastP;
}

function getSpawnDelay(){
    const elapsed =
    getElapsedSeconds();

    if(elapsed < 6){
        return isMobile ? 1450 : 1350;
    }

    if(time > 10){
        return isMobile ? 1050 : 950;
    }

    return isMobile ? 760 : 680;
}

/* =====================================
   CONTROLS
===================================== */

function moveUp(){
    if(!running) return;
    player.vy = isMobile ? -7 : -9;
}

function moveDown(){
    if(!running) return;
    player.vy = isMobile ? 7 : 9;
}

window.addEventListener(
    "keydown",
    e => {
        if(
            e.code === "ArrowUp" ||
            e.code === "KeyW" ||
            e.code === "Space"
        ){
            e.preventDefault();
            moveUp();
        }

        if(
            e.code === "ArrowDown" ||
            e.code === "KeyS"
        ){
            e.preventDefault();
            moveDown();
        }
    }
);

window.addEventListener(
    "touchmove",
    e => {
        if(!running) return;

        e.preventDefault();

        const touch =
        e.touches[0];

        const y =
        touch.clientY;

        player.y +=
        (
            y
            -
            player.y
            -
            player.h/2
        ) * 0.25;
    },
    { passive:false }
);

/* =====================================
   PARTICLES
===================================== */

function spawnParticles(x,y){
    for(let i=0;i<30;i++){
        particles.push({
            x,
            y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6,
            life:40
        });
    }
}

function orbInsideObstacle(x,y){
    for(let o of obstacles){
        if(
            x > o.x &&
            x < o.x + o.w &&
            y > o.y &&
            y < o.y + o.h
        ){
            return true;
        }
    }

    return false;
}

/* =====================================
   SPAWN
===================================== */

function spawnObstacle(){
    const lane =
    Math.floor(Math.random()*3);

    const hard =
    time <= 10;

    const heights =
    isMobile
    ? hard
        ? [60,90,120,150]
        : [40,70,100]
    : hard
        ? [70,110,150,190]
        : [40,80,140];

    const widths =
    isMobile
    ? hard
        ? [80,120,160,190]
        : [60,100,140]
    : hard
        ? [90,140,190,230]
        : [60,120,180];

    const h =
    heights[
        Math.floor(
            Math.random()
            *
            heights.length
        )
    ];

    const w =
    widths[
        Math.floor(
            Math.random()
            *
            widths.length
        )
    ];

    let y;

    if(lane === 0){
        y = 80;
    }

    if(lane === 1){
        y =
        window.innerHeight/2
        -
        h/2;
    }

    if(lane === 2){
        y =
        window.innerHeight
        -
        180
        -
        h;
    }

    const color =
    obstacleColors[
        Math.floor(
            Math.random()
            *
            obstacleColors.length
        )
    ];

    obstacles.push({
        x:window.innerWidth + 100,
        y,
        w,
        h,
        color,
        passed:false
    });

    if(Math.random() > (hard ? 0.45 : 0.65)){
        let orbX =
        window.innerWidth + 260;

        let orbY;
        let safe = false;
        let attempts = 0;

        while(!safe && attempts < 25){
            attempts++;

            orbY =
            Math.random()
            *
            (
                window.innerHeight
                -
                260
            )
            + 100;

            safe =
            !orbInsideObstacle(
                orbX,
                orbY
            );
        }

        if(safe){
            orbs.push({
                x:orbX,
                y:orbY,
                r:12,
                taken:false
            });
        }
    }
}

function updateSpawning(){
    const now =
    performance.now();

    if(
        now - lastSpawnTime
        >=
        nextSpawnDelay
    ){
        spawnObstacle();

        lastSpawnTime = now;

        nextSpawnDelay =
        getSpawnDelay()
        *
        (
            0.82
            +
            Math.random() * 0.36
        );
    }
}

/* =====================================
   UPDATE
===================================== */

function update(){
    const speed =
    getCurrentSpeed();

    updateSpawning();

    player.y += player.vy;
    player.vy *= 0.90;

    if(player.y < 40){
        player.y = 40;
    }

    if(player.y > window.innerHeight - 140){
        player.y = window.innerHeight - 140;
    }

    obstacles.forEach(o => {
        o.x -= speed;

        if(
            player.x < o.x + o.w &&
            player.x + player.w > o.x &&
            player.y < o.y + o.h &&
            player.y + player.h > o.y
        ){
            endGame("gameover");
        }

        if(!o.passed && o.x < player.x){
            o.passed = true;
            score += 10;

            if(score % 100 === 0){
                spawnParticles(
                    player.x,
                    player.y
                );
            }
        }
    });

    orbs.forEach(o => {
        o.x -= speed;

        const dx =
        (
            player.x
            +
            player.w/2
        )
        - o.x;

        const dy =
        (
            player.y
            +
            player.h/2
        )
        - o.y;

        const dist =
        Math.sqrt(dx*dx + dy*dy);

        if(dist < 30 && !o.taken){
            o.taken = true;
            score += 25;

            spawnParticles(
                o.x,
                o.y
            );
        }
    });

    obstacles =
    obstacles.filter(
        o => o.x > -300
    );

    orbs =
    orbs.filter(
        o => o.x > -100 && !o.taken
    );

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
    });

    particles =
    particles.filter(
        p => p.life > 0
    );

    document
    .getElementById("score")
    .innerText = score;
}

/* =====================================
   DRAW
===================================== */

function draw(){
    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    ctx.fillStyle = "#050816";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    for(let i=0;i<20;i++){
        ctx.fillStyle =
        "rgba(255,255,255,0.03)";

        ctx.fillRect(
            (
                i*180
                -
                performance.now()*0.05
            )
            %
            window.innerWidth,
            i*60,
            120,
            1
        );
    }

    ctx.fillStyle = "white";

    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    obstacles.forEach(o => {
        ctx.fillStyle =
        o.color || "red";

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

        ctx.strokeStyle =
        "rgba(255,255,255,0.35)";

        ctx.lineWidth = 2;

        ctx.strokeRect(
            o.x,
            o.y,
            o.w,
            o.h
        );
    });

    ctx.fillStyle = "gold";

    orbs.forEach(o => {
        ctx.beginPath();

        ctx.arc(
            o.x,
            o.y,
            o.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    particles.forEach(p => {
        ctx.globalAlpha =
        p.life / 40;

        ctx.fillStyle =
        "white";

        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );
    });

    ctx.globalAlpha = 1;
}

function loop(){
    if(!running) return;

    update();
    draw();

    animationFrameId =
    requestAnimationFrame(loop);
}

function startTimer(){
    if(timerInterval){
        clearInterval(timerInterval);
    }

    timerInterval =
    setInterval(() => {
        if(!running){
            clearInterval(timerInterval);
            timerInterval = null;
            return;
        }

        time--;

        document
        .getElementById("timer")
        .innerText = time;

        score++;

        if(time <= 0){
            clearInterval(timerInterval);
            timerInterval = null;

            endGame("finish");
        }
    },1000);
}

/* =====================================
   HELPERS
===================================== */

function escapeHtml(value){
    return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getCleanName(){
    return (
        document
        .getElementById("name")
        .value
        || "PLAYER"
    )
    .trim()
    .slice(0,12)
    || "PLAYER";
}

/* =====================================
   LEADERBOARD
===================================== */

async function submitScore(){
    if(!supabaseClient){
        console.warn("No Supabase client. Score not saved.");
        return;
    }

    const name =
    getCleanName();

    const payload = {
        name,
        score:Number(score)
    };

    const { error } =
    await supabaseClient
    .from("scores")
    .insert([payload]);

    if(error){
        console.error(
            "Supabase insert failed:",
            error.message,
            error
        );
        return;
    }

    console.log("Score saved:", payload);
}

async function loadLeaderboard(targetId = "startLeaderboard"){
    const board =
    document
    .getElementById(targetId);

    if(!board) return;

    board.innerHTML =
    "<h3>TOP 10</h3>";

    if(!supabaseClient){
        board.innerHTML +=
        "<p>Leaderboard offline.</p>";
        return;
    }

    const { data, error } =
    await supabaseClient
    .from("scores")
    .select("name, score, created_at")
    .order(
        "score",
        {
            ascending:false
        }
    )
    .order(
        "created_at",
        {
            ascending:true
        }
    )
    .limit(10);

    if(error){
        console.error(
            "Supabase select failed:",
            error.message,
            error
        );

        board.innerHTML +=
        "<p>Leaderboard konnte nicht geladen werden.</p>";

        return;
    }

    if(!data || data.length === 0){
        board.innerHTML +=
        "<p>No scores yet.</p>";
        return;
    }

    data.forEach((s,i)=>{
        board.innerHTML += `
            <div class="scoreRow">
                <span>${i+1}. ${escapeHtml(s.name)}</span>
                <span>${Number(s.score)}</span>
            </div>
        `;
    });
}

/* =====================================
   START SCREEN MODE
===================================== */

function updateStartScreenMode(){
    const input =
    document.getElementById("name");

    const btn =
    document.getElementById("startBtn");

    if(waitingForNewName){
        input.style.display = "block";
        btn.textContent = "START";
    }else{
        input.style.display = "none";
        btn.textContent = "RETRY";
    }
}

function showStartScreen(resultType, finalScore){
    const headline =
    document.getElementById("resultHeadline");

    const resultScore =
    document.getElementById("resultScore");

    const title =
    document.getElementById("startTitle");

    title.textContent =
    "NEW RELEASE";

    if(resultType === "finish"){
        headline.textContent = "FINISH";
    }else if(resultType === "gameover"){
        headline.textContent = "GAME OVER";
    }else{
        headline.textContent = "";
    }

    if(typeof finalScore === "number"){
        resultScore.textContent =
        "SCORE: " + finalScore;
    }else{
        resultScore.textContent = "";
    }

    updateStartScreenMode();

    document
    .getElementById("start")
    .style.display = "flex";
}

/* =====================================
   END GAME
===================================== */

async function endGame(resultType = "gameover"){
    if(ending) return;

    ending = true;
    running = false;

    if(animationFrameId){
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
    }

    if(timerInterval){
        clearInterval(timerInterval);
        timerInterval = null;
    }

    song.pause();

    const finalScore =
    score;

    await submitScore();

    retryCount++;

    if(retryCount >= 6){
        waitingForNewName = true;
        retryCount = 0;
    }else{
        waitingForNewName = false;
    }

    showStartScreen(
        resultType,
        finalScore
    );

    await loadLeaderboard("startLeaderboard");

    ending = false;
}

/* =====================================
   RESET STATE
===================================== */

function resetGameState(){
    ending = false;
    running = false;

    if(animationFrameId){
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
    }

    if(timerInterval){
        clearInterval(timerInterval);
        timerInterval = null;
    }

    score = 0;
    time = 60;

    gameStartTime = 0;
    lastSpawnTime = 0;
    nextSpawnDelay = 1300;

    obstacles = [];
    particles = [];
    orbs = [];

    player.x =
    isMobile
        ? window.innerWidth * 0.22
        : window.innerWidth * 0.25;

    player.y =
    window.innerHeight * 0.5;

    player.vy = 0;

    document
    .getElementById("score")
    .innerText = score;

    document
    .getElementById("timer")
    .innerText = time;
}

/* =====================================
   START GAME
===================================== */

const startBtn =
document.getElementById("startBtn");

startBtn.addEventListener(
    "click",
    function(){
        startGame().catch(function(err){
            console.error("Start failed:", err);

            setStartStatus(
                "Start fehlgeschlagen. Bitte Browser-Konsole prüfen."
            );

            startBtn.disabled = false;
        });
    }
);

async function startGame(){
    console.log("START CLICKED");

    startBtn.disabled = true;
    setStartStatus("");

    const input =
    document.getElementById("name");

    if(input.style.display !== "none"){
        retryCount = 0;
        waitingForNewName = false;
    }

    const playerName =
    getCleanName();

    localStorage.setItem(
        "playerName",
        playerName
    );

    resetGameState();

    document
    .getElementById("start")
    .style.display = "none";

    try{
        song.currentTime = 0;
        await song.play();
    }catch(err){
        console.warn(
            "Audio blocked, game starts without audio:",
            err
        );
    }

    running = true;

    gameStartTime =
    performance.now();

    lastSpawnTime =
    performance.now();

    nextSpawnDelay =
    getSpawnDelay();

    loop();
    startTimer();

    startBtn.disabled = false;
}

/* =====================================
   INITIAL START SCREEN
===================================== */

waitingForNewName = true;
retryCount = 0;

showStartScreen(null);

loadLeaderboard("startLeaderboard").catch(err => {
    console.warn(
        "Initial leaderboard load failed:",
        err
    );
});
</script>
