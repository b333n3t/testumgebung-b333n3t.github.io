<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">

<title>Music Release Game 2.0</title>

<style>

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
    touch-action:none;
    color:white;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* overlays */
#start,
#end{

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at center,
    rgba(0,255,255,0.12),
    rgba(0,0,0,0.95));

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:10;

}

/* title */
h1{
    font-size:60px;
    margin-bottom:30px;

    text-shadow:
    0 0 10px cyan,
    0 0 30px cyan;
}

/* input */
input{

    width:240px;

    padding:14px;

    border:none;
    border-radius:12px;

    font-size:20px;
    text-align:center;

    margin-bottom:20px;
}

/* button */
button{

    padding:15px 34px;

    border:none;
    border-radius:12px;

    background:cyan;
    color:black;

    font-size:20px;
    font-weight:bold;

    box-shadow:
    0 0 10px cyan,
    0 0 30px cyan;

}

/* ui */
#ui{

    position:fixed;
    top:20px;
    left:20px;

    z-index:5;

    font-size:22px;
    font-weight:bold;

}

#timer{

    position:fixed;
    top:20px;
    right:20px;

    z-index:5;

    font-size:22px;
    font-weight:bold;

}

/* mobile */
@media(max-width:768px){

    h1{
        font-size:40px;
    }

    input{
        width:70%;
    }

}

</style>
</head>

<body>

<!-- START -->
<div id="start">

    <h1>NEW RELEASE</h1>

    <input
        id="name"
        placeholder="YOUR NAME"
        maxlength="12"
    >

    <button id="startBtn">
        START
    </button>

</div>

<!-- END -->
<div id="end" style="display:none;">

    <h2>GAME OVER</h2>

    <div id="final"></div>

    <br>

    <button onclick="location.reload()">
        RETRY
    </button>

</div>

<!-- UI -->
<div id="ui">
    SCORE:
    <span id="score">0</span>
</div>

<div id="timer">
    60
</div>

<!-- AUDIO -->
<audio
    id="song"
    src="assets/song.mp3"
    preload="auto"
></audio>

<!-- CANVAS -->
<canvas id="c"></canvas>

<script>

/* =====================================
   CANVAS
===================================== */

const c = document.getElementById("c");
const ctx = c.getContext("2d");

const DPR = window.devicePixelRatio || 1;

function resize(){

    c.width = window.innerWidth * DPR;
    c.height = window.innerHeight * DPR;

    c.style.width = window.innerWidth + "px";
    c.style.height = window.innerHeight + "px";

    ctx.setTransform(1,0,0,1,0,0);

    ctx.scale(DPR,DPR);

}

resize();

window.addEventListener("resize", resize);

/* =====================================
   GAME STATE
===================================== */

let running = false;

let score = 0;
let time = 60;

let speed = 6;

let flash = 0;

const song =
document.getElementById("song");

/* =====================================
   PLAYER
===================================== */

const player = {

    x:80,
    y:0,

    w:42,
    h:42,

    vy:0,

    jump:false

};

function resetPlayer(){

    player.y =
    window.innerHeight - 180;

}

/* =====================================
   OBJECTS
===================================== */

let obstacles = [];
let particles = [];

/* =====================================
   INPUT
===================================== */

function jump(){

    if(!running) return;

    if(!player.jump){

        player.vy = -17;
        player.jump = true;

        spawnParticles(
            player.x,
            player.y + 40,
            "cyan"
        );

    }

}

window.addEventListener(
    "touchstart",
    jump
);

window.addEventListener(
    "keydown",
    e => {

        if(e.code === "Space"){

            jump();

        }

    }
);

/* =====================================
   PARTICLES
===================================== */

function spawnParticles(x,y,color){

    for(let i=0;i<10;i++){

        particles.push({

            x,
            y,

            vx:(Math.random()-0.5)*4,
            vy:(Math.random()-0.5)*4,

            life:30,

            color

        });

    }

}

/* =====================================
   SPAWN
===================================== */

setInterval(() => {

    if(!running) return;

    obstacles.push({

        x:window.innerWidth,

        y:window.innerHeight - 160,

        w:40,
        h:60,

        passed:false

    });

},1200);

/* =====================================
   UPDATE
===================================== */

function update(){

    /* difficulty */
    speed += 0.0005;

    /* gravity */
    player.vy += 0.85;

    player.y += player.vy;

    const ground =
    window.innerHeight - 180;

    if(player.y > ground){

        player.y = ground;

        player.vy = 0;

        player.jump = false;

    }

    /* obstacles */
    obstacles.forEach(o => {

        o.x -= speed;

        /* collision */
        if(

            player.x < o.x + o.w &&
            player.x + player.w > o.x &&
            player.y < o.y + o.h &&
            player.y + player.h > o.y

        ){

            endGame();

        }

        /* score */
        if(!o.passed && o.x < player.x){

            o.passed = true;

            score += 5;

            flash = 8;

            spawnParticles(
                player.x,
                player.y,
                "gold"
            );

        }

    });

    obstacles =
    obstacles.filter(o => o.x > -100);

    /* particles */
    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

    });

    particles =
    particles.filter(p => p.life > 0);

    flash *= 0.9;

    /* ui */
    document
    .getElementById("score")
    .innerText = score;

}

/* =====================================
   DRAW
===================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    /* animated bg */
    const g = ctx.createLinearGradient(
        0,
        0,
        0,
        window.innerHeight
    );

    g.addColorStop(0,"#050816");
    g.addColorStop(1,"#000");

    ctx.fillStyle = g;

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    /* stars */
    for(let i=0;i<40;i++){

        ctx.fillStyle =
        "rgba(255,255,255,0.08)";

        ctx.fillRect(

            (i*140 +
            performance.now()*0.03)
            % window.innerWidth,

            i*20,

            2,
            2

        );

    }

    /* flash */
    if(flash > 1){

        ctx.fillStyle =
        `rgba(255,255,255,${flash*0.03})`;

        ctx.fillRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );

    }

    /* ground */
    ctx.fillStyle = "#111";

    ctx.fillRect(
        0,
        window.innerHeight - 100,
        window.innerWidth,
        100
    );

    /* player glow */
    ctx.shadowBlur = 25;
    ctx.shadowColor = "cyan";

    ctx.fillStyle = "cyan";

    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    /* obstacles */
    ctx.shadowBlur = 15;
    ctx.shadowColor = "red";

    ctx.fillStyle = "red";

    obstacles.forEach(o => {

        ctx.fillRect(
            o.x,
            o.y,
            o.w,
            o.h
        );

    });

    /* particles */
    ctx.shadowBlur = 0;

    particles.forEach(p => {

        ctx.fillStyle = p.color;

        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );

    });

}

/* =====================================
   LOOP
===================================== */

function loop(){

    if(!running) return;

    update();
    draw();

    requestAnimationFrame(loop);

}

/* =====================================
   TIMER
===================================== */

function startTimer(){

    const t = setInterval(() => {

        if(!running){

            clearInterval(t);
            return;

        }

        time--;

        document
        .getElementById("timer")
        .innerText = time;

        score++;

        if(time <= 0){

            clearInterval(t);

            endGame();

        }

    },1000);

}

/* =====================================
   END GAME
===================================== */

function endGame(){

    running = false;

    song.pause();

    const name =
    document.getElementById("name").value
    || "PLAYER";

    document
    .getElementById("final")
    .innerHTML = `

        <h3>${name}</h3>
        <p>SCORE: ${score}</p>

    `;

    document
    .getElementById("end")
    .style.display = "flex";

}

/* =====================================
   START
===================================== */

document
.getElementById("startBtn")
.onclick = async () => {

    running = true;

    resetPlayer();

    document
    .getElementById("start")
    .style.display = "none";

    try{

        await song.play();

    }catch(err){

        console.log(err);

    }

    loop();

    startTimer();

};

</script>

</body>
</html>
