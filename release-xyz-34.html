<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">

<title>Release Game 3.2</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
    touch-action:none;
    color:white;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* overlays */
#start,
#end{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10;
}

/* title */
h1{
    font-size:54px;
    margin-bottom:30px;
    letter-spacing:2px;
}

h2{
    font-size:38px;
    margin-bottom:26px;
    letter-spacing:1px;
}

/* input */
input{
    width:240px;
    padding:14px;
    border:none;
    border-radius:10px;
    text-align:center;
    font-size:20px;
    margin-bottom:20px;
    outline:none;
}

/* button */
button{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:white;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:0.55;
    cursor:not-allowed;
}

/* ui */
#ui{
    position:fixed;
    top:20px;
    left:20px;
    z-index:5;
    font-size:20px;
}

#timer{
    position:fixed;
    top:20px;
    right:20px;
    z-index:5;
    font-size:20px;
}

/* leaderboard */
#leaderboard,
#startLeaderboard{
    margin-top:24px;
    width:280px;
    text-align:left;
    font-size:16px;
}

#leaderboard h3,
#startLeaderboard h3{
    text-align:center;
    margin-bottom:8px;
    font-size:22px;
}

.scoreRow{
    display:flex;
    justify-content:space-between;
    gap:14px;
    padding:5px 0;
    border-bottom:1px solid rgba(255,255,255,0.12);
}

.scoreRow span:first-child{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.statusText{
    margin-top:12px;
    font-size:13px;
    opacity:0.75;
    max-width:280px;
    text-align:center;
    line-height:1.4;
}

/* mobile */
@media(max-width:768px){
    h1{
        font-size:40px;
    }

    h2{
        font-size:32px;
    }

    input{
        width:70%;
    }

    #ui,
    #timer{
        font-size:18px;
    }
}
</style>
</head>

<body>

<!-- START -->
<div id="start">

    <h1>NEW RELEASE</h1>

    <input
        id="name"
        placeholder="YOUR NAME"
        maxlength="12"
        autocomplete="off"
    >

    <button id="startBtn" type="button">
        START
    </button>

    <div id="startStatus" class="statusText"></div>

    <div id="startLeaderboard"></div>

</div>

<!-- END -->
<div id="end" style="display:none;">

    <h2 id="endTitle">GAME OVER</h2>

    <div id="final"></div>

    <br>

    <button type="button" onclick="retryGame()">
        RETRY
    </button>

    <div id="leaderboard"></div>

</div>

<!-- UI -->
<div id="ui">

    SCORE:
    <span id="score">0</span>

</div>

<div id="timer">

    60

</div>

<!-- AUDIO -->
<audio
    id="song"
    src="assets/release/drei-viertel.prelisten.mp3"
    preload="auto"
></audio>

<!-- CANVAS -->
<canvas id="c"></canvas>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* =====================================
   SUPABASE CONFIG
===================================== */

let supabaseClient = null;

const SUPABASE_URL =
    "https://xqucqbyzklmptyjgghgo.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MRJcYGadARj5Es6fiNcD2A_FJyZ_bX3";

function setStartStatus(text){
    const el =
    document.getElementById("startStatus");

    if(el){
        el.textContent = text || "";
    }
}

if(typeof window.supabase !== "undefined"){
    try{
        supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        console.log("Supabase client created");

    }catch(err){
        console.error("Supabase init failed:", err);
        setStartStatus("Leaderboard offline. Game funktioniert trotzdem.");
    }
}else{
    console.error("Supabase library missing. CDN not loaded.");
    setStartStatus("Leaderboard offline. Game funktioniert trotzdem.");
}

/* =====================================
   RETRIES
===================================== */

let retries =
parseInt(
    localStorage.getItem("retries"),
    10
) || 0;

/* =====================================
   CANVAS
===================================== */

const c =
document.getElementById("c");

const ctx =
c.getContext("2d");

const DPR =
window.devicePixelRatio || 1;

function resize(){

    c.width =
    Math.floor(window.innerWidth * DPR);

    c.height =
    Math.floor(window.innerHeight * DPR);

    c.style.width =
    window.innerWidth + "px";

    c.style.height =
    window.innerHeight + "px";

    ctx.setTransform(
        1,0,0,1,0,0
    );

    ctx.scale(DPR,DPR);

}

resize();

window.addEventListener(
    "resize",
    resize
);

/* =====================================
   MOBILE
===================================== */

const isMobile =
window.innerWidth < 768;

/* =====================================
   STATE
===================================== */

let running = false;
let ending = false;

let score = 0;
let time = 60;

let timerInterval = null;
let animationFrameId = null;

let speed =
isMobile ? 4.2 : 5.2;

const song =
document.getElementById("song");

/* =====================================
   SAVED NAME
===================================== */

const savedName =
localStorage.getItem("playerName");

if(savedName){

    document
    .getElementById("name")
    .value = savedName;

}

/* =====================================
   PLAYER
===================================== */

const player = {

    x:isMobile
        ? window.innerWidth * 0.22
        : window.innerWidth * 0.25,

    y:window.innerHeight * 0.5,

    w:isMobile ? 48 : 40,
    h:isMobile ? 48 : 40,

    vy:0

};

/* =====================================
   OBJECTS
===================================== */

let obstacles = [];
let particles = [];
let orbs = [];

/* =====================================
   DESKTOP CONTROLS
===================================== */

function moveUp(){

    if(!running) return;

    player.vy =
    isMobile ? -7 : -9;

}

function moveDown(){

    if(!running) return;

    player.vy =
    isMobile ? 7 : 9;

}

window.addEventListener(
    "keydown",
    e => {

        if(
            e.code === "ArrowUp" ||
            e.code === "KeyW" ||
            e.code === "Space"
        ){

            e.preventDefault();
            moveUp();

        }

        if(
            e.code === "ArrowDown" ||
            e.code === "KeyS"
        ){

            e.preventDefault();
            moveDown();

        }

    }
);

/* =====================================
   MOBILE TOUCH
===================================== */

window.addEventListener(
    "touchmove",
    e => {

        if(!running) return;

        e.preventDefault();

        const touch =
        e.touches[0];

        const y =
        touch.clientY;

        player.y +=
        (
            y
            -
            player.y
            -
            player.h/2
        ) * 0.25;

    },
    { passive:false }
);

/* =====================================
   PARTICLES
===================================== */

function spawnParticles(x,y){

    for(let i=0;i<30;i++){

        particles.push({

            x,
            y,

            vx:
            (Math.random()-0.5)*6,

            vy:
            (Math.random()-0.5)*6,

            life:40

        });

    }

}

/* =====================================
   SAFE ORBS
===================================== */

function orbInsideObstacle(x,y){

    for(let o of obstacles){

        if(

            x > o.x &&
            x < o.x + o.w &&
            y > o.y &&
            y < o.y + o.h

        ){

            return true;

        }

    }

    return false;

}

/* =====================================
   SPAWN
===================================== */

setInterval(() => {

    if(!running) return;

    const lane =
    Math.floor(Math.random()*3);

    const heights =
    isMobile
    ? [40,70,100]
    : [40,80,140];

    const widths =
    isMobile
    ? [60,100,140]
    : [60,120,180];

    const h =
    heights[
        Math.floor(
            Math.random()
            *
            heights.length
        )
    ];

    const w =
    widths[
        Math.floor(
            Math.random()
            *
            widths.length
        )
    ];

    let y;

    if(lane === 0){

        y = 80;

    }

    if(lane === 1){

        y =
        window.innerHeight/2
        -
        h/2;

    }

    if(lane === 2){

        y =
        window.innerHeight
        -
        180
        -
        h;

    }

    obstacles.push({

        x:
        window.innerWidth + 100,

        y,

        w,
        h,

        passed:false

    });

    if(Math.random() > 0.65){

        let orbX =
        window.innerWidth + 260;

        let orbY;
        let safe = false;
        let attempts = 0;

        while(!safe && attempts < 25){

            attempts++;

            orbY =
            Math.random()
            *
            (
                window.innerHeight
                -
                260
            )
            + 100;

            safe =
            !orbInsideObstacle(
                orbX,
                orbY
            );

        }

        if(safe){

            orbs.push({

                x:orbX,
                y:orbY,

                r:12,

                taken:false

            });

        }

    }

},1200);

/* =====================================
   UPDATE
===================================== */

function update(){

    speed +=
    isMobile
    ? 0.00035
    : 0.00045;

    player.y += player.vy;

    player.vy *= 0.90;

    if(player.y < 40){

        player.y = 40;

    }

    if(
        player.y >
        window.innerHeight - 140
    ){

        player.y =
        window.innerHeight - 140;

    }

    obstacles.forEach(o => {

        o.x -= speed;

        if(

            player.x < o.x + o.w &&
            player.x + player.w > o.x &&
            player.y < o.y + o.h &&
            player.y + player.h > o.y

        ){

            endGame("gameover");

        }

        if(
            !o.passed &&
            o.x < player.x
        ){

            o.passed = true;

            score += 10;

            if(score % 100 === 0){

                spawnParticles(
                    player.x,
                    player.y
                );

            }

        }

    });

    orbs.forEach(o => {

        o.x -= speed;

        const dx =
        (
            player.x
            +
            player.w/2
        )
        - o.x;

        const dy =
        (
            player.y
            +
            player.h/2
        )
        - o.y;

        const dist =
        Math.sqrt(
            dx*dx + dy*dy
        );

        if(
            dist < 30 &&
            !o.taken
        ){

            o.taken = true;

            score += 25;

            spawnParticles(
                o.x,
                o.y
            );

        }

    });

    obstacles =
    obstacles.filter(
        o => o.x > -300
    );

    orbs =
    orbs.filter(
        o =>
        o.x > -100 &&
        !o.taken
    );

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

    });

    particles =
    particles.filter(
        p => p.life > 0
    );

    document
    .getElementById("score")
    .innerText = score;

}

/* =====================================
   DRAW
===================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    ctx.fillStyle = "#050816";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    for(let i=0;i<20;i++){

        ctx.fillStyle =
        "rgba(255,255,255,0.03)";

        ctx.fillRect(

            (
                i*180
                -
                performance.now()*0.05
            )
            %
            window.innerWidth,

            i*60,

            120,
            1

        );

    }

    ctx.fillStyle = "white";

    ctx.fillRect(

        player.x,
        player.y,

        player.w,
        player.h

    );

    ctx.fillStyle = "red";

    obstacles.forEach(o => {

        ctx.fillRect(

            o.x,
            o.y,

            o.w,
            o.h

        );

    });

    ctx.fillStyle = "gold";

    orbs.forEach(o => {

        ctx.beginPath();

        ctx.arc(

            o.x,
            o.y,

            o.r,

            0,
            Math.PI*2

        );

        ctx.fill();

    });

    particles.forEach(p => {

        ctx.globalAlpha =
        p.life / 40;

        ctx.fillStyle =
        "white";

        ctx.fillRect(

            p.x,
            p.y,

            4,
            4

        );

    });

    ctx.globalAlpha = 1;

}

/* =====================================
   LOOP
===================================== */

function loop(){

    if(!running) return;

    update();
    draw();

    animationFrameId =
    requestAnimationFrame(loop);

}

/* =====================================
   TIMER
===================================== */

function startTimer(){

    if(timerInterval){

        clearInterval(timerInterval);

    }

    timerInterval =
    setInterval(() => {

        if(!running){

            clearInterval(timerInterval);
            timerInterval = null;

            return;

        }

        time--;

        document
        .getElementById("timer")
        .innerText = time;

        score++;

        if(time <= 0){

            clearInterval(timerInterval);
            timerInterval = null;

            endGame("finish");

        }

    },1000);

}

/* =====================================
   HELPERS
===================================== */

function escapeHtml(value){

    return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function getCleanName(){

    return (
        document
        .getElementById("name")
        .value
        || "PLAYER"
    )
    .trim()
    .slice(0,12)
    || "PLAYER";

}

/* =====================================
   LEADERBOARD
===================================== */

async function submitScore(){

    if(!supabaseClient){

        console.warn(
            "No Supabase client. Score not saved."
        );

        return;

    }

    const name =
    getCleanName();

    const payload = {
        name,
        score:Number(score)
    };

    const { error } =
    await supabaseClient
    .from("scores")
    .insert([payload]);

    if(error){

        console.error(
            "Supabase insert failed:",
            error.message,
            error
        );

        return;

    }

    console.log(
        "Score saved:",
        payload
    );

}

async function loadLeaderboard(targetId = "leaderboard"){

    const board =
    document
    .getElementById(targetId);

    if(!board) return;

    board.innerHTML =
    "<h3>TOP 10</h3>";

    if(!supabaseClient){

        board.innerHTML +=
        "<p>Leaderboard offline.</p>";

        return;

    }

    const { data, error } =
    await supabaseClient
    .from("scores")
    .select("name, score, created_at")
    .order(
        "score",
        {
            ascending:false
        }
    )
    .order(
        "created_at",
        {
            ascending:true
        }
    )
    .limit(10);

    if(error){

        console.error(
            "Supabase select failed:",
            error.message,
            error
        );

        board.innerHTML +=
        "<p>Leaderboard konnte nicht geladen werden.</p>";

        return;

    }

    if(!data || data.length === 0){

        board.innerHTML +=
        "<p>No scores yet.</p>";

        return;

    }

    data.forEach((s,i)=>{

        board.innerHTML += `

            <div class="scoreRow">

                <span>
                    ${i+1}. ${escapeHtml(s.name)}
                </span>

                <span>
                    ${Number(s.score)}
                </span>

            </div>

        `;

    });

}

/* =====================================
   END
===================================== */

async function endGame(resultType = "gameover"){

    if(ending) return;

    ending = true;

    running = false;

    if(animationFrameId){

        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;

    }

    if(timerInterval){

        clearInterval(timerInterval);
        timerInterval = null;

    }

    song.pause();

    const name =
    getCleanName();

    const headline =
    resultType === "finish"
    ? "FINISH"
    : "GAME OVER";

    document
    .getElementById("endTitle")
    .textContent = headline;

    document
    .getElementById("final")
    .innerHTML = `

        <h3>${escapeHtml(name)}</h3>

        <p>
            SCORE: ${score}
        </p>

    `;

    document
    .getElementById("end")
    .style.display = "flex";

    await submitScore();

    await loadLeaderboard("leaderboard");

    ending = false;

}

/* =====================================
   RESET STATE
===================================== */

function resetGameState(){

    ending = false;
    running = false;

    if(animationFrameId){

        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;

    }

    if(timerInterval){

        clearInterval(timerInterval);
        timerInterval = null;

    }

    score = 0;
    time = 60;

    speed =
    isMobile ? 4.2 : 5.2;

    obstacles = [];
    particles = [];
    orbs = [];

    player.x =
    isMobile
        ? window.innerWidth * 0.22
        : window.innerWidth * 0.25;

    player.y =
    window.innerHeight * 0.5;

    player.vy = 0;

    document
    .getElementById("score")
    .innerText = score;

    document
    .getElementById("timer")
    .innerText = time;

}

/* =====================================
   RESTART
===================================== */

function restartGame(){

    resetGameState();

    document
    .getElementById("end")
    .style.display = "none";

    song.currentTime = 0;

    song.play().catch(err => {

        console.warn(
            "Audio blocked:",
            err
        );

    });

    running = true;

    loop();

    startTimer();

}

/* =====================================
   BACK TO START AFTER 3 RETRIES
===================================== */

async function goBackToReleaseStart(){

    resetGameState();

    song.pause();
    song.currentTime = 0;

    retries = 0;

    localStorage.setItem(
        "retries",
        "0"
    );

    document
    .getElementById("end")
    .style.display = "none";

    document
    .getElementById("start")
    .style.display = "flex";

    await loadLeaderboard("startLeaderboard");

}

/* =====================================
   RETRY
===================================== */

async function retryGame(){

    retries++;

    localStorage.setItem(
        "retries",
        String(retries)
    );

    if(retries >= 3){

        await goBackToReleaseStart();

        return;

    }

    restartGame();

}

window.retryGame = retryGame;

/* =====================================
   START GAME
===================================== */

const startBtn =
document.getElementById(
    "startBtn"
);

startBtn.addEventListener(
    "click",
    function(){

        startGame().catch(function(err){

            console.error(
                "Start failed:",
                err
            );

            setStartStatus(
                "Start fehlgeschlagen. Bitte Browser-Konsole prüfen."
            );

            startBtn.disabled = false;

        });

    }
);

async function startGame(){

    console.log(
        "START CLICKED"
    );

    startBtn.disabled = true;

    setStartStatus("");

    retries = 0;

    localStorage.setItem(
        "retries",
        "0"
    );

    const playerName =
    getCleanName();

    localStorage.setItem(
        "playerName",
        playerName
    );

    resetGameState();

    document
    .getElementById("start")
    .style.display = "none";

    try{

        song.currentTime = 0;

        await song.play();

    }catch(err){

        console.warn(
            "Audio blocked, game starts without audio:",
            err
        );

    }

    running = true;

    loop();

    startTimer();

    startBtn.disabled = false;

}

/* =====================================
   INITIAL LEADERBOARD ON START SCREEN
===================================== */

loadLeaderboard("startLeaderboard").catch(err => {

    console.warn(
        "Initial leaderboard load failed:",
        err
    );

});
</script>

</body>
</html>
