<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Release Game 1.0</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial;
    touch-action: none;
    color: white;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
}

#start, #end {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

input {
    padding: 12px;
    font-size: 18px;
    text-align: center;
    margin-bottom: 10px;
}

button {
    padding: 14px 28px;
    font-size: 18px;
    border: none;
    background: cyan;
    color: black;
    border-radius: 10px;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 5;
}

#timer {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 5;
}
</style>
</head>

<body>

<!-- START -->
<div id="start">
    <h1>NEW RELEASE</h1>
    <input id="name" placeholder="YOUR NAME">
    <button id="startBtn">START</button>
</div>

<!-- END -->
<div id="end" style="display:none;">
    <h2>GAME OVER</h2>
    <div id="final"></div>
    <button onclick="location.reload()">RETRY</button>
</div>

<div id="ui">SCORE: <span id="score">0</span></div>
<div id="timer">60</div>

<audio id="song" src="assets/song.mp3"></audio>

<canvas id="c"></canvas>

<script>
/* =========================
   CANVAS
========================= */
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
    c.width = innerWidth;
    c.height = innerHeight;
}
resize();
addEventListener("resize", resize);

/* =========================
   GAME STATE
========================= */
let running = false;
let score = 0;
let time = 60;

const song = document.getElementById("song");

/* =========================
   PLAYER
========================= */
const player = {
    x: 80,
    y: 300,
    w: 40,
    h: 40,
    vy: 0,
    jump: false
};

let obstacles = [];

/* =========================
   INPUT
========================= */
function jump(){
    if(!running) return;

    if(!player.jump){
        player.vy = -16;
        player.jump = true;
    }
}

addEventListener("touchstart", jump);
addEventListener("keydown", e => {
    if(e.code === "Space") jump();
});

/* =========================
   SPAWN
========================= */
setInterval(() => {
    if(!running) return;

    obstacles.push({
        x: c.width,
        y: c.height - 140,
        w: 40,
        h: 60
    });

}, 1200);

/* =========================
   UPDATE
========================= */
function update(){

    player.vy += 0.8;
    player.y += player.vy;

    const ground = c.height - 140;

    if(player.y > ground){
        player.y = ground;
        player.vy = 0;
        player.jump = false;
    }

    obstacles.forEach(o => {
        o.x -= 6;

        if(
            player.x < o.x + o.w &&
            player.x + player.w > o.x &&
            player.y < o.y + o.h &&
            player.y + player.h > o.y
        ){
            endGame();
        }

        if(!o.passed && o.x < player.x){
            o.passed = true;
            score += 5;
        }
    });

    document.getElementById("score").innerText = score;
}

/* =========================
   DRAW
========================= */
function draw(){

    ctx.clearRect(0,0,c.width,c.height);

    ctx.fillStyle = "#050816";
    ctx.fillRect(0,0,c.width,c.height);

    // ground
    ctx.fillStyle = "#111";
    ctx.fillRect(0,c.height-100,c.width,100);

    // player
    ctx.fillStyle = "cyan";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // obstacles
    ctx.fillStyle = "red";
    obstacles.forEach(o => {
        ctx.fillRect(o.x,o.y,o.w,o.h);
    });
}

/* =========================
   LOOP
========================= */
function loop(){
    if(!running) return;
    update();
    draw();
    requestAnimationFrame(loop);
}

/* =========================
   TIMER
========================= */
function startTimer(){

    const t = setInterval(() => {

        time--;
        document.getElementById("timer").innerText = time;

        score++;

        if(time <= 0){
            clearInterval(t);
            endGame();
        }

    },1000);
}

/* =========================
   END GAME
========================= */
function endGame(){

    running = false;
    song.pause();

    const name = document.getElementById("name").value || "PLAYER";

    document.getElementById("final").innerText =
        `${name}: ${score}`;

    document.getElementById("end").style.display = "flex";
}

/* =========================
   START GAME
========================= */
document.getElementById("startBtn").onclick = async () => {

    running = true;

    document.getElementById("start").style.display = "none";

    await song.play();

    loop();
    startTimer();
};
</script>

</body>
</html>
