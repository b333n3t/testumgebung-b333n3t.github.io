<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover">

<title>Release Game 3.2</title>

<style>

html, body{

    margin:0;
    width:100%;
    height:100%;

    overflow:hidden;

    background:black;

    font-family:Arial,sans-serif;

    touch-action:none;

    color:white;

}

canvas{

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

}

/* overlays */
#start,
#end{

    position:fixed;
    inset:0;

    background:black;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    z-index:10;

}

/* title */
h1{

    font-size:54px;

    margin-bottom:30px;

    letter-spacing:2px;

}

/* input */
input{

    width:240px;

    padding:14px;

    border:none;
    border-radius:10px;

    text-align:center;

    font-size:20px;

    margin-bottom:20px;

    outline:none;

}

/* button */
button{

    padding:15px 30px;

    border:none;
    border-radius:10px;

    background:white;
    color:black;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

}

/* ui */
#ui{

    position:fixed;

    top:20px;
    left:20px;

    z-index:5;

    font-size:20px;

}

#timer{

    position:fixed;

    top:20px;
    right:20px;

    z-index:5;

    font-size:20px;

}

/* leaderboard */
#leaderboard{

    margin-top:20px;

    width:260px;

    text-align:left;

    font-size:16px;

}

.scoreRow{

    display:flex;

    justify-content:space-between;

    padding:4px 0;

    border-bottom:
    1px solid rgba(255,255,255,0.1);

}

/* mobile */
@media(max-width:768px){

    h1{

        font-size:40px;

    }

    input{

        width:70%;

    }

}

</style>
</head>

<body>

<!-- START -->
<div id="start">

    <h1>NEW RELEASE</h1>

    <input
        id="name"
        placeholder="YOUR NAME"
        maxlength="12"
    >

    <button id="startBtn">
        START
    </button>

</div>

<!-- END -->
<div id="end" style="display:none;">

    <h2>GAME OVER</h2>

    <div id="final"></div>

    <br>

    <button onclick="retryGame()">
        RETRY
    </button>

    <div id="leaderboard"></div>

</div>

<!-- UI -->
<div id="ui">

    SCORE:
    <span id="score">0</span>

</div>

<div id="timer">

    60

</div>

<!-- AUDIO -->
<audio
    id="song"
    src="assets/release/drei-viertel.prelisten.mp3"
    preload="auto"
></audio>

<!-- CANVAS -->
<canvas id="c"></canvas>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

/* =====================================
   SAFE SUPABASE
===================================== */

let supabase = null;

/*
IMPORTANT:

REPLACE "test"
WITH YOUR REAL
SUPABASE ANON KEY
LATER
*/

if(
    typeof window.supabase !==
    "undefined"
){

    try{

        supabase =
        window.supabase.createClient(

            "https://xqucqbyzklmptyjgghgo.supabase.co",

            "test"

        );

        console.log(
            "Supabase connected"
        );

    }catch(err){

        console.log(
            "Supabase failed"
        );

    }

}else{

    console.log(
        "Supabase missing"
    );

}

/* =====================================
   RETRIES
===================================== */

let retries =
parseInt(
    localStorage.getItem("retries")
) || 0;

/* =====================================
   CANVAS
===================================== */

const c =
document.getElementById("c");

const ctx =
c.getContext("2d");

const DPR =
window.devicePixelRatio || 1;

function resize(){

    c.width =
    window.innerWidth * DPR;

    c.height =
    window.innerHeight * DPR;

    c.style.width =
    window.innerWidth + "px";

    c.style.height =
    window.innerHeight + "px";

    ctx.setTransform(
        1,0,0,1,0,0
    );

    ctx.scale(DPR,DPR);

}

resize();

window.addEventListener(
    "resize",
    resize
);

/* =====================================
   MOBILE
===================================== */

const isMobile =
window.innerWidth < 768;

/* =====================================
   STATE
===================================== */

let running = false;

let score = 0;
let time = 60;

/* easier start */
let speed =
isMobile ? 4.2 : 5.2;

const song =
document.getElementById("song");

/* =====================================
   SAVED NAME
===================================== */

const savedName =
localStorage.getItem("playerName");

if(savedName){

    document
    .getElementById("name")
    .value = savedName;

}

/* =====================================
   PLAYER
===================================== */

const player = {

    x:isMobile
        ? window.innerWidth * 0.22
        : window.innerWidth * 0.25,

    y:window.innerHeight * 0.5,

    w:isMobile ? 48 : 40,
    h:isMobile ? 48 : 40,

    vy:0

};

/* =====================================
   OBJECTS
===================================== */

let obstacles = [];
let particles = [];
let orbs = [];

/* =====================================
   DESKTOP CONTROLS
===================================== */

function moveUp(){

    if(!running) return;

    player.vy =
    isMobile ? -7 : -9;

}

function moveDown(){

    if(!running) return;

    player.vy =
    isMobile ? 7 : 9;

}

window.addEventListener(
    "keydown",
    e => {

        if(
            e.code === "ArrowUp" ||
            e.code === "KeyW" ||
            e.code === "Space"
        ){

            moveUp();

        }

        if(
            e.code === "ArrowDown" ||
            e.code === "KeyS"
        ){

            moveDown();

        }

    }
);

/* =====================================
   MOBILE TOUCH
===================================== */

window.addEventListener(
    "touchmove",
    e => {

        if(!running) return;

        e.preventDefault();

        const touch =
        e.touches[0];

        const y =
        touch.clientY;

        player.y +=
        (
            y
            -
            player.y
            -
            player.h/2
        ) * 0.25;

    },
    { passive:false }
);

/* =====================================
   PARTICLES
===================================== */

function spawnParticles(x,y){

    for(let i=0;i<30;i++){

        particles.push({

            x,
            y,

            vx:
            (Math.random()-0.5)*6,

            vy:
            (Math.random()-0.5)*6,

            life:40

        });

    }

}

/* =====================================
   SAFE ORBS
===================================== */

function orbInsideObstacle(x,y){

    for(let o of obstacles){

        if(

            x > o.x &&
            x < o.x + o.w &&
            y > o.y &&
            y < o.y + o.h

        ){

            return true;

        }

    }

    return false;

}

/* =====================================
   SPAWN
===================================== */

setInterval(() => {

    if(!running) return;

    const lane =
    Math.floor(Math.random()*3);

    const heights =
    isMobile
    ? [40,70,100]
    : [40,80,140];

    const widths =
    isMobile
    ? [60,100,140]
    : [60,120,180];

    const h =
    heights[
        Math.floor(
            Math.random()
            *
            heights.length
        )
    ];

    const w =
    widths[
        Math.floor(
            Math.random()
            *
            widths.length
        )
    ];

    let y;

    if(lane === 0){

        y = 80;

    }

    if(lane === 1){

        y =
        window.innerHeight/2
        -
        h/2;

    }

    if(lane === 2){

        y =
        window.innerHeight
        -
        180
        -
        h;

    }

    obstacles.push({

        x:
        window.innerWidth + 100,

        y,

        w,
        h,

        passed:false

    });

    /* safe orb spawn */
    if(Math.random() > 0.65){

        let orbX =
        window.innerWidth + 260;

        let orbY;
        let safe = false;

        while(!safe){

            orbY =
            Math.random()
            *
            (
                window.innerHeight
                -
                260
            )
            + 100;

            safe =
            !orbInsideObstacle(
                orbX,
                orbY
            );

        }

        orbs.push({

            x:orbX,
            y:orbY,

            r:12,

            taken:false

        });

    }

},1200);

/* =====================================
   UPDATE
===================================== */

function update(){

    /* progressive difficulty */
    speed +=
    isMobile
    ? 0.00035
    : 0.00045;

    player.y += player.vy;

    player.vy *= 0.90;

    /* limits */
    if(player.y < 40){

        player.y = 40;

    }

    if(
        player.y >
        window.innerHeight - 140
    ){

        player.y =
        window.innerHeight - 140;

    }

    /* obstacles */
    obstacles.forEach(o => {

        o.x -= speed;

        /* collision */
        if(

            player.x < o.x + o.w &&
            player.x + player.w > o.x &&
            player.y < o.y + o.h &&
            player.y + player.h > o.y

        ){

            endGame();

        }

        /* passed */
        if(
            !o.passed &&
            o.x < player.x
        ){

            o.passed = true;

            score += 10;

            if(score % 100 === 0){

                spawnParticles(
                    player.x,
                    player.y
                );

            }

        }

    });

    /* orbs */
    orbs.forEach(o => {

        o.x -= speed;

        const dx =
        (
            player.x
            +
            player.w/2
        )
        - o.x;

        const dy =
        (
            player.y
            +
            player.h/2
        )
        - o.y;

        const dist =
        Math.sqrt(
            dx*dx + dy*dy
        );

        if(
            dist < 30 &&
            !o.taken
        ){

            o.taken = true;

            score += 25;

            spawnParticles(
                o.x,
                o.y
            );

        }

    });

    obstacles =
    obstacles.filter(
        o => o.x > -300
    );

    orbs =
    orbs.filter(
        o =>
        o.x > -100 &&
        !o.taken
    );

    /* particles */
    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

    });

    particles =
    particles.filter(
        p => p.life > 0
    );

    document
    .getElementById("score")
    .innerText = score;

}

/* =====================================
   DRAW
===================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    /* bg */
    ctx.fillStyle = "#050816";

    ctx.fillRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    /* moving lines */
    for(let i=0;i<20;i++){

        ctx.fillStyle =
        "rgba(255,255,255,0.03)";

        ctx.fillRect(

            (
                i*180
                -
                performance.now()*0.05
            )
            %
            window.innerWidth,

            i*60,

            120,
            1

        );

    }

    /* player */
    ctx.fillStyle = "white";

    ctx.fillRect(

        player.x,
        player.y,

        player.w,
        player.h

    );

    /* obstacles */
    ctx.fillStyle = "red";

    obstacles.forEach(o => {

        ctx.fillRect(

            o.x,
            o.y,

            o.w,
            o.h

        );

    });

    /* orbs */
    ctx.fillStyle = "gold";

    orbs.forEach(o => {

        ctx.beginPath();

        ctx.arc(

            o.x,
            o.y,

            o.r,

            0,
            Math.PI*2

        );

        ctx.fill();

    });

    /* particles */
    particles.forEach(p => {

        ctx.globalAlpha =
        p.life / 40;

        ctx.fillStyle =
        "white";

        ctx.fillRect(

            p.x,
            p.y,

            4,
            4

        );

    });

    ctx.globalAlpha = 1;

}

/* =====================================
   LOOP
===================================== */

function loop(){

    if(!running) return;

    update();
    draw();

    requestAnimationFrame(loop);

}

/* =====================================
   TIMER
===================================== */

function startTimer(){

    const t =
    setInterval(() => {

        if(!running){

            clearInterval(t);

            return;

        }

        time--;

        document
        .getElementById("timer")
        .innerText = time;

        score++;

        if(time <= 0){

            clearInterval(t);

            endGame();

        }

    },1000);

}

/* =====================================
   LEADERBOARD
===================================== */

async function submitScore(){

    if(!supabase) return;

    const name =
    document
    .getElementById("name")
    .value
    || "PLAYER";

    try{

        await supabase
        .from("scores")
        .insert([
            {
                name,
                score
            }
        ]);

    }catch(err){

        console.log(err);

    }

}

async function loadLeaderboard(){

    if(!supabase) return;

    try{

        const { data } =
        await supabase
        .from("scores")
        .select("*")
        .order(
            "score",
            {
                ascending:false
            }
        )
        .limit(10);

        const board =
        document
        .getElementById("leaderboard");

        board.innerHTML =
        "<h3>TOP 10</h3>";

        data.forEach((s,i)=>{

            board.innerHTML += `

                <div class="scoreRow">

                    <span>
                        ${i+1}. ${s.name}
                    </span>

                    <span>
                        ${s.score}
                    </span>

                </div>

            `;

        });

    }catch(err){

        console.log(err);

    }

}

/* =====================================
   END
===================================== */

async function endGame(){

    running = false;

    song.pause();

    const name =
    document
    .getElementById("name")
    .value
    || "PLAYER";

    document
    .getElementById("final")
    .innerHTML = `

        <h3>${name}</h3>

        <p>
            SCORE: ${score}
        </p>

    `;

    document
    .getElementById("end")
    .style.display = "flex";

    await submitScore();

    await loadLeaderboard();

}

/* =====================================
   RESTART
===================================== */

function restartGame(){

    running = false;

    score = 0;
    time = 60;

    speed =
    isMobile ? 4.2 : 5.2;

    obstacles = [];
    particles = [];
    orbs = [];

    player.y =
    window.innerHeight * 0.5;

    player.vy = 0;

    document
    .getElementById("score")
    .innerText = score;

    document
    .getElementById("timer")
    .innerText = time;

    document
    .getElementById("end")
    .style.display = "none";

    song.currentTime = 0;

    song.play();

    running = true;

    loop();

    startTimer();

}

/* =====================================
   RETRY
===================================== */

function retryGame(){

    retries++;

    localStorage.setItem(
        "retries",
        retries
    );

    if(retries >= 10){

        localStorage.removeItem(
            "playerName"
        );

        localStorage.setItem(
            "retries",
            0
        );

    }

    restartGame();

}

/* =====================================
   START GAME
===================================== */

const startBtn =
document.getElementById(
    "startBtn"
);

startBtn.addEventListener(
    "click",
    startGame
);

async function startGame(){

    console.log(
        "START CLICKED"
    );

    const playerName =
    document
    .getElementById("name")
    .value
    || "PLAYER";

    localStorage.setItem(
        "playerName",
        playerName
    );

    running = true;

    document
    .getElementById("start")
    .style.display = "none";

    try{

        await song.play();

    }catch(err){

        console.log(
            "Audio blocked",
            err
        );

    }

    loop();

    startTimer();

}

</script>

</body>
</html>
