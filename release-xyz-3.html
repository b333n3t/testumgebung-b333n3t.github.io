    /* =========================================================
       MOBILE  (≤ 768px)

       Technik für Comic-Blase:
       - SVG mit echtem Comic-Zacken-Pfad als Clip-Maske
       - Das Video liegt als normales <video>-Tag im DOM
       - SVG clipPath wird per CSS clip-path: url(#...) auf das
         Video-Element angewendet (funktioniert auf iOS Safari)
       - Weißer Rand: identischer Pfad als SVG-Stroke obendrüber

       Layout:
         [comic-bubble + buttons oben links]
                                [person unten rechts]
       ========================================================= */

    @media (max-width: 768px) {

      .page-wrap { padding: 2rem 1rem 3rem; }

        display: block;
        position: relative;
        width: 100%;
        /* Höhe: SVG-Szene ist quadratisch (100vw - 2rem padding),
           plus Überstand der Person nach unten */
        padding-bottom: 0;
        margin-bottom: 0;
      }

      /* ---- SVG-Container für Blase + Rand + Buttons ----
         Das SVG hat ein festes viewBox-Verhältnis.
         Die Person sitzt absolut rechts unten AUSSERHALB des SVG. */

      .mobile-comic-wrap {
        position: relative;
        width: 100%;
      }

      /* Das SVG nimmt die volle Breite – Höhe ergibt sich aus viewBox */
      .mobile-comic-svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      /* Video hinter dem SVG – exakt über den Clip-Bereich gelegt.
         Wir positionieren es absolut innerhalb .mobile-comic-wrap
         und clippen es per clip-path mit dem SVG-Pfad. */

      .mobile-video-container {
        position: absolute;
        /* Diese Werte entsprechen der viewBox-Position des Videoinhalts
           relativ zur SVG-Breite. viewBox ist 400×300.
           Clip-Pfad geht von ca. x=18 bis x=382, y=8 bis y=280.
           → Video füllt den ganzen SVG-Bereich */
        top: 0; left: 0; right: 0; bottom: 0;
        overflow: hidden;
        /* clip-path via inline SVG referenz */
        -webkit-clip-path: url(#mobileBubbleClip);
                clip-path: url(#mobileBubbleClip);
      }

      .mobile-bubble-video {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;

        display: block;
        background: #000;

  <script>
    (function () {
      const targetDate = new Date("2026-01-09T00:00:00+01:00").getTime();
      const el = document.getElementById("awb-countdown-timer");
      if (!el) return;
      function update() {
        const diff = targetDate - Date.now();
        if (diff <= 0) { el.textContent = "OUT NOW"; clearInterval(t); return; }
        const s = Math.floor(diff/1000), d = Math.floor(s/86400);
        const h = String(Math.floor((s%86400)/3600)).padStart(2,"0");
        const m = String(Math.floor((s%3600)/60)).padStart(2,"0");
        const sc = String(s%60).padStart(2,"0");
        el.textContent = d > 0 ? `${d}d ${h}:${m}:${sc}` : `${h}:${m}:${sc}`;
      }
      update(); const t = setInterval(update, 1000);
    })();
  </script>

  <script>
    function initVideoControls(videoId, playId, pauseId, soundId) {
      const video = document.getElementById(videoId);
      const play  = document.getElementById(playId);
      const pause = document.getElementById(pauseId);
      const sound = document.getElementById(soundId);
      if (!video) return;
      function setSoundIcon(muted) {
        if (!sound) return;
        sound.innerHTML = muted
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" fill="none"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 8.5a5 5 0 0 1 0 7l1.4 1.4a7 7 0 0 0 0-9.8l-1.4 1.4z"/></svg>';
        sound.setAttribute('aria-label', muted ? 'Ton einschalten' : 'Ton ausschalten');
      }
      play?.addEventListener('click',  () => video.play());
      pause?.addEventListener('click', () => video.pause());
      sound?.addEventListener('click', () => { video.muted = !video.muted; setSoundIcon(video.muted); });
      setSoundIcon(video.muted);
    }
    initVideoControls('release-video-desktop','d-play-btn','d-pause-btn','d-sound-btn');
    initVideoControls('release-video-mobile', 'm-play-btn','m-pause-btn','m-sound-btn');
  </script>

  <script>
    (function () {
      const cross = document.getElementById('crosshair');
      const lineX = cross?.querySelector('.line-x');
      const lineY = cross?.querySelector('.line-y');
      if (!cross||!lineX||!lineY) return;
      if (!window.matchMedia('(pointer: fine)').matches){cross.style.display='none';return;}
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){cross.style.display='none';return;}
      let x=-9999,y=-9999,raf=null;
      function render(){lineX.style.top=y+'px';lineY.style.left=x+'px';raf=null;}
      window.addEventListener('mousemove',(e)=>{x=e.clientX;y=e.clientY;if(!raf)raf=requestAnimationFrame(render);},{passive:true});
      window.addEventListener('mouseleave',()=>{x=-9999;y=-9999;render();});
    })();
  </script>
