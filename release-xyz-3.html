<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>b3nn3t – drei</title>

<style>

:root{
  --bg:#980012;
  --text:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    sans-serif;
}

body{
  padding:2rem 1.2rem 4rem;
}

/* =========================================================
   WRAPPER
========================================================= */

.wrapper{
  width:100%;
  max-width:850px;
  margin:0 auto;
}

/* =========================================================
   MOBILE COMIC SCENE
========================================================= */

.mobile-scene{
  position:relative;
  width:100%;
  margin-bottom:2rem;
  padding-bottom:120px;
}

/* =========================================================
   THOUGHT BUBBLE
========================================================= */

.thought-wrap{
  position:relative;
  width:100%;
}

/* video */

.video-container{
  position:absolute;
  inset:0;

  overflow:hidden;

  -webkit-clip-path:url(#bubbleClip);
  clip-path:url(#bubbleClip);

  z-index:1;
}

.video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#000;
}

/* bubble svg */

.bubble-svg{
  width:100%;
  height:auto;
  display:block;
  position:relative;
  z-index:2;
  overflow:visible;
}

/* =========================================================
   BUTTONS
========================================================= */

.controls{
  position:absolute;
  right:-2px;
  top:20%;

  display:flex;
  flex-direction:column;
  gap:12px;

  z-index:20;
}

.btn{
  border:none;
  border-radius:50%;

  background:#fff;
  color:#111;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 0 0 3px rgba(0,0,0,.25),
    0 10px 18px rgba(0,0,0,.18);
}

.btn svg{
  width:48%;
  height:48%;
  fill:currentColor;
}

.play-btn{
  width:58px;
  height:58px;
}

.pause-btn{
  width:44px;
  height:44px;
}

.sound-btn{
  width:34px;
  height:34px;
}

/* =========================================================
   PERSON
========================================================= */

.person{
  position:absolute;

  right:-10px;
  bottom:0;

  width:160px;

  z-index:15;

  filter:drop-shadow(0 12px 20px rgba(0,0,0,.3));

  user-select:none;
  pointer-events:none;
}

/* =========================================================
   TEXT
========================================================= */

.title{
  margin-top:1rem;
  margin-bottom:2rem;

  font-size:3rem;
  letter-spacing:.25em;
  font-weight:700;

  text-transform:lowercase;
}

.section{
  margin-bottom:3rem;
}

.section h2{
  margin-bottom:1rem;

  font-size:1.2rem;
  font-weight:700;

  text-transform:lowercase;
}

.section p{
  font-size:1.1rem;
  line-height:1.8;
  letter-spacing:.02em;
}

/* =========================================================
   ICONS
========================================================= */

.icons{
  display:flex;
  gap:1rem;
  margin-top:1rem;
  flex-wrap:wrap;
}

.icons img{
  width:52px;
  height:52px;
  object-fit:contain;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width:520px){

  .person{
    width:135px;
  }

  .title{
    font-size:2.4rem;
  }

  .section p{
    font-size:1rem;
  }

}

</style>
</head>

<body>

<!-- ======================================================
     SVG CLIP PATH
====================================================== -->

<svg width="0" height="0" style="position:absolute">

  <defs>

    <clipPath id="bubbleClip" clipPathUnits="objectBoundingBox">

      <!-- comic bubble -->
      <path d="
        M 0.50 0.03
        C 0.58 0.01,0.66 0.03,0.72 0.09
        C 0.78 0.02,0.88 0.04,0.93 0.11
        C 0.99 0.10,1.00 0.18,0.97 0.25
        C 1.00 0.31,0.98 0.40,0.93 0.45
        C 0.98 0.52,0.96 0.61,0.89 0.66
        C 0.92 0.74,0.88 0.83,0.80 0.85
        C 0.81 0.93,0.75 0.98,0.67 0.97
        C 0.62 1.01,0.55 1.02,0.50 0.98
        C 0.45 1.02,0.38 1.01,0.33 0.97
        C 0.25 0.98,0.19 0.93,0.20 0.85
        C 0.12 0.83,0.08 0.74,0.11 0.66
        C 0.04 0.61,0.02 0.52,0.07 0.45
        C 0.02 0.40,0.00 0.31,0.03 0.25
        C 0.00 0.18,0.01 0.10,0.07 0.11
        C 0.12 0.04,0.22 0.02,0.28 0.09
        C 0.34 0.03,0.42 0.01,0.50 0.03
        Z
      "/>

    </clipPath>

  </defs>

</svg>

<div class="wrapper">

  <!-- ====================================================
       SCENE
  ===================================================== -->

  <section class="mobile-scene">

    <!-- thought bubble -->
    <div class="thought-wrap">

      <!-- video -->
      <div class="video-container">

        <video
          id="video"
          class="video"
          muted
          playsinline
          preload="metadata"
          poster="assets/release/drei-cover.webp"
        >
          <source src="assets/gesehen/B3NN3T.mp4" type="video/mp4">
        </video>

      </div>

      <!-- bubble outline -->
      <svg
        class="bubble-svg"
        viewBox="0 0 400 300"
        xmlns="http://www.w3.org/2000/svg"
      >

        <!-- shadow -->
        <path
          fill="none"
          stroke="rgba(0,0,0,.28)"
          stroke-width="16"
          stroke-linejoin="round"
          d="
            M 200 10
            C 232 6 268 14 288 36
            C 312 14 352 18 368 46
            C 394 38 402 70 388 94
            C 402 118 394 150 370 166
            C 388 194 378 230 324 240
            C 330 268 308 284 272 282
            C 258 296 232 300 200 290
            C 168 300 142 296 128 282
            C 92 284 70 268 76 240
            C 22 230 12 194 30 166
            C 6 150 -2 118 12 94
            C -2 70 6 38 32 46
            C 48 18 88 14 112 36
            C 132 14 168 6 200 10
            Z
          "
        />

        <!-- white border -->
        <path
          fill="none"
          stroke="#ffffff"
          stroke-width="7"
          stroke-linejoin="round"
          d="
            M 200 10
            C 232 6 268 14 288 36
            C 312 14 352 18 368 46
            C 394 38 402 70 388 94
            C 402 118 394 150 370 166
            C 388 194 378 230 324 240
            C 330 268 308 284 272 282
            C 258 296 232 300 200 290
            C 168 300 142 296 128 282
            C 92 284 70 268 76 240
            C 22 230 12 194 30 166
            C 6 150 -2 118 12 94
            C -2 70 6 38 32 46
            C 48 18 88 14 112 36
            C 132 14 168 6 200 10
            Z
          "
        />

        <!-- thought dots -->
        <circle cx="315" cy="255" r="18" fill="none" stroke="#fff" stroke-width="6"/>
        <circle cx="345" cy="285" r="11" fill="none" stroke="#fff" stroke-width="5"/>
        <circle cx="366" cy="305" r="5" fill="none" stroke="#fff" stroke-width="4"/>

      </svg>

    </div>

    <!-- controls -->
    <div class="controls">

      <button class="btn play-btn" id="playBtn">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <button class="btn pause-btn" id="pauseBtn">
        <svg viewBox="0 0 24 24">
          <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
        </svg>
      </button>

      <button class="btn sound-btn" id="soundBtn">
        <svg viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        </svg>
      </button>

    </div>

    <!-- person -->
    <img
      class="person"
      src="assets/release/person-sitzend.png"
      alt="person"
    >

  </section>

  <!-- ====================================================
       CONTENT
  ===================================================== -->

  <h1 class="title">drei</h1>

  <section class="section">
    <h2>erklärbär</h2>

    <p>
      drei songs die mir sehr am herzen liegen,
      neues zimmer,
      neuer b3nn3t,
      neue musik.
    </p>

    <br>

    <p>
      vergangene ereignisse werden verarbeitet
      wie sonne bei solar,
      liebe grüsse an alle die checken :3
    </p>
  </section>

  <section class="section">

    <h2>kuck hier</h2>

    <div class="icons">

      <img src="assets/release/spotify_128.png" alt="">
      <img src="assets/release/apple_music_128.png" alt="">
      <img src="assets/release/instagram_128.png" alt="">
      <img src="assets/release/youtube_128.png" alt="">
      <img src="assets/release/soundcloud_128.png" alt="">

    </div>

  </section>

</div>

<script>

const video = document.getElementById("video");

const playBtn  = document.getElementById("playBtn");
const pauseBtn = document.getElementById("pauseBtn");
const soundBtn = document.getElementById("soundBtn");

playBtn.addEventListener("click", () => {
  video.play();
});

pauseBtn.addEventListener("click", () => {
  video.pause();
});

soundBtn.addEventListener("click", () => {
  video.muted = !video.muted;
});

</script>

</body>
</html>
