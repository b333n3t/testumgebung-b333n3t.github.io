  <script>
    (function () {
      const targetDate = new Date("2026-01-09T00:00:00+01:00").getTime();
      const el = document.getElementById("awb-countdown-timer");
      if (!el) return;

      function updateCountdown() {
        const now = Date.now();
        const diff = targetDate - now;

        if (diff <= 0) {
          el.textContent = "OUT NOW";
          clearInterval(timer);
          return;
        }

        const seconds = Math.floor(diff / 1000);
        const days = Math.floor(seconds / (3600 * 24));
        const hours = Math.floor((seconds % (3600 * 24)) / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;

        const hh = String(hours).padStart(2, "0");
        const mm = String(mins).padStart(2, "0");
        const ss = String(secs).padStart(2, "0");

        el.textContent = days > 0
          ? `${days}d ${hh}:${mm}:${ss}`
          : `${hh}:${mm}:${ss}`;
      }

      updateCountdown();
      const timer = setInterval(updateCountdown, 1000);
    })();
  </script>

  <script>
    (function () {
      const video = document.getElementById("release-video");
      const playBtn = document.getElementById("video-play-btn");
      const pauseBtn = document.getElementById("video-pause-btn");
      const soundBtn = document.getElementById("video-sound-btn");

      if (!video || !playBtn || !pauseBtn || !soundBtn) return;

      function setSoundIcon() {
        if (video.muted) {
          soundBtn.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<path d="M3 9v6h4l5 5V4L7 9H3z"></path>' +
              '<path d="M16 9l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" fill="none"></path>' +
            '</svg>';

          soundBtn.setAttribute("aria-label", "Ton einschalten");
        } else {
          soundBtn.innerHTML =
            '<svg viewBox="0 0 24 24" aria-hidden="true">' +
              '<path d="M3 9v6h4l5 5V4L7 9H3z"></path>' +
              '<path d="M16.5 8.5a5 5 0 0 1 0 7l1.4 1.4a7 7 0 0 0 0-9.8l-1.4 1.4z"></path>' +
            '</svg>';

          soundBtn.setAttribute("aria-label", "Ton ausschalten");
        }
      }

      playBtn.addEventListener("click", function () {
        video.play();
      });

      pauseBtn.addEventListener("click", function () {
        video.pause();
      });

      soundBtn.addEventListener("click", function () {
        video.muted = !video.muted;
        setSoundIcon();
      });

      setSoundIcon();
    })();
  </script>

  <script>
    (function () {
      const cross = document.getElementById("crosshair");
      const lineX = cross?.querySelector(".line-x");
      const lineY = cross?.querySelector(".line-y");
      if (!cross || !lineX || !lineY) return;

      if (!window.matchMedia("(pointer: fine)").matches) {
        cross.style.display = "none";
        return;
      }

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        cross.style.display = "none";
        return;
      }

      let x = -9999;
      let y = -9999;
      let raf = null;

      function render() {
        lineX.style.top = y + "px";
        lineY.style.left = x + "px";
        raf = null;
      }

      window.addEventListener("mousemove", function (e) {
        x = e.clientX;
        y = e.clientY;
        if (!raf) raf = requestAnimationFrame(render);
      }, { passive: true });

      window.addEventListener("mouseleave", function () {
        x = -9999;
        y = -9999;
