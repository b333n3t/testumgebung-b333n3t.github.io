<script>

(function(){

  var t =
    new Date(
      "2026-01-09T00:00:00+01:00"
    ).getTime();

  var el =
    document.getElementById("timer");

  function tick(){

    var d = t - Date.now();

    if(d <= 0){

      el.textContent = "OUT NOW";
      return;
    }

    var s = Math.floor(d/1000);

    var h =
      String(
        Math.floor((s%86400)/3600)
      ).padStart(2,"0");

    var m =
      String(
        Math.floor((s%3600)/60)
      ).padStart(2,"0");

    var sc =
      String(s%60).padStart(2,"0");

    el.textContent =
      h + ":" + m + ":" + sc;
  }

  tick();

  setInterval(tick,1000);

})();

</script>

<script>

function bindVideo(
  vid,
  playBtn,
  pauseBtn,
  soundBtn
){

  if(!vid) return;

  playBtn.onclick = function(){
    vid.play();
  };

  pauseBtn.onclick = function(){
    vid.pause();
  };

  soundBtn.onclick = function(){

    vid.muted = !vid.muted;
  };
}

bindVideo(
  document.getElementById('vid-d'),
  document.getElementById('dp'),
  document.getElementById('dpa'),
  document.getElementById('ds')
);

</script>

<script>

(function(){

  if(window.innerWidth > 768)
    return;

  const vid =
    document.getElementById('vid-m');

  const canvas =
    document.getElementById('bubble-canvas');

  const ctx =
    canvas.getContext('2d');

  let W,H;

  function resize(){

    const cssW =
      canvas.getBoundingClientRect().width;

    W =
      Math.round(
        cssW * window.devicePixelRatio
      );

    H =
      Math.round(W * (300/420));

    canvas.width = W;
    canvas.height = H;
  }

  resize();

  window.addEventListener(
    'resize',
    resize
  );

  function bubblePath(){

    const sx = W / 420;
    const sy = H / 300;

    const px = n => n * sx;
    const py = n => n * sy;

    ctx.beginPath();

    ctx.moveTo(px(70),py(120));

    ctx.bezierCurveTo(
      px(40),py(90),
      px(45),py(45),
      px(95),py(50)
    );

    ctx.bezierCurveTo(
      px(110),py(20),
      px(160),py(15),
      px(190),py(40)
    );

    ctx.bezierCurveTo(
      px(225),py(8),
      px(290),py(10),
      px(325),py(45)
    );

    ctx.bezierCurveTo(
      px(370),py(30),
      px(405),py(60),
      px(395),py(105)
    );

    ctx.bezierCurveTo(
      px(425),py(125),
      px(420),py(175),
      px(380),py(190)
    );

    ctx.bezierCurveTo(
      px(390),py(235),
      px(350),py(265),
      px(305),py(250)
    );

    ctx.bezierCurveTo(
      px(280),py(285),
      px(220),py(290),
      px(190),py(260)
    );

    ctx.bezierCurveTo(
      px(145),py(285),
      px(90),py(270),
      px(80),py(225)
    );

    ctx.bezierCurveTo(
      px(40),py(220),
      px(20),py(180),
      px(40),py(145)
    );

    ctx.bezierCurveTo(
      px(25),py(135),
      px(30),py(120),
      px(70),py(120)
    );

    ctx.closePath();
  }

  function draw(){

    ctx.clearRect(0,0,W,H);

    ctx.save();

    bubblePath();

    ctx.clip();

    if(vid.readyState >= 2){

      ctx.drawImage(
        vid,
        0,
        0,
        W,
        H
      );

    } else {

      ctx.fillStyle = "#000";

      ctx.fillRect(
        0,
        0,
        W,
        H
      );
    }

    ctx.restore();

    requestAnimationFrame(draw);
  }

  draw();

  bindVideo(
    vid,
    document.getElementById('mp'),
    document.getElementById('mpa'),
    document.getElementById('ms')
  );

})();

</script>
