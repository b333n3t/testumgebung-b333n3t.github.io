       Layout:
       ┌─────────────────────────────────┐

    @media (max-width:768px) {

      .page-wrap { padding:1.8rem 0 3rem; }

        padding-bottom:36vw;

      /* ── Große Canvas-Blase ── */
      /* Canvas = volle Breite */
      #bcanvas {
        display:block;
        width:100%;

      }

      /* ── 3 kleine Kreise (Buttons) diagonal ──

      .dot-btn {

        right:  clamp(28px,8vw,46px);
        bottom: clamp(28px,8vw,50px);
      }
      #m-pa svg { width:48%; height:48%; }

      /* Größter Kreis: Play – oben rechts, am nächsten zur Blase */
      #m-pl {
        width:  clamp(50px,13vw,70px);
        height: clamp(50px,13vw,70px);
        right:  clamp(50px,14vw,80px);
        bottom: clamp(52px,15vw,82px);

      #m-pl svg { width:46%; height:46%; }

      /* ── Person: absolut unten rechts ── */
      .person-m {

<script>
/* ── Mobile: Canvas + Dot-Button Controls ──
   Läuft nur wenn Viewport ≤ 768px.
   Zeichnet Video frame-by-frame auf Canvas,
   geclippt in echte Comic-Thought-Bubble-Form.
*/
(function(){
  if(window.innerWidth > 768) return;

  var vid = document.getElementById('vid-m');
  var cvs = document.getElementById('bcanvas');
  if(!vid || !cvs) return;
  var ctx = cvs.getContext('2d');

  /* ── Canvas-Größe setzen ── */
  /* Aspect-Ratio der Blase: 16:10 (leicht breit) */
  var AR = 10/16;
  var DPR = window.devicePixelRatio || 1;
  var cssW, cssH, PW, PH;

  function resize(){
    /* CSS-Breite = volle Viewport-Breite */
    cssW = window.innerWidth;
    cssH = Math.round(cssW * AR);
    PW   = Math.round(cssW * DPR);
    PH   = Math.round(cssH * DPR);
    cvs.width  = PW;
    cvs.height = PH;
    cvs.style.width  = cssW + 'px';
    cvs.style.height = cssH + 'px';
  }
  resize();
  window.addEventListener('resize', resize, {passive:true});

  /* ── Comic-Thought-Bubble Pfad ──
     Große runde Hauptblase mit leichten Beulen an den Rändern.
     Normalisiert auf w×h Canvas-Koordinaten.
     Kein Schweif – der Schweif wird durch die 3 Kreise ersetzt.
  */
  function drawBubblePath(ctx, w, h){
    var p = 0.04; /* padding in Prozent */
    var l = w*p, r = w*(1-p), t = h*p, b = h*(1-p);
    var mx = w/2, my = h/2;

    ctx.beginPath();
    /* Oben links → oben mitte */
    ctx.moveTo(mx, t);
    ctx.bezierCurveTo(mx*0.6, t*0.3,  w*0.1, t*0.5,  l,    my*0.55);
    /* Links runter */
    ctx.bezierCurveTo(l*0.2, my*0.9,  l*0.2, my*1.1, l,    my*1.45);
    /* Links unten → unten */
    ctx.bezierCurveTo(w*0.08, b*0.95, w*0.25, b,      mx*0.65, b);
    /* Unten mitte → unten rechts */
    ctx.bezierCurveTo(mx*1.1, b,      w*0.78, b*0.95, r,    my*1.45);
    /* Rechts runter → rechts oben */
    ctx.bezierCurveTo(w*0.98, my*1.1, w*0.98, my*0.9, r,    my*0.55);
    /* Rechts oben → oben */
    ctx.bezierCurveTo(w*0.9, t*0.5,   mx*1.4, t*0.3,  mx,   t);
    ctx.closePath();
  }

  /* ── Render-Loop ── */
  function draw(){
    ctx.clearRect(0,0,PW,PH);

    /* Schatten-Effekt */
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.35)';
    ctx.shadowBlur=20*DPR;
    ctx.shadowOffsetY=8*DPR;

    /* Weißen Rand zeichnen (etwas größer) */
    ctx.save();
    var pad=6*DPR;
    ctx.scale(1,1);
    /* Skaliere leicht nach außen für den weißen Rand */
    ctx.translate(-pad*0.5, -pad*0.5);
    ctx.scale((PW+pad)/PW, (PH+pad)/PH);
    drawBubblePath(ctx,PW,PH);
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.97)';
    /* Rand als Stroke */
    ctx.save();
    drawBubblePath(ctx,PW,PH);
    ctx.lineWidth=10*DPR;
    ctx.strokeStyle='rgba(0,0,0,0.25)';
    ctx.stroke();
    ctx.restore();

    ctx.restore();

    /* Weißer Rand */
    ctx.save();
    drawBubblePath(ctx,PW,PH);
    ctx.lineWidth=6*DPR;
    ctx.strokeStyle='rgba(255,255,255,0.97)';
    ctx.stroke();
    ctx.restore();

    /* Video-Clip */
    ctx.save();
    drawBubblePath(ctx,PW,PH);
    ctx.clip();

    if(vid.readyState >= 2){
      /* Video zentriert und cover-artig skaliert */
      var vr = vid.videoWidth / vid.videoHeight;
      var cr = PW / PH;
      var sw, sh, sx, sy;
      if(vr > cr){
        sh = PH; sw = PH * vr;
        sy = 0;  sx = (PW - sw)/2;
      } else {
        sw = PW; sh = PW / vr;
        sx = 0;  sy = (PH - sh)/2;
      }
      ctx.drawImage(vid, sx, sy, sw, sh);
    } else {
      /* Poster als Fallback */
      if(window._poster && window._poster.complete){
        ctx.drawImage(window._poster, 0, 0, PW, PH);
      } else {
        ctx.fillStyle='#111';
        ctx.fillRect(0,0,PW,PH);
      }
    }
    ctx.restore();

    requestAnimationFrame(draw);
  }

  /* Poster vorladen */
  window._poster = new Image();
  window._poster.src = 'assets/release/drei-cover.webp';

  draw();

  /* ── Dot-Button Controls ── */
  var mpl = document.getElementById('m-pl');
  var mpa = document.getElementById('m-pa');
  var mso = document.getElementById('m-so');

  function updSo(){
    if(!mso)return;
    mso.innerHTML=sndIcon(vid.muted);
    mso.setAttribute('aria-label',vid.muted?'Ton einschalten':'Ton ausschalten');
  }

  if(mpl) mpl.onclick = function(){ vid.play(); };
  if(mpa) mpa.onclick = function(){ vid.pause(); };
  if(mso) mso.onclick = function(){ vid.muted=!vid.muted; updSo(); };
  updSo();

}());
</script>

<script>
/* ── Crosshair ── */
(function(){
  var c=document.getElementById('xhair');
  if(!c)return;
  if(!window.matchMedia('(pointer:fine)').matches){c.style.display='none';return;}
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){c.style.display='none';return;}
  var lx=c.querySelector('.lx'),ly=c.querySelector('.ly');
  var x=-9999,y=-9999,raf=null;
  function dr(){lx.style.top=y+'px';ly.style.left=x+'px';raf=null;}
  window.addEventListener('mousemove',function(e){x=e.clientX;y=e.clientY;if(!raf)raf=requestAnimationFrame(dr);},{passive:true});
  window.addEventListener('mouseleave',function(){x=-9999;y=-9999;dr();});
}());
</script>
