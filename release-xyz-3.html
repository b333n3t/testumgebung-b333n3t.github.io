<style>

:root{
  --bg:#980012;
  --white:#fff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  overflow-x:hidden;
  background:radial-gradient(circle at center, #b3001b 0%, #930011 60%, #85000f 100%);

body{

}

/* =========================================================
   WRAPPER
========================================================= */

.wrapper{
  width:100%;
  max-width:860px;
  margin:0 auto;
}

/* =========================================================
   TOP BAR
========================================================= */

.topline{
  display:flex;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;

  margin-bottom:2.2rem;

  font-size:1rem;
  font-weight:600;
}

.brand{
  font-weight:800;
}

.countdown{
  font-size:1.05rem;
  opacity:.96;
}

#countdown{
  font-weight:800;
  letter-spacing:.04em;
}

/* =========================================================
   COMIC SCENE
========================================================= */

.scene{
  position:relative;
  width:100%;
  margin-bottom:2.5rem;
  padding-bottom:180px;
}

/* =========================================================
   COMIC BUBBLE
========================================================= */

.bubble-wrap{
  position:relative;
  width:100%;
  margin-top:1rem;
}

/* VIDEO */

.video-container{
  position:absolute;
  inset:0;

  overflow:hidden;

  -webkit-clip-path:url(#comicClip);
  clip-path:url(#comicClip);

  z-index:1;
}

.video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:black;
}

/* SVG */

.bubble-svg{
  width:100%;
  height:auto;
  display:block;
  position:relative;
  z-index:2;
  overflow:visible;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
  position:absolute;
  right:-2px;
  top:22%;

  display:flex;
  flex-direction:column;
  gap:14px;

  z-index:50;
}

.btn{
  border:none;
  border-radius:50%;

  background:white;
  color:#111;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 0 0 3px rgba(0,0,0,.24),
    0 12px 22px rgba(0,0,0,.22);
}

.btn svg{
  width:48%;
  height:48%;
  fill:currentColor;
}

.play-btn{
  width:64px;
  height:64px;
}

.pause-btn{
  width:48px;
  height:48px;
}

.sound-btn{
  width:38px;
  height:38px;
}

/* =========================================================
   PERSON
========================================================= */

.person{
  position:absolute;

  right:-6px;
  bottom:18px;

  width:180px;

  z-index:30;

  filter:
    drop-shadow(0 12px 22px rgba(0,0,0,.32));

  user-select:none;
  pointer-events:none;
}

/* =========================================================
   TITLE
========================================================= */

.title{
  margin-bottom:2rem;

  font-size:4rem;
  font-weight:700;
  letter-spacing:.32em;
  text-transform:lowercase;
}

/* =========================================================
   CONTENT
========================================================= */

.block{
  margin-bottom:3rem;
}

.block h2{
  margin-bottom:1rem;

  font-size:1.35rem;
  font-weight:700;

  text-transform:lowercase;
}

.block p{
  line-height:1.9;
  font-size:1.22rem;
}

/* =========================================================
   SOCIALS
========================================================= */

.icons{
  display:flex;
  flex-wrap:wrap;
  gap:1rem;

  margin-top:1.1rem;
}

.icons img{
  width:58px;
  height:58px;
  object-fit:contain;
}

/* =========================================================
   LINKS
========================================================= */

.site-link{
  display:inline-block;
  margin-top:1rem;

  color:white;
  text-decoration:none;

  font-weight:700;
  font-size:1.6rem;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px){

  }

  .block p{
    font-size:1.08rem;
  }

  .controls{

  }

}

@media (max-width:480px){

<script>

/* =========================================================
   COUNTDOWN
========================================================= */

(function(){

  const targetDate =
    new Date("2026-01-09T00:00:00+01:00").getTime();

  const el =
    document.getElementById("countdown");

  function update(){

    const diff =
      targetDate - Date.now();

    if(diff <= 0){

      el.textContent = "OUT NOW";
      return;

    }

    const s =
      Math.floor(diff / 1000);

    const d =
      Math.floor(s / 86400);

    const h =
      String(
        Math.floor((s % 86400) / 3600)
      ).padStart(2,"0");

    const m =
      String(
        Math.floor((s % 3600) / 60)
      ).padStart(2,"0");

    const sec =
      String(
        s % 60
      ).padStart(2,"0");

    el.textContent =
      `${d}d ${h}:${m}:${sec}`;

  }

  update();

  setInterval(update,1000);

})();

/* =========================================================
   VIDEO CONTROLS
========================================================= */

const video =
  document.getElementById("video");

const playBtn =
  document.getElementById("playBtn");

const pauseBtn =
  document.getElementById("pauseBtn");

const soundBtn =
  document.getElementById("soundBtn");

playBtn.addEventListener("click",()=>{

  video.play();

});

pauseBtn.addEventListener("click",()=>{

  video.pause();

});

soundBtn.addEventListener("click",()=>{

  video.muted = !video.muted;

});

</script>
