    /* =========================================================
       MOBILE  (≤ 768px)

       Problem: iOS Safari rendert SVG clipPath auf foreignObject
       nicht zuverlässig → eigene Mobile-Szene mit CSS-Blob-Shape.

       Layout:
       ┌─────────────────────────┐
       │   [blob-video]   [btns] │
       │                         │
       │              [person]   │ ← rechts unten
       └─────────────────────────┘
       ========================================================= */

    @media (max-width: 768px) {

      .page-wrap { padding: 2rem 1rem 3rem; }
      .topline   { font-size: 0.87rem; gap: 0.45rem; margin-bottom: 1.2rem; }

      /* Desktop-Szene weg */
      .video-scene { display: none; }

      /* Mobile-Szene sichtbar */
      .mobile-scene {
        display: block;
        position: relative;
        width: 100%;
        /* Blase: aspect 4/3 → Höhe ≈ 75vw. Person ragt ~28vw raus. */
        padding-bottom: 26vw;
      }

      /* ---- Blob-Blase ---- */
      .mobile-bubble-wrap {
        position: relative;
        /* Blase nimmt ~78% der Breite ein, links ausgerichtet */
        width: 78%;
        aspect-ratio: 4 / 3;
        z-index: 2;
      }

      /* Weißer Rand */
      .mobile-bubble-wrap::before {
        content: '';
        position: absolute;
        inset: -6px;
        background: rgba(255,255,255,0.96);
        border-radius: 44% 54% 50% 58% / 52% 46% 54% 48%;
        z-index: 0;
        box-shadow: 0 14px 32px rgba(0,0,0,0.32);
      }

      /* Schatten-Ring */
      .mobile-bubble-wrap::after {
        content: '';
        position: absolute;
        inset: -12px;
        background: rgba(0,0,0,0.18);
        border-radius: 44% 54% 50% 58% / 52% 46% 54% 48%;
        z-index: -1;
        filter: blur(8px);
      }

      /* Video in Blob-Shape */
      .mobile-bubble-video {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 44% 54% 50% 58% / 52% 46% 54% 48%;
        z-index: 1;
        background: #000;
      }

      /* ---- Steuer-Buttons: rechts neben der Blase, diagonal ---- */
      .mobile-controls {
        position: absolute;
        /* Buttons rechts außen, auf Höhe der Blase */
        right: 0;
        top: 18%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 10;
        pointer-events: none;
      }

      .mobile-controls .thought-btn {
        /* Überschreibe position:absolute von Desktop */
        position: static;
        pointer-events: auto;
      }

      .mobile-controls .thought-play  { width: 50px; height: 50px; top: auto; right: auto; }
      .mobile-controls .thought-pause { width: 38px; height: 38px; top: auto; right: auto; }
      .mobile-controls .thought-sound { width: 30px; height: 30px; top: auto; right: auto; }

      /* Desktop-Controls unsichtbar */
      .thought-controls { display: none; }

      /* ---- Person: absolut rechts unten ---- */
      .mobile-person {
        position: absolute;
        right: -6px;
        bottom: 0;
        width: clamp(110px, 30vw, 170px);
        height: auto;
        z-index: 3;
        filter: drop-shadow(0 10px 18px rgba(0,0,0,0.25));
        pointer-events: none;
        user-select: none;
      }

      /* Titel kommt nach der Szene, kein negativer Abzug */
      .title-section { margin-top: 1.5rem; }
      .song-title    { letter-spacing: 0.18em; }
    }

    @media (max-width: 420px) {
      .mobile-bubble-wrap { width: 80%; }

      .mobile-controls { right: -2px; top: 16%; gap: 8px; }
      .mobile-controls .thought-play  { width: 42px; height: 42px; }

    @media (prefers-reduced-motion: reduce) { #crosshair { display: none; } }

  <script>
    (function () {
      const targetDate = new Date("2026-01-09T00:00:00+01:00").getTime();
      const el = document.getElementById("awb-countdown-timer");
      if (!el) return;
      function update() {
        const diff = targetDate - Date.now();
        if (diff <= 0) { el.textContent = "OUT NOW"; clearInterval(t); return; }
        const s = Math.floor(diff/1000), d = Math.floor(s/86400);
        const h = String(Math.floor((s%86400)/3600)).padStart(2,"0");
        const m = String(Math.floor((s%3600)/60)).padStart(2,"0");
        const sc = String(s%60).padStart(2,"0");
        el.textContent = d > 0 ? `${d}d ${h}:${m}:${sc}` : `${h}:${m}:${sc}`;
      }
      update(); const t = setInterval(update, 1000);
    })();
  </script>

  <script>
    function initVideoControls(videoId, playId, pauseId, soundId) {
      const video = document.getElementById(videoId);
      const play  = document.getElementById(playId);
      const pause = document.getElementById(pauseId);
      const sound = document.getElementById(soundId);
      if (!video) return;

      function setSoundIcon(muted) {
        if (!sound) return;
        sound.innerHTML = muted
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" fill="none"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 8.5a5 5 0 0 1 0 7l1.4 1.4a7 7 0 0 0 0-9.8l-1.4 1.4z"/></svg>';
        sound.setAttribute('aria-label', muted ? 'Ton einschalten' : 'Ton ausschalten');
      }

      play?.addEventListener('click',  () => video.play());
      pause?.addEventListener('click', () => video.pause());
      sound?.addEventListener('click', () => { video.muted = !video.muted; setSoundIcon(video.muted); });
      setSoundIcon(video.muted);
    }

    initVideoControls('release-video-desktop', 'd-play-btn', 'd-pause-btn', 'd-sound-btn');
    initVideoControls('release-video-mobile',  'm-play-btn', 'm-pause-btn', 'm-sound-btn');
  </script>

      const cross = document.getElementById('crosshair');
      const lineX = cross?.querySelector('.line-x');
      const lineY = cross?.querySelector('.line-y');
      if (!cross || !lineX || !lineY) return;
      if (!window.matchMedia('(pointer: fine)').matches) { cross.style.display='none'; return; }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { cross.style.display='none'; return; }
      let x=-9999, y=-9999, raf=null;
      function render() { lineX.style.top=y+'px'; lineY.style.left=x+'px'; raf=null; }
      window.addEventListener('mousemove',(e)=>{ x=e.clientX; y=e.clientY; if(!raf) raf=requestAnimationFrame(render); },{passive:true});
      window.addEventListener('mouseleave',()=>{ x=-9999; y=-9999; render(); });
    })();
  </script>

</body>
</html>
