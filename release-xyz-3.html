<script>
/*
  ══ MOBILE CANVAS ══
  Große Comic-Gedankenblase: viele weiche Beulen rundherum,
  schwarzer Rand + weißer Innenrand, Video darin.
*/
(function(){
  if(window.innerWidth > 768) return;

  var vid=document.getElementById('vid-m');
  var cvs=document.getElementById('bcanvas');
  if(!vid||!cvs)return;
  var ctx=cvs.getContext('2d');
  var DPR=window.devicePixelRatio||1;
  var PW,PH;

  function resize(){
    var cw=window.innerWidth;
    var ch=Math.round(cw*0.65);
    PW=Math.round(cw*DPR); PH=Math.round(ch*DPR);
    cvs.width=PW; cvs.height=PH;
    cvs.style.width=cw+'px'; cvs.style.height=ch+'px';
  }
  resize();
  window.addEventListener('resize',resize,{passive:true});

  /*
    Comic-Thought-Bubble:
    - 10 Beulen gleichmäßig verteilt (wie Wolke)
    - Jede Beule ist ein kleiner Kreisbogen nach außen
    - Zwischen den Beulen leichte Einbuchtungen
  */
  function bubblePath(ctx,w,h){
    var cx=w*0.5, cy=h*0.48;
    var rx=w*0.44, ry=h*0.42;
    var n=10; /* Anzahl Beulen */
    var bumpOut=0.18; /* Wie weit die Beulen rausgehen */

    ctx.beginPath();
    for(var i=0;i<n;i++){
      var a0=(i/n)*Math.PI*2 - Math.PI/2;
      var a1=((i+1)/n)*Math.PI*2 - Math.PI/2;
      var am=(a0+a1)/2;

      var x0=cx+Math.cos(a0)*rx, y0=cy+Math.sin(a0)*ry;
      var x1=cx+Math.cos(a1)*rx, y1=cy+Math.sin(a1)*ry;
      /* Beulenpunkt: weiter außen */
      var bx=cx+Math.cos(am)*rx*(1+bumpOut);
      var by=cy+Math.sin(am)*ry*(1+bumpOut);

      if(i===0) ctx.moveTo(x0,y0);
      ctx.quadraticCurveTo(bx,by,x1,y1);
    }
    ctx.closePath();
  }

  var poster=new Image(); poster.src='assets/release/drei-cover.webp';

  function draw(){
    ctx.clearRect(0,0,PW,PH);

    /* Schatten */
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.45)';
    ctx.shadowBlur=20*DPR;
    ctx.shadowOffsetY=5*DPR;
    bubblePath(ctx,PW,PH);
    ctx.fillStyle='rgba(0,0,0,0.001)';
    ctx.fill();
    ctx.restore();

    /* Schwarzer Comic-Rand */
    ctx.save();
    bubblePath(ctx,PW,PH);
    ctx.lineWidth=8*DPR;
    ctx.strokeStyle='rgba(0,0,0,0.92)';
    ctx.stroke();
    ctx.restore();

    /* Weißer Rand */
    ctx.save();
    bubblePath(ctx,PW,PH);
    ctx.lineWidth=4*DPR;
    ctx.strokeStyle='rgba(255,255,255,0.97)';
    ctx.stroke();
    ctx.restore();

    /* Video clip */
    ctx.save();
    bubblePath(ctx,PW,PH);
    ctx.clip();
    var src=(vid.readyState>=2)?vid:(poster.complete?poster:null);
    if(src){
      var vw=src.videoWidth||src.naturalWidth||1280;
      var vh=src.videoHeight||src.naturalHeight||720;
      var vr=vw/vh, cr=PW/PH, sw,sh,sx,sy;
      if(vr>cr){sh=PH;sw=PH*vr;sx=(PW-sw)/2;sy=0;}
      else{sw=PW;sh=PW/vr;sx=0;sy=(PH-sh)/2;}
      ctx.drawImage(src,sx,sy,sw,sh);
    } else {
      ctx.fillStyle='#111'; ctx.fillRect(0,0,PW,PH);
    }
    ctx.restore();

    requestAnimationFrame(draw);
  }
  draw();

  /* Mobile oval-button controls */
  var mpl=document.getElementById('m-pl');
  var mpa=document.getElementById('m-pa');
  var mso=document.getElementById('m-so');

  function updSo(){
    if(!mso)return;
    mso.innerHTML=sndIco(vid.muted);
    mso.setAttribute('aria-label',vid.muted?'Ton einschalten':'Ton ausschalten');
  }
  if(mpl)mpl.onclick=function(){vid.play();};
  if(mpa)mpa.onclick=function(){vid.pause();};
  if(mso)mso.onclick=function(){vid.muted=!vid.muted;updSo();};
  updSo();
}());
</script>

<script>
(function(){
  var c=document.getElementById('xhair'); if(!c)return;
  if(!window.matchMedia('(pointer:fine)').matches){c.style.display='none';return;}
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){c.style.display='none';return;}
  var lx=c.querySelector('.lx'),ly=c.querySelector('.ly');
  var x=-9999,y=-9999,raf=null;
  function dr(){lx.style.top=y+'px';ly.style.left=x+'px';raf=null;}
  window.addEventListener('mousemove',function(e){x=e.clientX;y=e.clientY;if(!raf)raf=requestAnimationFrame(dr);},{passive:true});
  window.addEventListener('mouseleave',function(){x=-9999;y=-9999;dr();});
}());
</script>
