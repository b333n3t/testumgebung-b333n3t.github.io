<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>b3nn3t – kapitelende</title>
  <meta name="description" content="b3nn3t – die drei letzten shows im kapitel." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f2ef;
      --ink: #1a1a1a;
      --ink-light: #5a5a5a;
      --ink-faint: #a8a8a8;
      --ink-blue: #2a5fc9;
    }

    /* Vollbild-Grundstruktur: Header / Scroll-Mitte / Footer */
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden; /* kein Scroll auf body-Ebene */
    }

    .layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      opacity: 0;
      animation: fadeIn 1.2s ease 0.1s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    img {
      display: block;
      width: 100%;
      height: auto;
      filter: saturate(0.9) contrast(0.96);
    }

    /* ── HEADER (fixe Höhe, kein Shrink) ── */
    .top-header {
      flex-shrink: 0;
      padding: clamp(0.8rem, 2vh, 1.5rem) clamp(1rem, 4vw, 2rem) clamp(0.4rem, 1vh, 0.8rem);
    }

    .chapter-label {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.1rem, 3.5vw, 1.65rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.2;
    }

    .artist-name {
      font-family: 'Caveat', cursive;
      font-size: clamp(1rem, 3vw, 1.55rem);
      font-weight: 500;
      color: var(--ink);
      margin-top: 0.1rem;
    }

    .year-tag {
      font-size: clamp(0.6rem, 1.5vw, 0.72rem);
      color: var(--ink-faint);
      vertical-align: super;
      margin-left: 0.2em;
    }

    /* ── SHOWS-ZEILE (fixe Höhe, kein Shrink) ── */
    .shows-section {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      gap: clamp(0.6rem, 2vw, 1.2rem);
      padding: 0 clamp(1rem, 4vw, 2rem) clamp(0.4rem, 1vh, 0.8rem);
    }

    .fig2 {
      width: clamp(60px, 10vw, 120px);
      flex-shrink: 0;
      transform: rotate(1.5deg);
    }

    .shows-strip { flex: 1; min-width: 0; }

    .shows-label {
      font-family: 'Caveat', cursive;
      font-size: clamp(0.65rem, 1.5vw, 0.78rem);
      color: var(--ink-faint);
      letter-spacing: 0.12em;
      margin-bottom: 0.3rem;
    }

    .shows-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: clamp(0.15rem, 0.5vh, 0.35rem);
    }

    .shows-list li {
      font-size: clamp(0.72rem, 2vw, 0.92rem);
      font-weight: 300;
      color: var(--ink-blue);
      letter-spacing: 0.02em;
    }

    /* ── SCROLL-BEREICH (nimmt restlichen Platz) ── */
    .scroll-zone {
      flex: 1 1 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    /* Innen-Container nur Gedicht – padding-bottom = Freiraum für Bild 4 */
    .scroll-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(1rem, 3vh, 2.5rem) clamp(1rem, 4vw, 2rem) clamp(80px, 18vh, 160px);
      gap: clamp(0.8rem, 2vh, 1.5rem);
    }

    /* Gedicht + fig3 nebeneinander */
    .poem-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(0.8rem, 3vw, 2rem);
      width: 100%;
      max-width: 700px;
    }

    .poem-wrap {
      flex: 0 0 auto;
      width: clamp(200px, 55vw, 380px);
    }

    #poem-output {
      font-family: 'Caveat', cursive;
      font-size: clamp(0.95rem, 2.8vw, 1.22rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.95;
      text-align: center;
    }

    .poem-last { color: var(--ink-light); }

    .poem-word {
      display: inline;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .poem-word.show { opacity: 1; }

    .fig3 {
      flex: 0 0 auto;
      width: clamp(55px, 10vw, 110px);
      transform: rotate(-1deg);
      margin-top: -5px;
    }

    /* Bild 4 (Schrank) – fix am unteren Rand der scroll-zone, ausserhalb des Flows */
    .fig4-wrap {
      position: sticky;
      bottom: clamp(0.5rem, 2vh, 1rem);
      display: flex;
      justify-content: center;
      width: 100%;
      pointer-events: none;
    }

    .fig4 {
      width: clamp(70px, 15vw, 115px);
      pointer-events: auto;
    }

    /* ── FOOTER (fixe Höhe, kein Shrink, immer unten sichtbar) ── */
    footer {
      flex-shrink: 0;
      text-align: center;
      padding: clamp(0.4rem, 1vh, 0.8rem) 0;
      border-top: 1px solid transparent; /* verhindert Collapsing */
    }

    footer p {
      font-size: clamp(0.62rem, 1.5vw, 0.72rem);
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    footer a {
      color: var(--ink-faint);
      text-decoration: none;
      border-bottom: 1px solid var(--ink-faint);
    }
    footer a:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    /* Querformat: fig3 etwas kleiner, mehr Platz fürs Gedicht */
    @media (orientation: landscape) and (max-height: 500px) {
      .fig3 {
        width: clamp(45px, 8vw, 80px);
      }
      .fig4 {
        width: clamp(55px, 10vw, 90px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .poem-word { opacity: 1 !important; transition: none !important; }
    }
  </style>
</head>

<body>
<div class="layout">

  <!-- HEADER -->
  <div class="top-header">
    <div class="chapter-label">die drei letzten shows im kapitel.</div>
    <div class="artist-name">b3nn3t<span class="year-tag">2023–2026</span></div>
  </div>

  <!-- SHOWS -->
  <div class="shows-section">
    <div class="fig2">
      <img src="abschluss/2.jpg" alt="" />
    </div>
    <div class="shows-strip">
      <p class="shows-label">live</p>
      <ul class="shows-list">
        <li>13. juni · jugendfestival (ZAK) · Jona</li>
        <li>26. juni · oya! openairfestival (gleis19) · Wien</li>
        <li>08. august · winterthurer musikfestwochen · Winterthur</li>
      </ul>
    </div>
  </div>

  <!-- SCROLL-ZONE: Gedicht + Bilder -->
  <div class="scroll-zone">
    <div class="scroll-inner">

      <div class="poem-row">
        <div class="poem-wrap">
          <div id="poem-output"></div>
        </div>
        <div class="fig3">
          <img src="abschluss/3.jpg" alt="" />
        </div>
      </div>

    </div>
  </div>

  <!-- FIGUR 4 – sticky, immer am unteren Rand der scroll-zone -->
  <div class="fig4-wrap">
    <div class="fig4">
      <img src="abschluss/4.jpg" alt="" />
    </div>
  </div>

  <!-- FOOTER – immer sichtbar, immer unten -->
  <footer>
    <p>© b3nn3t · <a href="impressum.html">Impressum / Datenschutz</a></p>
  </footer>

</div>

<script>
const poemLines = [
  { words: ["ein","schatten","steht","im","rahmen."], last: false },
  { words: ["das","holz","war","ein","paar","monate","stumm."], last: false },
  { words: ["jetzt","reisst","der","wind","eine","fuge."], last: false },
  { words: ["da","drinnen","wird","etwas","abgelegt,"], last: false },
  { words: ["das","lange","zu","schwer","war."], last: false },
  { words: ["drei","letzte","windstösse."], last: false },
  { words: ["dann","drückt","die","kälte","die","tür","auf."], last: false },
  { words: ["wer","geht,","hat","ein","neues","gesicht."], last: true }
];

const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

async function writePoem() {
  const out = document.getElementById('poem-output');
  out.innerHTML = '';
  for (let li = 0; li < poemLines.length; li++) {
    const { words, last } = poemLines[li];
    for (let wi = 0; wi < words.length; wi++) {
      const span = document.createElement('span');
      span.className = 'poem-word' + (last ? ' poem-last' : '');
      span.textContent = words[wi] + '\u00A0';
      out.appendChild(span);
      await delay(20);
      span.classList.add('show');
      await delay(100 + Math.random() * 80);
    }
    if (li < poemLines.length - 1) {
      out.appendChild(document.createElement('br'));
      await delay(220);
    }
  }
}

window.addEventListener('load', writePoem);
</script>

</body>
</html>
