<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>b3nn3t – kapitelende</title>
  <meta name="description" content="b3nn3t – die drei letzten shows im kapitel." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f2ef;
      --ink: #1a1a1a;
      --ink-light: #5a5a5a;
      --ink-faint: #a8a8a8;
      --ink-blue: #2a5fc9;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden; /* Body scrollt nicht – nur middle-zone */
    }

    .layout {
      display: flex;
      flex-direction: column;
      height: 100%;         /* Exakt Viewport-Höhe */
      opacity: 0;
      animation: fadeIn 1.2s ease 0.1s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    img {
      display: block;
      width: 100%;
      height: auto;
      filter: saturate(0.9) contrast(0.96);
    }

    /* ── HEADER ── */
    .top-header {
      flex-shrink: 0;
      padding: clamp(0.8rem, 2.5vh, 1.5rem) clamp(1rem, 4vw, 2rem) clamp(1.2rem, 3vh, 2.2rem);
    }

    .chapter-label {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.1rem, 3.5vw, 1.65rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.2;
    }

    .artist-name {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: clamp(0.95rem, 2.8vw, 1.45rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-top: 0.15rem;
    }

    .year-tag {
      font-size: clamp(0.52rem, 1.1vw, 0.68rem);
      color: var(--ink-faint);
      vertical-align: super;
      margin-left: 0.25em;
    }

    /* ── SHOWS ── */
    .shows-section {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      gap: clamp(0.6rem, 2vw, 1.2rem);
      padding: 0 clamp(1rem, 4vw, 2rem) clamp(0.4rem, 1vh, 0.8rem);
      margin-left: clamp(2.5rem, 8vw, 6rem);
    }

    .fig2 {
      width: clamp(58px, 9.5vw, 115px);
      flex-shrink: 0;
      transform: rotate(1.5deg);
    }

    .shows-strip { flex: 1; min-width: 0; }

    .shows-label {
      font-family: 'Caveat', cursive;
      font-size: clamp(0.62rem, 1.3vw, 0.76rem);
      color: var(--ink-faint);
      letter-spacing: 0.12em;
      margin-bottom: 0.3rem;
    }

    .shows-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: clamp(0.1rem, 0.5vh, 0.32rem);
    }

    .shows-list li {
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      font-weight: 300;
      color: var(--ink-blue);
      letter-spacing: 0.02em;
    }

    /* ── MITTE: scrollbar, Bild 3 fix darin ── */
    .middle-zone {
      flex: 1 1 0;
      min-height: 0;
      position: relative;       /* Anker für fig3 */
      overflow-y: auto;         /* scrollbar wenn Gedicht zu lang */
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* Gedicht zentriert im verfügbaren Platz */
    .poem-wrap {
      display: flex;
      justify-content: center;
      padding: clamp(0.8rem, 3vh, 2rem) clamp(1rem, 4vw, 2rem);
      /* Rechts Platz für Bild 3 lassen */
      padding-right: clamp(80px, 18vw, 160px);
    }

    #poem-output {
      font-family: 'Caveat', cursive;
      font-size: clamp(0.95rem, 2.8vw, 1.22rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.95;
      text-align: center;
    }

    .poem-last { color: var(--ink-light); }

    .poem-line {
      display: block;
      text-align: center;
    }

    /* Bild 3: fix in der middle-zone, rechts, vertikal mittig */
    .fig3 {
      position: absolute;
      right: clamp(0.5rem, 3vw, 2rem);
      top: clamp(0.5rem, 3vh, 1.5rem);
      transform: rotate(-1deg);
      width: clamp(55px, 10vw, 110px);
      pointer-events: none;
    }

    /* ── BILD 4: fix, eigene Zone ── */
    .fig4-zone {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding: clamp(0.4rem, 1.2vh, 1rem) 0;
    }

    .fig4 {
      width: clamp(65px, 13vw, 115px);
    }

    /* ── FOOTER ── */
    footer {
      flex-shrink: 0;
      text-align: center;
      padding: clamp(0.3rem, 0.8vh, 0.6rem) 0 clamp(0.5rem, 1.2vh, 1rem);
    }

    footer p {
      font-size: clamp(0.6rem, 1.3vw, 0.72rem);
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    footer a {
      color: var(--ink-faint);
      text-decoration: none;
      border-bottom: 1px solid var(--ink-faint);
    }
    footer a:hover { color: var(--ink); border-color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .poem-line { opacity: 1 !important; transform: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
<div class="layout">

  <div class="top-header">
    <div class="chapter-label">die drei letzten shows im kapitel.</div>
    <div class="artist-name">b3nn3t<span class="year-tag">2023–2026</span></div>
  </div>

  <div class="shows-section">
    <div class="fig2">
      <img src="abschluss/2.jpg" alt="" />
    </div>
    <div class="shows-strip">
      <p class="shows-label">live</p>
      <ul class="shows-list">
        <li>13. juni · jugendfestival (ZAK) · Jona</li>
        <li>26. juni · oya! openairfestival (gleis19) · Wien</li>
        <li>08. august · winterthurer musikfestwochen · Winterthur</li>
      </ul>
    </div>
  </div>

  <!-- middle-zone: scrollbar, Bild 3 fix positioniert darin -->
  <div class="middle-zone">

    <!-- Bild 3: absolut positioniert, bewegt sich nicht mit Gedicht -->
    <div class="fig3">
      <img src="abschluss/3.jpg" alt="" />
    </div>

    <div class="poem-wrap">
      <div id="poem-output"></div>
    </div>

  </div>

  <!-- Bild 4: immer fix, eigene Zone -->
  <div class="fig4-zone">
    <div class="fig4">
      <img src="abschluss/4.jpg" alt="" />
    </div>
  </div>

  <footer>
    <p>© b3nn3t · <a href="impressum.html">Impressum / Datenschutz</a></p>
  </footer>

</div>

<script>
const poemLines = [
  { text: "ein schatten steht im rahmen.", last: false },
  { text: "das holz war ein paar monate stumm.", last: false },
  { text: "jetzt reisst der wind eine fuge.", last: false },
  { text: "da drinnen wird etwas abgelegt,", last: false },
  { text: "das lange zu schwer war.", last: false },
  { text: "drei letzte windstösse.", last: false },
  { text: "dann drückt die kälte die tür auf.", last: false },
  { text: "wer geht, hat ein neues gesicht.", last: true }
];

const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

async function writePoem() {
  const out = document.getElementById('poem-output');
  out.innerHTML = '';

  for (let li = 0; li < poemLines.length; li++) {
    const { text, last } = poemLines[li];

    const line = document.createElement('div');
    line.className = 'poem-line' + (last ? ' poem-last' : '');
    line.style.opacity = '0';
    line.style.transform = 'translateY(-5px)';
    line.style.transition = 'opacity 0.45s ease, transform 0.45s ease';
    line.textContent = text;
    out.appendChild(line);

    await delay(30);
    line.style.opacity = '1';
    line.style.transform = 'translateY(0)';

    await delay(320 + Math.random() * 120);
  }
}

window.addEventListener('load', writePoem);
</script>

</body>
</html>
