<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>b3nn3t – kapitelende</title>
  <meta name="description" content="b3nn3t – die drei letzten shows im kapitel." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f2ef;
      --ink: #1a1a1a;
      --ink-light: #5a5a5a;
      --ink-faint: #a8a8a8;
    }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      opacity: 0;
      animation: fadeIn 1.2s ease 0.1s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      filter: saturate(0.9) contrast(0.96);
    }

    /* HEADER */

    .top-header {
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
    }

    .chapter-label {
      font-family: 'Caveat', cursive;
      font-size: 1.45rem;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.2;
    }

    .artist-name {
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--ink);
      margin-top: 0.15rem;
    }

    .year-tag {
      font-size: 0.72rem;
      color: var(--ink-faint);
      vertical-align: super;
      margin-left: 0.25em;
    }

    /* SHOWS + BILD */

    .shows-section {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 0 1.2rem;
      margin-top: 1.2rem;
    }

    .fig2 {
      width: 95px;
      flex-shrink: 0;
      transform: rotate(1.5deg);
    }

    .shows-strip {
      flex: 1;
      min-width: 0;
    }

    .shows-label {
      font-family: 'Caveat', cursive;
      font-size: 0.75rem;
      color: var(--ink-faint);
      letter-spacing: 0.12em;
      margin-bottom: 0.4rem;
    }

    .shows-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
    }

    .shows-list li {
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--ink-light);
      letter-spacing: 0.02em;
    }

    /* GEDICHT */

    .poem-dancer-wrap {
      position: relative;
      max-width: 320px;
      margin: 2.8rem auto 0;
      padding: 0 2rem;
    }

    .fig3 {
      position: absolute;
      right: -12%;
      top: -55px;
      width: 26vw;
      max-width: 100px;
      transform: rotate(-1deg);
      z-index: 2;
    }

    #poem-output {
      font-family: 'Caveat', cursive;
      font-size: 1.12rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.95;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .poem-last {
      color: var(--ink-light);
    }

    .poem-word {
      display: inline;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .poem-word.show {
      opacity: 1;
    }

    /* BOTTOM */

    .bottom-strip {
      position: relative;
      width: 100%;
      height: 180px;
      margin-top: 2rem;
    }

    .fig4 {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) rotate(2deg);
      bottom: 30px;
      width: 26vw;
      max-width: 105px;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 0.5rem 2rem 3rem;
    }

    footer p {
      font-size: 0.72rem;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    footer a {
      color: var(--ink-faint);
      text-decoration: none;
      border-bottom: 1px solid var(--ink-faint);
    }

    footer a:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    /* DESKTOP */

    @media (min-width: 800px) {

      .chapter-label {
        font-size: 1.65rem;
      }

      .artist-name {
        font-size: 1.55rem;
      }

      .shows-section {
        max-width: 820px;
        margin: 1.5rem auto 0;
      }

      .fig2 {
        width: 120px;
      }

      .shows-list li {
        font-size: 0.88rem;
      }

      .poem-dancer-wrap {
        max-width: 400px;
        margin-top: 3.5rem;
      }

      .fig3 {
        width: 13vw;
        max-width: 115px;
        right: -14%;
        top: -65px;
      }

      #poem-output {
        font-size: 1.22rem;
      }

      .bottom-strip {
        height: 220px;
      }

      .fig4 {
        width: 12vw;
        max-width: 115px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .poem-word {
        opacity: 1 !important;
        transition: none !important;
      }
    }

  </style>
</head>
<body>
<div class="page">
  <div class="top-header">
    <div class="chapter-label">die drei letzten shows im kapitel.</div>
    <div class="artist-name">
      b3nn3t<span class="year-tag">2023–2026</span>
    </div>
  </div>
  <div class="shows-section">
<div class="fig2">
  <img src="abschluss/2.jpg" alt="" />
</div>

<div class="shows-strip">
  <p class="shows-label">live</p>

  <ul class="shows-list">
    <li>13. juni · jugendfestival (ZAK) · Jona</li>
    <li>26. juni · oya! openairfestival (gleis19) · Wien</li>
    <li>08. august · winterthurer musikfestwochen · Winterthur</li>
  </ul>
</div>
  </div>
  <div class="poem-dancer-wrap">
<div class="fig3">
  <img src="abschluss/3.jpg" alt="" />
</div>

<div id="poem-output"></div>
  </div>
  <div class="bottom-strip">
<div class="fig4">
  <img src="abschluss/4.jpg" alt="" />
</div>
  </div>
  <footer>
    <p>© b3nn3t · <a href="impressum.html">Impressum / Datenschutz</a></p>
  </footer>
</div>
<script>
  const poemLines = [
    { words: ["ein","schatten","steht","im","rahmen."], last: false },
    { words: ["das","holz","war","ein","paar","monate","stumm."], last: false },
    { words: ["jetzt","reisst","der","wind","eine","fuge."], last: false },
    { words: ["da","drinnen","wird","etwas","abgelegt,"], last: false },
    { words: ["das","lange","zu","schwer","war."], last: false },
    { words: ["drei","letzte","windstösse."], last: false },
    { words: ["dann","drückt","die","kälte","die","tür","auf."], last: false },
    { words: ["wer","geht,","hat","ein","neues","gesicht."], last: true }
  ];

  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function writePoem() {
    const out = document.getElementById('poem-output');
    out.innerHTML = '';

    for (let li = 0; li < poemLines.length; li++) {

      const { words, last } = poemLines[li];

      for (let wi = 0; wi < words.length; wi++) {

        const span = document.createElement('span');

        span.className =
          'poem-word' + (last ? ' poem-last' : '');

        span.textContent = words[wi] + '\u00A0';

        out.appendChild(span);

        await delay(20);

        span.classList.add('show');

        await delay(100 + Math.random() * 80);
      }

      if (li < poemLines.length - 1) {
        out.appendChild(document.createElement('br'));
        await delay(220);
      }
    }
  }

  window.addEventListener('load', writePoem);
</script>
</body>
</html>
