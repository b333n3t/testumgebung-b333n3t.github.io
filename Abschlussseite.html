<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>b3nn3t – kapitelende</title>
  <meta name="description" content="b3nn3t – die drei letzten shows im kapitel." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f2ef;
      --ink: #1a1a1a;
      --ink-light: #5a5a5a;
      --ink-faint: #a8a8a8;
    }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── SKIP ANIMATION BUTTON ── */
    .skip-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      font-family: 'Caveat', cursive;
      font-size: 0.78rem;
      color: var(--ink-faint);
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: color 0.3s;
      padding: 0.4rem 0.6rem;
    }
    .skip-btn:hover { color: var(--ink); }
    .skip-btn.hidden { display: none; }

    /* ── PAGE ── */
    .page {
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .page.visible { opacity: 1; }

    /* ── HEADER ── */
    .top-header {
      position: relative;
      padding: 2rem 1.6rem 0;
    }
    .chapter-label {
      font-family: 'Caveat', cursive;
      font-size: 0.88rem;
      color: var(--ink-faint);
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .artist-name {
      font-family: 'Caveat', cursive;
      font-size: 1.18rem;
      color: var(--ink-light);
      margin-top: 0.05rem;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
    }
    .year-tag {
      font-family: 'Caveat', cursive;
      font-size: 0.58rem;
      color: var(--ink-faint);
      vertical-align: super;
      margin-left: 0.3em;
    }
    .chapter-label.show,
    .artist-name.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* fig5 – top-right corner */
    .fig5-corner {
      position: absolute;
      top: -0.5rem;
      right: -4%;
      width: 28vw;
      max-width: 120px;
      transform: rotate(-4deg) translateX(60px) translateY(-40px);
      opacity: 0;
      transition: opacity 1s ease, transform 1.4s cubic-bezier(0.16,1,0.3,1);
    }
    .fig5-corner.show {
      opacity: 1;
      transform: rotate(-4deg) translateX(0) translateY(0);
    }
    .fig5-corner img { display: block; width: 100%; height: auto; filter: saturate(0.9) contrast(0.96); }

    /* ── SHOWS STRIP ── */
    .shows-strip {
      position: relative;
      width: 100%;
      margin-top: 1rem;
      min-height: 130px;
      overflow: visible;
    }

    .fig2 {
      position: absolute;
      left: -6%;
      top: 0;
      width: 26vw;
      max-width: 105px;
      transform: rotate(2deg) translateX(-80px);
      opacity: 0;
      transition: opacity 1s ease, transform 1.6s cubic-bezier(0.16,1,0.3,1);
    }
    .fig2.show {
      opacity: 1;
      transform: rotate(2deg) translateX(0);
    }
    .fig2 img { display: block; width: 100%; height: auto; filter: saturate(0.9) contrast(0.96); }

    .shows {
      position: absolute;
      left: 22%;
      top: 0.2rem;
      text-align: left;
      white-space: nowrap;
      z-index: 10;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    .shows.show { opacity: 1; transform: translateY(0); }
    .shows-label {
      font-family: 'Caveat', cursive;
      font-size: 0.75rem;
      color: var(--ink-faint);
      letter-spacing: 0.12em;
      margin-bottom: 0.4rem;
    }
    .shows-list { list-style: none; display: flex; flex-direction: column; gap: 0.32rem; }
    .shows-list li {
      font-size: 0.76rem;
      font-weight: 300;
      color: var(--ink-light);
      letter-spacing: 0.02em;
    }

    /* ── DANCER ── */
    .dancer-wrap {
      display: flex;
      justify-content: center;
      margin-top: 1.8rem;
    }
    .fig3-img {
      width: 36vw;
      max-width: 150px;
      transform: rotate(-1deg) translateY(60px);
      opacity: 0;
      transition: opacity 1.2s ease, transform 1.6s cubic-bezier(0.16,1,0.3,1);
    }
    .fig3-img.show {
      opacity: 1;
      transform: rotate(-1deg) translateY(0);
    }
    .fig3-img img { display: block; width: 100%; height: auto; filter: saturate(0.9) contrast(0.96); }

    /* ── POEM SECTION ── */
    .poem-section {
      margin: 2.5rem auto 0;
      padding: 0 2rem;
      max-width: 320px;
      text-align: center;
      min-height: 260px;
    }

    /* The poem is rendered word by word via JS into this container */
    #poem-output {
      font-family: 'Caveat', cursive;
      font-size: 1.12rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.95;
      position: relative;
    }

    /* Ink nib cursor */
    .nib {
      display: inline-block;
      width: 0.9em;
      height: 1.1em;
      vertical-align: middle;
      margin-left: 2px;
      opacity: 0;
      transition: opacity 0.2s;
      position: relative;
      top: -0.05em;
    }
    .nib svg { width: 100%; height: 100%; }

    /* last line in italic/faint */
    .poem-last { color: var(--ink-light); }

    /* ── BOTTOM STRIP ── */
    .bottom-strip {
      position: relative;
      width: 100%;
      height: 150px;
      margin-top: 2rem;
      overflow: visible;
    }
    .fig1 {
      position: absolute;
      left: -5%;
      bottom: 10px;
      width: 30vw;
      max-width: 115px;
      transform: rotate(-5deg) translateX(-60px);
      opacity: 0;
      transition: opacity 1s ease, transform 1.5s cubic-bezier(0.16,1,0.3,1);
    }
    .fig1.show { opacity: 1; transform: rotate(-5deg) translateX(0); }
    .fig1 img { display: block; width: 100%; height: auto; filter: saturate(0.9) contrast(0.96); }

    .fig4 {
      position: absolute;
      right: -4%;
      bottom: 0;
      width: 23vw;
      max-width: 95px;
      transform: rotate(3deg) translateX(60px);
      opacity: 0;
      transition: opacity 1s ease, transform 1.5s cubic-bezier(0.16,1,0.3,1);
    }
    .fig4.show { opacity: 1; transform: rotate(3deg) translateX(0); }
    .fig4 img { display: block; width: 100%; height: auto; filter: saturate(0.9) contrast(0.96); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 1rem 2rem 3rem;
      opacity: 0;
      transition: opacity 1s ease;
    }
    footer.show { opacity: 1; }
    footer p { font-size: 0.72rem; color: var(--ink-faint); letter-spacing: 0.04em; }
    footer a {
      color: var(--ink-faint); text-decoration: none;
      border-bottom: 1px solid var(--ink-faint);
      transition: color 0.3s, border-color 0.3s;
    }
    footer a:hover { color: var(--ink); border-color: var(--ink); }

    /* ── DESKTOP ── */
    @media (min-width: 800px) {
      .fig5-corner { width: 13vw; max-width: 130px; right: -2%; }
      .fig2 { width: 16vw; max-width: 130px; }
      .shows { left: 20%; }
      .shows-list li { font-size: 0.86rem; }
      .shows-strip { min-height: 160px; }
      .fig3-img { width: 15vw; max-width: 180px; }
      #poem-output { font-size: 1.22rem; }
      .poem-section { max-width: 400px; margin-top: 3.5rem; }
      .bottom-strip { height: 190px; margin-top: 3rem; }
      .fig1 { width: 13vw; max-width: 130px; }
      .fig4 { width: 10vw; max-width: 105px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .chapter-label, .artist-name, .fig5-corner, .fig2,
      .shows, .fig3-img, .fig1, .fig4, footer,
      .chapter-label.show, .artist-name.show { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>

<button class="skip-btn" id="skipBtn" aria-label="Animation überspringen">überspringen ↓</button>

<div class="page" id="page">

  <div class="top-header">
    <div class="chapter-label" id="chapLabel">die drei letzten shows im kapitel.</div>
    <div class="artist-name" id="artistName">b3nn3t<span class="year-tag">2023–2026</span></div>
    <div class="fig5-corner" id="fig5"><img src="abschluss/5.jpg" alt="" /></div>
  </div>

  <div class="shows-strip">
    <div class="fig2" id="fig2"><img src="abschluss/2.jpg" alt="" /></div>
    <div class="shows" id="shows">
      <p class="shows-label">live</p>
      <ul class="shows-list">
        <li>13. juni &nbsp;·&nbsp; jugendfestival (ZAK) &nbsp;·&nbsp; Jona</li>
        <li>26. juni &nbsp;·&nbsp; oya! openairfestival (gleis19) &nbsp;·&nbsp; Wien</li>
        <li>08. august &nbsp;·&nbsp; winterthurer musikfestwochen &nbsp;·&nbsp; Winterthur</li>
      </ul>
    </div>
  </div>

  <div class="dancer-wrap">
    <div class="fig3-img" id="fig3"><img src="abschluss/3.jpg" alt="" /></div>
  </div>

  <div class="poem-section">
    <div id="poem-output"></div>
  </div>

  <div class="bottom-strip">
    <div class="fig1" id="fig1"><img src="abschluss/1.jpg" alt="" /></div>
    <div class="fig4" id="fig4"><img src="abschluss/4.jpg" alt="" /></div>
  </div>

  <footer id="footer">
    <p>© b3nn3t &nbsp;·&nbsp; <a href="impressum.html">Impressum / Datenschutz</a></p>
  </footer>

</div>

<script>
  // ── POEM DATA ──────────────────────────────────────────
  // Each line is an array of words. Last line flagged.
  const poemLines = [
    { words: ["ein", "schatten", "steht", "im", "rahmen."],            last: false },
    { words: ["das", "holz", "war", "ein", "paar", "monate", "stumm."],last: false },
    { words: ["jetzt", "reisst", "der", "wind", "eine", "fuge."],      last: false },
    { words: ["da", "drinnen", "wird", "etwas", "abgelegt,"],          last: false },
    { words: ["das", "lange", "zu", "schwer", "war."],                 last: false },
    { words: ["drei", "letzte", "windstösse."],                        last: false },
    { words: ["dann", "drückt", "die", "kälte", "die", "tür", "auf."],last: false },
    { words: ["wer", "geht,", "hat", "ein", "neues", "gesicht."],      last: true  },
  ];

  // ── NIB SVG (inline fountain pen nib) ─────────────────
  const nibSVG = `<svg viewBox="0 0 18 22" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 2 C9 2 14 7 14 13 Q14 17 9 20 Q4 17 4 13 C4 7 9 2 9 2Z"
          fill="#2a2218" opacity="0.85"/>
    <path d="M9 20 L7 22 L9 19 L11 22 Z" fill="#2a2218" opacity="0.7"/>
    <ellipse cx="9" cy="18.5" rx="1.2" ry="1.8" fill="#f4f2ef" opacity="0.5"/>
    <line x1="9" y1="13" x2="9" y2="19" stroke="#f4f2ef" stroke-width="0.7" opacity="0.6"/>
  </svg>`;

  // ── STATE ──────────────────────────────────────────────
  let skipped = false;

  // ── UTILITY ───────────────────────────────────────────
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  function show(el) { el.classList.add('show'); }

  // ── WRITE POEM WORD BY WORD ───────────────────────────
  async function writePoem() {
    const container = document.getElementById('poem-output');
    container.innerHTML = '';

    // create nib cursor
    const nib = document.createElement('span');
    nib.className = 'nib';
    nib.innerHTML = nibSVG;
    nib.style.opacity = '1';
    container.appendChild(nib);

    for (let li = 0; li < poemLines.length; li++) {
      if (skipped) break;
      const line = poemLines[li];

      // line container (inline, wrapping)
      const lineSpan = document.createElement('span');
      if (line.last) lineSpan.className = 'poem-last';

      for (let wi = 0; wi < line.words.length; wi++) {
        if (skipped) break;

        const word = document.createElement('span');
        word.textContent = (wi === 0 && li > 0 ? '' : '') + line.words[wi] + '\u00A0';
        word.style.opacity = '0';
        word.style.transition = 'opacity 0.35s ease';

        // insert before nib
        container.insertBefore(word, nib);

        // small stagger then fade in
        await delay(10);
        word.style.opacity = '1';

        // move nib after this word (re-append)
        container.appendChild(nib);

        // pause between words – slightly varied for organic feel
        const pause = 120 + Math.random() * 80;
        await delay(pause);
      }

      // line break after each line
      const br = document.createElement('br');
      container.insertBefore(br, nib);
      await delay(260); // breath between lines
    }

    // hide nib when done
    nib.style.opacity = '0';
  }

  // ── SKIP ──────────────────────────────────────────────
  function skipAll() {
    skipped = true;
    document.getElementById('skipBtn').classList.add('hidden');

    // show everything immediately
    const ids = ['chapLabel','artistName','fig5','fig2','shows','fig3','fig1','fig4','footer'];
    ids.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('show'); });

    // show page
    document.getElementById('page').classList.add('visible');

    // render full poem instantly
    const container = document.getElementById('poem-output');
    container.innerHTML = poemLines.map((l, i) =>
      `<span${l.last ? ' class="poem-last"' : ''}>${l.words.join('\u00A0')}</span>${i < poemLines.length-1 ? '<br>' : ''}`
    ).join('');
  }

  document.getElementById('skipBtn').addEventListener('click', skipAll);

  // ── MAIN SEQUENCE ─────────────────────────────────────
  async function runSequence() {
    const page = document.getElementById('page');
    page.classList.add('visible');

    await delay(300);
    show(document.getElementById('chapLabel'));
    await delay(400);
    show(document.getElementById('artistName'));

    await delay(600);
    show(document.getElementById('fig5'));
    show(document.getElementById('fig2'));

    await delay(900);
    show(document.getElementById('shows'));

    await delay(700);
    show(document.getElementById('fig3'));

    await delay(1200);
    // write the poem
    await writePoem();

    await delay(600);
    show(document.getElementById('fig1'));
    show(document.getElementById('fig4'));

    await delay(800);
    show(document.getElementById('footer'));

    // hide skip button
    document.getElementById('skipBtn').classList.add('hidden');
  }

  // start on load
  window.addEventListener('load', runSequence);
</script>

</body>
</html>
