<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>b3nn3t – kapitelende</title>
  <meta name="description" content="b3nn3t – die drei letzten shows im kapitel." />
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f2ef;
      --ink: #1a1a1a;
      --ink-light: #5a5a5a;
      --ink-faint: #a8a8a8;
      --ink-blue: #2a5fc9;
    }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
    }

    .layout {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      opacity: 0;
      animation: fadeIn 1.2s ease 0.1s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    img {
      display: block;
      width: 100%;
      height: auto;
      filter: saturate(0.9) contrast(0.96);
    }

    /* ── Schatten unter Bildern: weich, wie auf Papier gelegt ── */
    .fig2 img, .fig3 img, .fig4 img {
      filter: saturate(0.9) contrast(0.96)
              drop-shadow(0px 6px 12px rgba(40,30,20,0.18))
              drop-shadow(0px 2px 4px rgba(40,30,20,0.10));
    }

    /* ── HEADER ── */
    .top-header {
      padding: clamp(0.8rem, 2.5vh, 1.5rem) clamp(1rem, 4vw, 2rem) clamp(1.8rem, 4vh, 3rem);
    }

    .chapter-label {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.1rem, 3.5vw, 1.65rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.2;
    }

    .artist-name {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: clamp(1rem, 3vw, 1.55rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-top: clamp(0.5rem, 1.2vh, 0.9rem);
    }

    .year-tag {
      font-size: clamp(0.55rem, 1.2vw, 0.7rem);
      color: var(--ink-faint);
      vertical-align: super;
      margin-left: 0.2em;
    }

    /* ── SHOWS ── */
    .shows-section {
      display: flex;
      align-items: flex-start;
      gap: clamp(0.6rem, 2vw, 1.2rem);
      padding: 0 clamp(1rem, 4vw, 2rem) clamp(0.4rem, 1vh, 0.8rem);
      margin-left: clamp(2rem, 7vw, 5rem);
    }

    .fig2 {
      width: clamp(60px, 10vw, 120px);
      flex-shrink: 0;
      transform: rotate(1.5deg);
      /* Parallax: wird per JS gesetzt */
      will-change: transform;
    }

    .shows-strip { flex: 1; min-width: 0; }

    .shows-label {
      font-family: 'Caveat', cursive;
      font-size: clamp(0.62rem, 1.3vw, 0.76rem);
      color: var(--ink-faint);
      letter-spacing: 0.12em;
      margin-bottom: 0.3rem;
    }

    .shows-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: clamp(0.1rem, 0.5vh, 0.32rem);
    }

    .shows-list li {
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      font-weight: 300;
      color: var(--ink-blue);
      letter-spacing: 0.02em;
    }

    /* ── MITTE ── */
    .middle-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1rem, 3vh, 2rem) clamp(1rem, 4vw, 2rem);
    }

    .poem-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(0.8rem, 3vw, 2rem);
      width: 100%;
      max-width: 700px;
    }

    .poem-wrap {
      flex: 0 0 auto;
      width: clamp(200px, 54vw, 380px);
    }

    #poem-output {
      font-family: 'Caveat', cursive;
      font-size: clamp(0.95rem, 2.8vw, 1.22rem);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.95;
      text-align: center;
    }

    .poem-last { color: var(--ink-light); }

    /* Gedichtzeilen: erscheinen leicht von links ── struktureller Tiefeneffekt */
    .poem-line {
      display: block;
      text-align: center;
    }

    .fig3 {
      flex: 0 0 clamp(80px, 14vw, 150px);
      width: clamp(80px, 14vw, 150px);
      transform: rotate(-1deg);
      will-change: transform;
    }

    /* ── BILD 4 + FOOTER ── */
    .bottom-fixed {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(0.4rem, 1.2vh, 1rem) 0 clamp(0.5rem, 1.2vh, 1rem);
      will-change: transform;
    }

    .fig4 {
      width: clamp(65px, 13vw, 115px);
      margin-bottom: clamp(0.3rem, 0.8vh, 0.6rem);
    }

    footer p {
      font-size: clamp(0.6rem, 1.3vw, 0.72rem);
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    footer a {
      color: var(--ink-faint);
      text-decoration: none;
      border-bottom: 1px solid var(--ink-faint);
    }
    footer a:hover { color: var(--ink); border-color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .poem-line { opacity: 1 !important; transform: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
<div class="layout">

  <div class="top-header">
    <div class="chapter-label">die drei letzten shows im kapitel.</div>
    <div class="artist-name">b3nn3t<span class="year-tag">2023–2026</span></div>
  </div>

  <div class="shows-section">
    <div class="fig2" data-parallax="0.35">
      <img src="abschluss/2.jpg" alt="" />
    </div>
    <div class="shows-strip">
      <p class="shows-label">live</p>
      <ul class="shows-list">
        <li>13. juni · jugendfestival (ZAK) · Jona</li>
        <li>26. juni · oya! openairfestival (gleis19) · Wien</li>
        <li>08. august · winterthurer musikfestwochen · Winterthur</li>
      </ul>
    </div>
  </div>

  <div class="middle-zone">
    <div class="poem-row">
      <div class="poem-wrap">
        <div id="poem-output"></div>
      </div>
      <div class="fig3" data-parallax="0.18">
        <img src="abschluss/3.jpg" alt="" />
      </div>
    </div>
  </div>

  <div class="bottom-fixed" style="margin-top: auto;" data-parallax="0.08">
    <div class="fig4">
      <img src="abschluss/4.jpg" alt="" />
    </div>
    <footer>
      <p>© b3nn3t · <a href="impressum.html">Impressum / Datenschutz</a></p>
    </footer>
  </div>

</div>

<script>
/* ── Gedicht: Zeilen von links einschwebend ── */
const poemLines = [
  { text: "ein schatten steht im rahmen.", last: false },
  { text: "das holz war ein paar monate stumm.", last: false },
  { text: "jetzt reisst der wind eine fuge.", last: false },
  { text: "da drinnen wird etwas abgelegt,", last: false },
  { text: "das lange zu schwer war.", last: false },
  { text: "drei letzte windstösse.", last: false },
  { text: "dann drückt die kälte die tür auf.", last: false },
  { text: "wer geht, hat ein neues gesicht.", last: true }
];

const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

async function writePoem() {
  const out = document.getElementById('poem-output');
  out.innerHTML = '';

  for (let li = 0; li < poemLines.length; li++) {
    const { text, last } = poemLines[li];

    const line = document.createElement('div');
    line.className = 'poem-line' + (last ? ' poem-last' : '');

    /* Jede Zeile startet leicht von links versetzt – gibt Schreibgefühl + Tiefe */
    const startX = -18 - Math.random() * 8;
    line.style.opacity = '0';
    line.style.transform = `translateX(${startX}px) translateY(-4px)`;
    line.style.transition = 'opacity 0.5s ease, transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)';
    line.textContent = text;
    out.appendChild(line);

    await delay(30);
    line.style.opacity = '1';
    line.style.transform = 'translateX(0) translateY(0)';

    await delay(300 + Math.random() * 130);
  }
}

window.addEventListener('load', writePoem);

/* ── Parallax: Bilder bewegen sich langsamer als der Scroll ──
   Jedes Element mit data-parallax="speed" bekommt einen leichten Offset.
   speed 0 = mit Scroll, 1 = komplett fix. Wir nutzen 0.08–0.35 = sehr subtil.
*/
const parallaxEls = document.querySelectorAll('[data-parallax]');

function onScroll() {
  const scrollY = window.scrollY;
  parallaxEls.forEach(el => {
    const speed = parseFloat(el.dataset.parallax);
    const baseTransform = el.dataset.baseTransform || '';
    el.style.transform = baseTransform + ` translateY(${scrollY * speed * -1}px)`;
  });
}

/* Basis-Transforms sichern (rotate etc.) */
parallaxEls.forEach(el => {
  const computed = window.getComputedStyle(el).transform;
  /* Wir lesen die CSS-Rotation aus dem data-parallax-Attribut selbst nicht –
     stattdessen merken wir uns den ursprünglichen inline-transform falls vorhanden */
  el.dataset.baseTransform = el.style.transform || '';
});

window.addEventListener('scroll', onScroll, { passive: true });
</script>

</body>
</html>
