/* Countdown */
(function(){
  var target = new Date("2026-01-09T00:00:00+01:00").getTime();
  var el = document.getElementById("timer");
  if (!el) return;

  function tick(){
    var diff = target - Date.now();

    if (diff <= 0) {
      el.textContent = "OUT NOW";
      clearInterval(iv);
      return;
    }

    var s = Math.floor(diff / 1000);
    var days = Math.floor(s / 86400);
    var h = String(Math.floor((s % 86400) / 3600)).padStart(2, "0");
    var m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    var sc = String(s % 60).padStart(2, "0");

    el.textContent = days > 0
      ? days + "d " + h + ":" + m + ":" + sc
      : h + ":" + m + ":" + sc;
  }

  tick();
  var iv = setInterval(tick, 1000);
}());

  if (!v) return;

  function updateSoundIcon(){
    if (!so) return;
    so.innerHTML = sndIco(v.muted);
    so.setAttribute("aria-label", v.muted ? "Ton einschalten" : "Ton ausschalten");
  }

  if (pl) {
    pl.onclick = function(){
      v.play();
    };
  }

  if (pa) {
    pa.onclick = function(){
      v.pause();
    };
  }

  if (so) {
    so.onclick = function(){
      v.muted = !v.muted;
      updateSoundIcon();
    };
  }

  updateSoundIcon();
}());
</script>

<script>
/*
  MOBILE CANVAS: Comic-Gedankenblase mit Video.
  Startet wann immer .mobile-scene sichtbar ist (Portrait + Landscape).
*/
(function(){
  var scene = document.querySelector(".mobile-scene");
  var vid   = document.getElementById("vid-m");
  var cvs   = document.getElementById("bcanvas");
  if (!scene || !vid || !cvs) return;

  var ctx = cvs.getContext("2d");
  var DPR = window.devicePixelRatio || 1;
  var PW = 0, PH = 0;
  var running = false;
  var rafId = null;

  /* Canvas-Grösse an aktuelle Viewport-Breite anpassen */
  function positionButtons(){
    var canvasH = cvs.offsetHeight || 0;
    var sceneH  = scene.offsetHeight || 1;

    /* Play-Blase: startet 4% unterhalb Canvas-Unterkante, 50% von links */
    var pl  = document.getElementById("m-pl");
    var pa  = document.getElementById("m-pa");
    var so  = document.getElementById("m-so");

    if (!pl || !pa || !so) return;

    var base = (canvasH / sceneH) * 100; /* Canvas-Unterkante in % der Scene */

    pl.style.top  = (base + 4)  + "%";
    pl.style.left = "50%";
    pa.style.top  = (base + 13) + "%";
    pa.style.left = "61%";
    so.style.top  = (base + 22) + "%";
    so.style.left = "72%";
  }

  function resize(){
    var cw = window.innerWidth;
    /* Im Landscape etwas flacher: Höhe = 55% der Breite */
    var ratio = (window.innerHeight < 500) ? 0.55 : 0.65;
    var ch = Math.round(cw * ratio);
    PW = Math.round(cw * DPR);
    PH = Math.round(ch * DPR);
    cvs.width  = PW;
    cvs.height = PH;
    cvs.style.width  = cw + "px";
    cvs.style.height = ch + "px";
    positionButtons();
  }

  function isVisible(){
    return window.getComputedStyle(scene).display !== "none";
  }

  /* Comic-Blase: 12 Bumps mit individueller Grösse */
  function bubblePath(c, w, h){
    var cx = w * 0.5, cy = h * 0.48;
    var rx = w * 0.44, ry = h * 0.42;
    var bumps = [0.22,0.14,0.26,0.10,0.20,0.28,0.12,0.24,0.16,0.22,0.18,0.13];
    var n = bumps.length;
    c.beginPath();
    for (var i = 0; i < n; i++){
      var a0 = (i / n) * Math.PI * 2 - Math.PI / 2;
      var a1 = ((i+1) / n) * Math.PI * 2 - Math.PI / 2;
      var am = (a0 + a1) / 2;
      var x0 = cx + Math.cos(a0) * rx, y0 = cy + Math.sin(a0) * ry;
      var x1 = cx + Math.cos(a1) * rx, y1 = cy + Math.sin(a1) * ry;
      var bx = cx + Math.cos(am) * rx * (1 + bumps[i]);
      var by = cy + Math.sin(am) * ry * (1 + bumps[i]);
      if (i === 0) c.moveTo(x0, y0);
      c.quadraticCurveTo(bx, by, x1, y1);
    }
    c.closePath();
  }

  var poster = new Image();
  poster.src = "assets/release/drei-cover.webp";

  function draw(){
    if (!isVisible()){ running = false; return; }
    rafId = requestAnimationFrame(draw);

    ctx.clearRect(0, 0, PW, PH);

    /* Schatten */
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.45)";
    ctx.shadowBlur  = 20 * DPR;
    ctx.shadowOffsetY = 5 * DPR;
    bubblePath(ctx, PW, PH);
    ctx.fillStyle = "rgba(0,0,0,0.001)";
    ctx.fill();
    ctx.restore();

    /* Schwarzer Rand */
    ctx.save();
    bubblePath(ctx, PW, PH);
    ctx.lineWidth = 8 * DPR;
    ctx.strokeStyle = "rgba(0,0,0,0.92)";
    ctx.stroke();
    ctx.restore();

    /* Weisser Rand */
    ctx.save();
    bubblePath(ctx, PW, PH);
    ctx.lineWidth = 4 * DPR;
    ctx.strokeStyle = "rgba(255,255,255,0.97)";
    ctx.stroke();
    ctx.restore();

    /* Video / Poster */
    ctx.save();
    bubblePath(ctx, PW, PH);
    ctx.clip();
    var src = vid.readyState >= 2 ? vid : (poster.complete ? poster : null);
    if (src){
      var vw = src.videoWidth  || src.naturalWidth  || 1280;
      var vh = src.videoHeight || src.naturalHeight || 720;
      var vr = vw / vh, cr = PW / PH;
      var sw, sh, sx, sy;
      if (vr > cr){ sh = PH; sw = PH * vr; sx = (PW - sw)/2; sy = 0; }
      else         { sw = PW; sh = PW / vr; sx = 0; sy = (PH - sh)/2; }
      ctx.drawImage(src, sx, sy, sw, sh);
    } else {
      ctx.fillStyle = "#111";
      ctx.fillRect(0, 0, PW, PH);
    }
    ctx.restore();
  }

  function start(){
    if (running) return;
    running = true;
    resize();
    positionButtons();
    draw();
  }

  /* Sofort starten wenn sichtbar, sonst auf resize warten */
  if (isVisible()){
    start();
  }

  window.addEventListener("resize", function(){
    if (isVisible()){
      resize();
      if (!running) start();
    } else {
      running = false;
      if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
    }
  }, { passive: true });

  /* Buttons */
  var mpl = document.getElementById("m-pl");
  var mpa = document.getElementById("m-pa");
  var mso = document.getElementById("m-so");

  function updateMobileSound(){
    if (!mso) return;
    mso.innerHTML = sndIco(vid.muted);
    mso.setAttribute("aria-label", vid.muted ? "Ton einschalten" : "Ton ausschalten");
  }

  if (mpl) mpl.onclick = function(){ vid.play(); };
  if (mpa) mpa.onclick = function(){ vid.pause(); };
  if (mso) mso.onclick = function(){ vid.muted = !vid.muted; updateMobileSound(); };

  updateMobileSound();
}());
</script>

<script>
(function(){
  var c = document.getElementById("xhair");
  if (!c) return;

  if (!window.matchMedia("(pointer:fine)").matches) {
    c.style.display = "none";
    return;
  }

  if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
    c.style.display = "none";
    return;
  }

  var lx = c.querySelector(".lx");
  var ly = c.querySelector(".ly");

  var x = -9999;
  var y = -9999;
  var raf = null;

  function draw(){
    lx.style.top = y + "px";
    ly.style.left = x + "px";
    raf = null;
  }

  window.addEventListener("mousemove", function(e){
    x = e.clientX;
    y = e.clientY;

    if (!raf) raf = requestAnimationFrame(draw);
  }, { passive: true });

  window.addEventListener("mouseleave", function(){
    x = -9999;
    y = -9999;
    draw();
  });
}());
</script>
