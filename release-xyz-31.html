<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>b3nn3t „drei" | neuer release</title>

<style>

:root{
 --bg:#930010;
 --text:#fdfdfd;
 --max:960px;
}

*,
*::before,
*::after{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

html,
body{
 overflow-x:hidden;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}

body{
 min-height:100vh;
}

.page-wrap{
 width:100%;
 display:flex;
 justify-content:center;
 padding:2rem 1rem 4rem;
}

.content{
 width:100%;
 max-width:var(--max);
}

main{
 display:flex;
 flex-direction:column;
 gap:1.5rem;
}

/* TOP */

.topline{
 display:flex;
 align-items:center;
 gap:.7rem;
 font-size:.92rem;
 margin-bottom:1rem;
}

.brand{
 color:#fff;
 text-decoration:none;
 font-weight:700;
}

#timer{
 font-weight:700;
}

/* VIDEO */

.video-wrap{
 position:relative;
 width:100%;
 margin-bottom:1rem;
}

.desktop-scene{
 position:relative;
 min-height:760px;
}

/* PERSON */

.person-d{
 position:absolute;
 bottom:-40px;
 left:50%;
 transform:translateX(-50%);
 width:320px;
 z-index:20;
 pointer-events:none;
 filter:drop-shadow(0 12px 20px rgba(0,0,0,.35));
}

/* BUBBLE */

.bwrap-d{
 position:relative;
 width:100%;
 max-width:860px;
 margin:auto;
 z-index:5;
 filter:drop-shadow(0 18px 28px rgba(0,0,0,.35));
}

.bwrap-d svg{
 width:100%;
 height:auto;
 display:block;
 overflow:visible;
}

.vid-d{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
 background:#000;
}

/* OUTLINES */

.bsh{
 fill:none;
 stroke:rgba(0,0,0,.95);
 stroke-width:18;
 stroke-linejoin:round;
}

.bst{
 fill:none;
 stroke:#fff;
 stroke-width:8;
 stroke-linejoin:round;
}

/* BUTTONS */

.dbtns{
 position:absolute;
 right:30px;
 bottom:120px;
 display:flex;
 flex-direction:column;
 align-items:flex-end;
 gap:12px;
 z-index:50;
}

/* COMIC BUTTONS */

.cbtn{
 position:relative;
 background:#fff;
 color:#111;
 border:none;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:
 0 0 0 4px #000,
 0 8px 14px rgba(0,0,0,.25);
 transition:transform .15s;
}

.cbtn:hover{
 transform:scale(1.06);
}

.cbtn svg{
 fill:currentColor;
}

/* IRREGULAR COMIC SHAPES */

.d-pl{
 width:130px;
 height:82px;

 border-radius:
 52% 48% 58% 42% /
 43% 52% 48% 57%;
}

.d-pa{
 width:102px;
 height:66px;

 margin-right:20px;

 border-radius:
 57% 43% 51% 49% /
 47% 56% 44% 53%;
}

.d-so{
 width:76px;
 height:50px;

 margin-right:42px;

 border-radius:
 46% 54% 44% 56% /
 53% 43% 57% 47%;
}

.d-pl svg{
 width:42%;
 height:42%;
}

.d-pa svg{
 width:38%;
 height:38%;
}

.d-so svg{
 width:38%;
 height:38%;
}

/* TITLE */

.title-wrap{
 position:relative;
 z-index:100;
 margin-top:-170px;
}

.songtitle{
 position:relative;
 z-index:100;

 font-size:clamp(4rem,10vw,8rem);
 font-weight:800;
 line-height:.9;
 letter-spacing:-.05em;

 color:#fff;
}

/* TEXT */

section.blk{
 position:relative;
 z-index:100;
}

section.blk h2{
 margin-bottom:.8rem;
 font-size:2rem;
}

section.blk p{
 line-height:1.7;
 font-size:1rem;
}

section.blk p+p{
 margin-top:.7rem;
}

/* SOCIAL */

.social-icons{
 display:flex;
 flex-wrap:wrap;
 gap:1rem;
 margin-top:1rem;
}

.social-link{
 text-decoration:none;
}

.social-icon-img{
 width:56px;
 height:56px;
 object-fit:contain;
 display:block;
}

/* LINK */

.more-link{
 display:inline-block;
 margin-top:.8rem;
 color:#fff;
 font-size:2rem;
 font-weight:800;
}

/* MOBILE */

@media (max-width:768px){

 .desktop-scene{
  min-height:auto;
 }

 .person-d{
  width:210px;
  bottom:-10px;
 }

 .dbtns{
  right:8px;
  bottom:90px;
  gap:8px;
 }

 .d-pl{
  width:100px;
  height:66px;
 }

 .d-pa{
  width:82px;
  height:54px;
 }

 .d-so{
  width:62px;
  height:42px;
 }

 .songtitle{
  font-size:5rem;
 }

 .title-wrap{
  margin-top:-70px;
 }

}

</style>
</head>

<script>

/* SOUND ICON */

function sndIco(m){

 return m
 ? `<svg viewBox="0 0 24 24">
 <path d="M3 9v6h4l5 5V4L7 9H3z"/>
 <path d="M16 9l5 5m0-5l-5 5"
 stroke="currentColor"
 stroke-width="2.3"
 stroke-linecap="round"
 fill="none"/>
 </svg>`
 :
 `<svg viewBox="0 0 24 24">
 <path d="M3 9v6h4l5 5V4L7 9H3z"/>
 <path d="M16.5 8.5a5 5 0 0 1 0 7"
 fill="none"
 stroke="currentColor"
 stroke-width="2"/>
 </svg>`;

}

/* CONTROLS */

(function(){

 const v=document.getElementById('vid-d');

 const pl=document.getElementById('dp');
 const pa=document.getElementById('dpa');
 const so=document.getElementById('ds');

 function upd(){

  so.innerHTML=sndIco(v.muted);

 }

 pl.onclick=()=>v.play();

 pa.onclick=()=>v.pause();

 so.onclick=()=>{

  v.muted=!v.muted;

  upd();

 };

 upd();

})();

</script>
