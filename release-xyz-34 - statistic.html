<style>

}

html,
body{

.page-wrap{

.content{

.brand-link{

.back-link{

.back-link:hover{

h1{

.game-stats span{

.small-card{

.small-card strong{

}

    margin-top:0.3rem;

}

.chart-section{

.chart-head{

}

.chart-head h2{

    letter-spacing:0.04em;

}

.chart-head span{

}

#playsChart{

    display:block;
}

.country-layout{

#countryChart{

.country-list{

.country-row{

.country-name{

.country-plays{

.country-percent{

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
    "https://xqucqbyzklmptyjgghgo.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MRJcYGadARj5Es6fiNcD2A_FJyZ_bX3";

/*
  Diese Statistikseite zeigt nur das Release Game / Level 1.
  true = alte Einträge ohne level werden als Release Game mitgezählt.
  false = nur Einträge mit level = 1 werden gezählt.
*/
const RELEASE_GAME_LEVEL = 1;
const INCLUDE_OLD_NULL_LEVEL = true;

/*
  Startdatum des Release-Game-Graphen.
  Ab Tag 31 verschiebt sich das Fenster automatisch weiter,
  sodass immer 30 Tage sichtbar bleiben.
*/
const RELEASE_GRAPH_START_DATE = "2026-05-20";

let supabaseClient = null;

const statusEl =
document.getElementById("status");

function setStatus(text){
    if(statusEl){
        statusEl.textContent = text || "";
    }
}

if(typeof window.supabase !== "undefined"){
    supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
}else{
    setStatus("Supabase konnte nicht geladen werden.");
}

/* =====================================
   HELPERS
===================================== */

function applyLevelFilter(query){
    if(INCLUDE_OLD_NULL_LEVEL){
        return query.or(
            "level.eq." + RELEASE_GAME_LEVEL + ",level.is.null"
        );
    }

    return query.eq(
        "level",
        RELEASE_GAME_LEVEL
    );
}

function formatNumber(value){
    return new Intl.NumberFormat("de-CH").format(
        Number(value || 0)
    );
}

function formatTime(value){
    if(!value){
        return "--";
    }

    const date =
    new Date(value);

    return date.toLocaleTimeString(
        "de-CH",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function setText(id, value){
    const el =
    document.getElementById(id);

    if(el){
        el.textContent = value;
    }
}

function startOfToday(){
    const d =
    new Date();

    d.setHours(0,0,0,0);

    return d;
}

function daysAgo(days){
    const d =
    startOfToday();

    d.setDate(
        d.getDate() - days
    );

    return d;
}

function addDays(date, days){
    const d =
    new Date(date);

    d.setDate(
        d.getDate() + days
    );

    return d;
}

function dateKey(date){
    const d =
    new Date(date);

    const y =
    d.getFullYear();

    const m =
    String(d.getMonth() + 1).padStart(2, "0");

    const day =
    String(d.getDate()).padStart(2, "0");

    return y + "-" + m + "-" + day;
}

function getChartStartDate(){
    const releaseStart =
    new Date(RELEASE_GRAPH_START_DATE + "T00:00:00");

    const rollingStart =
    daysAgo(29);

    return rollingStart > releaseStart
    ? rollingStart
    : releaseStart;
}

async function countAnalyticsSince(startDate){
    let query =
    supabaseClient
    .from("analytics")
    .select("id", {
        count:"exact",
        head:true
    })
    .eq("event", "play")
    .gte("created_at", startDate.toISOString());

    query =
    applyLevelFilter(query);

    const { count, error } =
    await query;

    if(error){
        throw error;
    }

    return count || 0;
}

async function countAnalyticsAll(){
    let query =
    supabaseClient
    .from("analytics")
    .select("id", {
        count:"exact",
        head:true
    })
    .eq("event", "play");

    query =
    applyLevelFilter(query);

    const { count, error } =
    await query;

    if(error){
        throw error;
    }

    return count || 0;
}

async function countAnalyticsByDevice(device){
    let query =
    supabaseClient
    .from("analytics")
    .select("id", {
        count:"exact",
        head:true
    })
    .eq("event", "play")
    .eq("device", device);

    query =
    applyLevelFilter(query);

    const { count, error } =
    await query;

    if(error){
        throw error;
    }

    return count || 0;
}

/* =====================================
   LOAD STATS
===================================== */

async function loadStats(){
    if(!supabaseClient){
        return;
    }

    try{
        const todayStart =
        startOfToday();

        const weekStart =
        daysAgo(6);

        const monthStart =
        daysAgo(29);

        const [
            playsToday,
            playsWeek,
            playsMonth,
            playsTotal,
            mobile,
            desktop
        ] =
        await Promise.all([
            countAnalyticsSince(todayStart),
            countAnalyticsSince(weekStart),
            countAnalyticsSince(monthStart),
            countAnalyticsAll(),
            countAnalyticsByDevice("mobile"),
            countAnalyticsByDevice("desktop")
        ]);

        /*
          Unique Players aus Analytics.
          Für normale Promo-Zahlen reicht das völlig.
        */
        let playersQuery =
        supabaseClient
        .from("analytics")
        .select("player_id, player")
        .eq("event", "play")
        .limit(10000);

        playersQuery =
        applyLevelFilter(playersQuery);

        const { data: playerRows, error: playersError } =
        await playersQuery;

        if(playersError){
            throw playersError;
        }

        const playerSet =
        new Set();

        (playerRows || []).forEach(row => {
            if(row.player_id){
                playerSet.add("id:" + row.player_id);
            }else if(row.player){
                playerSet.add("name:" + String(row.player).toLowerCase());
            }
        });

        /*
          Top Score nur aus Level 1 Scores.
        */
        let topScoreQuery =
        supabaseClient
        .from("scores")
        .select("score")
        .order("score", {
            ascending:false
        })
        .limit(1);

        topScoreQuery =
        applyLevelFilter(topScoreQuery);

        const { data: topRows, error: topError } =
        await topScoreQuery;

        if(topError){
            throw topError;
        }

        const topScore =
        topRows && topRows[0]
        ? Number(topRows[0].score || 0)
        : 0;

        /*
          Last Play nur Level 1.
        */
        let lastPlayQuery =
        supabaseClient
        .from("analytics")
        .select("created_at")
        .eq("event", "play")
        .order("created_at", {
            ascending:false
        })
        .limit(1);

        lastPlayQuery =
        applyLevelFilter(lastPlayQuery);

        const { data: lastRows, error: lastError } =
        await lastPlayQuery;

        if(lastError){
            throw lastError;
        }

        const lastPlay =
        lastRows && lastRows[0]
        ? lastRows[0].created_at
        : null;

        const mobileShare =
        playsTotal > 0
        ? Math.round((mobile / playsTotal) * 100) + "%"
        : "--";

        setText("statToday", formatNumber(playsToday));
        setText("statWeek", formatNumber(playsWeek));
        setText("statMonth", formatNumber(playsMonth));
        setText("statTotal", formatNumber(playsTotal));
        setText("statPlayers", formatNumber(playerSet.size));
        setText("statTopScore", formatNumber(topScore));

        setText("statMobile", formatNumber(mobile));
        setText("statDesktop", formatNumber(desktop));
        setText("statLastPlay", formatTime(lastPlay));
        setText("statMobileShare", mobileShare);

    }catch(error){
        console.error("Stats load failed:", error);

        setStatus(
            "Statistik konnte nicht geladen werden: " +
            (error.message || "unbekannter Fehler")
        );
    }
}

/* =====================================
   LOAD 30 DAY CHART
===================================== */

async function loadDailyChart(){
    if(!supabaseClient){
        return;
    }

    const canvas =
    document.getElementById("playsChart");

    if(!canvas){
        return;
    }

    try{
        const chartStart =
        getChartStartDate();

        const chartEnd =
        addDays(chartStart, 29);

        const queryEnd =
        addDays(chartEnd, 1);

        let query =
        supabaseClient
        .from("analytics")
        .select("created_at")
        .eq("event", "play")
        .gte("created_at", chartStart.toISOString())
        .lt("created_at", queryEnd.toISOString())
        .limit(10000);

        query =
        applyLevelFilter(query);

        const { data, error } =
        await query;

        if(error){
            throw error;
        }

        const map = {};

        for(let i = 0; i < 30; i++){
            const d =
            addDays(chartStart, i);

            map[dateKey(d)] = 0;
        }

        (data || []).forEach(row => {
            const key =
            dateKey(row.created_at);

            if(Object.prototype.hasOwnProperty.call(map, key)){
                map[key]++;
            }
        });

        const rows =
        Object.keys(map)
        .sort()
        .map(key => ({
            day:key,
            plays:map[key]
        }));

        drawBarChart(canvas, rows);

    }catch(error){
        console.error("Daily chart load failed:", error);

        setStatus(
            "Graph konnte nicht geladen werden: " +
            (error.message || "unbekannter Fehler")
        );
    }
}

function drawBarChart(canvas, rows){
    rows =
    [...rows].sort(
        (a, b) => {
            const da = String(a.day);
            const db = String(b.day);
            return da.localeCompare(db);
        }
    );

    const ctx =
    canvas.getContext("2d");

    const dpr =
    window.devicePixelRatio || 1;

    const cssWidth =
    canvas.clientWidth || 600;

    const cssHeight =
    canvas.clientHeight || 260;

    canvas.width =
    Math.floor(cssWidth * dpr);

    canvas.height =
    Math.floor(cssHeight * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.clearRect(0, 0, cssWidth, cssHeight);

    const padding = {
        top: 20,
        right: 16,
        bottom: 34,
        left: 44
    };

    const chartW =
    cssWidth - padding.left - padding.right;

    const chartH =
    cssHeight - padding.top - padding.bottom;

    const maxPlays =
    Math.max(
        1,
        ...rows.map(row => Number(row.plays || 0))
    );

    setText(
        "chartMax",
        "max: " + formatNumber(maxPlays)
    );

    ctx.strokeStyle =
    "rgba(255,255,255,0.10)";

    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top);
    ctx.lineTo(padding.left + chartW, padding.top);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top + chartH);
    ctx.lineTo(padding.left + chartW, padding.top + chartH);
    ctx.stroke();

    ctx.fillStyle =
    "rgba(255,255,255,0.65)";

    ctx.font =
    "11px Arial, sans-serif";

    ctx.textAlign =
    "right";

    ctx.fillText(
        String(maxPlays),
        padding.left - 10,
        padding.top + 4
    );

    ctx.fillText(
        "0",
        padding.left - 10,
        padding.top + chartH + 4
    );

    const gap =
    rows.length > 20 ? 3 : 5;

    const barW =
    rows.length > 0
    ? Math.max(
        6,
        (chartW - gap * (rows.length - 1)) / rows.length
    )
    : 0;

    rows.forEach((row, index) => {
        const plays =
        Number(row.plays || 0);

        const x =
        padding.left + index * (barW + gap);

        if(plays <= 0){
            return;
        }

        const h =
        Math.max(
            6,
            (plays / maxPlays) * chartH
        );

        const y =
        padding.top + chartH - h;

        ctx.fillStyle =
        "rgba(255,255,255,0.95)";

        ctx.fillRect(
            x,
            y,
            barW,
            h
        );
    });

    const labelIndexes = [
        0,
        14,
        rows.length - 1
    ];

    ctx.textAlign =
    "left";

    labelIndexes.forEach(index => {
        if(!rows[index]){
            return;
        }

        const raw =
        String(rows[index].day);

        const parts =
        raw.split("-");

        let label = raw;

        if(parts.length === 3){
            label =
            parts[2] + "." + parts[1];
        }

        const x =
        padding.left + index * (barW + gap);

        ctx.fillStyle =
        "rgba(255,255,255,0.62)";

        ctx.font =
        "10px Arial, sans-serif";

        ctx.fillText(
            label,
            Math.max(0, x - 4),
            cssHeight - 10
        );
    });
}

/* =====================================
   COUNTRY STATS
===================================== */

const countryColors = [
    "rgba(255,255,255,0.95)",
    "rgba(255,255,255,0.78)",
    "rgba(255,255,255,0.62)",
    "rgba(255,255,255,0.48)",
    "rgba(255,255,255,0.36)",
    "rgba(255,255,255,0.28)",
    "rgba(255,255,255,0.22)",
    "rgba(255,255,255,0.18)",
    "rgba(255,255,255,0.14)",
    "rgba(255,255,255,0.10)"
];

async function loadCountryStats(){
    if(!supabaseClient){
        return;
    }

    const canvas =
    document.getElementById("countryChart");

    const list =
    document.getElementById("countryList");

    if(!canvas || !list){
        return;
    }

    try{
        let query =
        supabaseClient
        .from("analytics")
        .select("country")
        .eq("event", "play")
        .limit(10000);

        query =
        applyLevelFilter(query);

        const { data, error } =
        await query;

        if(error){
            throw error;
        }

        const counts = {};

        (data || []).forEach(row => {
            const country =
            row.country || "UNKNOWN";

            counts[country] =
            (counts[country] || 0) + 1;
        });

        const rows =
        Object.keys(counts)
        .map(country => ({
            country,
            plays:counts[country]
        }))
        .sort((a,b) => b.plays - a.plays)
        .slice(0,10);

        drawCountryPie(canvas, rows);
        renderCountryList(list, rows);

    }catch(error){
        console.error("Country stats load failed:", error);

        setStatus(
            "Länderstatistik konnte nicht geladen werden: " +
            (error.message || "unbekannter Fehler")
        );
    }
}

function drawCountryPie(canvas, rows){
    const ctx =
    canvas.getContext("2d");

    const dpr =
    window.devicePixelRatio || 1;

    const cssWidth =
    canvas.clientWidth || 260;

    const cssHeight =
    canvas.clientHeight || 260;

    canvas.width =
    Math.floor(cssWidth * dpr);

    canvas.height =
    Math.floor(cssHeight * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.clearRect(0, 0, cssWidth, cssHeight);

    const total =
    rows.reduce(
        (sum, row) => sum + Number(row.plays || 0),
        0
    );

    const cx =
    cssWidth / 2;

    const cy =
    cssHeight / 2;

    const radius =
    Math.min(cssWidth, cssHeight) * 0.42;

    if(total <= 0){
        ctx.strokeStyle =
        "rgba(255,255,255,0.3)";

        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle =
        "rgba(255,255,255,0.65)";

        ctx.font =
        "14px Arial, sans-serif";

        ctx.textAlign =
        "center";

        ctx.fillText(
            "no data",
            cx,
            cy + 5
        );

        return;
    }

    let startAngle =
    -Math.PI / 2;

    rows.forEach((row, index) => {
        const value =
        Number(row.plays || 0);

        const slice =
        (value / total) * Math.PI * 2;

        const endAngle =
        startAngle + slice;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.closePath();

        ctx.fillStyle =
        countryColors[index % countryColors.length];

        ctx.fill();

        ctx.strokeStyle =
        "rgba(0,0,0,0.55)";

        ctx.lineWidth = 2;
        ctx.stroke();

        startAngle =
        endAngle;
    });

    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.48, 0, Math.PI * 2);
    ctx.fillStyle =
    "#000000";
    ctx.fill();

    ctx.fillStyle =
    "#ffffff";

    ctx.font =
    "700 16px Arial, sans-serif";

    ctx.textAlign =
    "center";

    ctx.fillText(
        formatNumber(total),
        cx,
        cy - 2
    );

    ctx.fillStyle =
    "rgba(255,255,255,0.7)";

    ctx.font =
    "11px Arial, sans-serif";

    ctx.fillText(
        "plays",
        cx,
        cy + 16
    );
}

function renderCountryList(container, rows){
    const total =
    rows.reduce(
        (sum, row) => sum + Number(row.plays || 0),
        0
    );

    if(total <= 0){
        container.innerHTML =
        "<p style='opacity:0.7;margin:0;'>keine länderdaten vorhanden</p>";
        return;
    }

    container.innerHTML = "";

    rows.forEach((row, index) => {
        const plays =
        Number(row.plays || 0);

        const percent =
        total > 0
        ? Math.round((plays / total) * 100)
        : 0;

        const country =
        row.country || "UNKNOWN";

        const div =
        document.createElement("div");

        div.className =
        "country-row";

        div.innerHTML = `
            <span class="country-dot" style="background:${countryColors[index % countryColors.length]}"></span>
            <span class="country-name">${country}</span>
            <span class="country-plays">${formatNumber(plays)}</span>
            <span class="country-percent">${percent}%</span>
        `;

        container.appendChild(div);
    });
}

===================================== */

async function init(){
    setStatus("lade statistik ...");

    await loadStats();
    await loadDailyChart();
    await loadCountryStats();

    setStatus("");
}

init();

let resizeTimer = null;

window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);

    resizeTimer =
    setTimeout(() => {
        loadDailyChart();
        loadCountryStats();
    }, 200);
});
</script>
