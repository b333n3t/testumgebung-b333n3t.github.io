<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>b3nn3t | game statistics</title>

<style>
:root{
    --bg:#000000;
    --text:#ffffff;
    --muted:rgba(255,255,255,0.72);
    --card:rgba(255,255,255,0.045);
    --border:rgba(255,255,255,0.16);
    --max:960px;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;
}

.page-wrap{
    min-height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:
        clamp(2.8rem,4vw,3.8rem)
        1.5rem
        clamp(3.5rem,5vw,4.5rem);
}

.content{
    width:100%;
    max-width:var(--max);
}

.topline{
    display:flex;
    flex-wrap:nowrap;
    align-items:baseline;
    gap:0.7rem;
    font-size:0.92rem;
    letter-spacing:0.04em;
    margin-bottom:clamp(1.6rem,2.4vw,2.2rem);
}

.brand-link{
    color:#ffffff;
    font-weight:700;
    text-decoration:none;
    letter-spacing:0.04em;
}

.back-link{
    color:#ffffff;
    text-decoration:none;
    opacity:0.85;
}

.back-link:hover{
    opacity:1;
}

h1{
    margin:0 0 0.6rem;
    font-size:clamp(2rem,5vw,4rem);
    line-height:1;
    letter-spacing:0.04em;
    text-transform:uppercase;
}

.subtitle{
    margin:0 0 2.4rem;
    color:var(--muted);
    letter-spacing:0.04em;
}

.game-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1rem;
    margin-bottom:2.4rem;
}

.game-stats div{
    border:1px solid var(--border);
    border-radius:18px;
    padding:1rem;
    background:var(--card);
}

.game-stats strong{
    display:block;
    font-size:clamp(1.5rem,3vw,2.4rem);
    line-height:1.1;
    font-weight:900;
}

.game-stats span{
    display:block;
    margin-top:0.4rem;
    font-size:0.82rem;
    opacity:0.75;
    letter-spacing:0.06em;
    text-transform:lowercase;
}

.chart-section{
    margin-top:1rem;
    border:1px solid var(--border);
    border-radius:22px;
    padding:1.2rem;
    background:var(--card);
}

.chart-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:1rem;
    margin-bottom:1rem;
}

.chart-head h2{
    margin:0;
    font-size:1.08rem;
    letter-spacing:0.04em;
    text-transform:lowercase;
}

.chart-head span{
    font-size:0.85rem;
    color:var(--muted);
}

#playsChart{
    width:100%;
    height:260px;
    display:block;
}

.status{
    margin-top:1.2rem;
    color:var(--muted);
    font-size:0.9rem;
}

.small-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:1rem;
    margin-top:1rem;
}

.small-card{
    border:1px solid var(--border);
    border-radius:18px;
    padding:1rem;
    background:var(--card);
}

.small-card strong{
    display:block;
    font-size:1.4rem;
}

.small-card span{
    display:block;
    margin-top:0.3rem;
    opacity:0.75;
    font-size:0.82rem;
    letter-spacing:0.04em;
    text-transform:lowercase;
}

@media(max-width:768px){
    .page-wrap{
        padding:1.8rem 1rem 3rem;
    }

    .topline{
        font-size:0.87rem;
        gap:0.45rem;
    }

    .game-stats{
        grid-template-columns:repeat(2,1fr);
    }

    #playsChart{
        height:220px;
    }
}

@media(max-width:420px){
    .game-stats{
        grid-template-columns:1fr;
    }

    .small-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="page-wrap">
    <div class="content">

        <div class="topline">
            <a class="brand-link" href="index.html">b3nn3t</a>
            <span style="opacity:.75">game statistics</span>
            <a class="back-link" href="release-xyz-34.html">zurück zum game</a>
        </div>

        <h1>statistics</h1>
        <p class="subtitle">release game auswertung</p>

        <div id="gameStats" class="game-stats">
            <div>
                <strong id="statToday">--</strong>
                <span>heute</span>
            </div>

            <div>
                <strong id="statWeek">--</strong>
                <span>woche</span>
            </div>

            <div>
                <strong id="statMonth">--</strong>
                <span>monat</span>
            </div>

            <div>
                <strong id="statTotal">--</strong>
                <span>gesamt</span>
            </div>

            <div>
                <strong id="statPlayers">--</strong>
                <span>players</span>
            </div>

            <div>
                <strong id="statTopScore">--</strong>
                <span>top score</span>
            </div>
        </div>

        <div class="small-grid">
            <div class="small-card">
                <strong id="statMobile">--</strong>
                <span>mobile plays</span>
            </div>

            <div class="small-card">
                <strong id="statDesktop">--</strong>
                <span>desktop plays</span>
            </div>

            <div class="small-card">
                <strong id="statLastPlay">--</strong>
                <span>last play</span>
            </div>

            <div class="small-card">
                <strong id="statMobileShare">--</strong>
                <span>mobile anteil</span>
            </div>
        </div>

        <section class="chart-section">
            <div class="chart-head">
                <h2>plays letzte 30 tage</h2>
                <span id="chartMax">max: --</span>
            </div>

            <canvas id="playsChart"></canvas>
        </section>

        <div id="status" class="status"></div>

    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
    "https://xqucqbyzklmptyjgghgo.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MRJcYGadARj5Es6fiNcD2A_FJyZ_bX3";

let supabaseClient = null;

const statusEl =
document.getElementById("status");

function setStatus(text){
    if(statusEl){
        statusEl.textContent = text || "";
    }
}

if(typeof window.supabase !== "undefined"){
    supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
}else{
    setStatus("Supabase konnte nicht geladen werden.");
}

/* =====================================
   HELPERS
===================================== */

function formatNumber(value){
    return new Intl.NumberFormat("de-CH").format(
        Number(value || 0)
    );
}

function formatTime(value){
    if(!value){
        return "--";
    }

    const date =
    new Date(value);

    return date.toLocaleTimeString(
        "de-CH",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function setText(id, value){
    const el =
    document.getElementById(id);

    if(el){
        el.textContent = value;
    }
}

/* =====================================
   LOAD STATS
===================================== */

async function loadStats(){
    if(!supabaseClient){
        return;
    }

    const { data, error } =
    await supabaseClient
    .rpc("get_game_stats");

    if(error){
        console.error("Stats load failed:", error);
        setStatus("Statistik konnte nicht geladen werden.");
        return;
    }

    if(!data){
        return;
    }

    const total =
    Number(data.plays_total || 0);

    const mobile =
    Number(data.mobile_plays || 0);

    const desktop =
    Number(data.desktop_plays || 0);

    const mobileShare =
    total > 0
    ? Math.round((mobile / total) * 100) + "%"
    : "--";

    setText("statToday", formatNumber(data.plays_today));
    setText("statWeek", formatNumber(data.plays_week));
    setText("statMonth", formatNumber(data.plays_month));
    setText("statTotal", formatNumber(data.plays_total));
    setText("statPlayers", formatNumber(data.players_total));
    setText("statTopScore", formatNumber(data.top_score));

    setText("statMobile", formatNumber(mobile));
    setText("statDesktop", formatNumber(desktop));
    setText("statLastPlay", formatTime(data.last_play));
    setText("statMobileShare", mobileShare);
}

/* =====================================
   LOAD 30 DAY CHART
===================================== */

async function loadDailyChart(){
    if(!supabaseClient){
        return;
    }

    const canvas =
    document.getElementById("playsChart");

    if(!canvas){
        return;
    }

    const { data, error } =
    await supabaseClient
    .rpc("get_daily_play_stats", {
        days_back: 30
    });

    if(error){
        console.error("Daily chart load failed:", error);
        setStatus("Graph konnte nicht geladen werden.");
        return;
    }

    drawBarChart(canvas, data || []);
}

function drawBarChart(canvas, rows){
    const ctx =
    canvas.getContext("2d");

    const dpr =
    window.devicePixelRatio || 1;

    const cssWidth =
    canvas.clientWidth || 600;

    const cssHeight =
    canvas.clientHeight || 260;

    canvas.width =
    Math.floor(cssWidth * dpr);

    canvas.height =
    Math.floor(cssHeight * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.clearRect(0, 0, cssWidth, cssHeight);

    const padding = {
        top: 20,
        right: 16,
        bottom: 34,
        left: 38
    };

    const chartW =
    cssWidth - padding.left - padding.right;

    const chartH =
    cssHeight - padding.top - padding.bottom;

    const maxPlays =
    Math.max(
        1,
        ...rows.map(row => Number(row.plays || 0))
    );

    setText("chartMax", "max: " + formatNumber(maxPlays));

    /* y-axis labels */
    ctx.fillStyle =
    "rgba(255,255,255,0.65)";

    ctx.font =
    "11px Arial, sans-serif";

    ctx.fillText(
        String(maxPlays),
        6,
        padding.top + 8
    );

    ctx.fillText(
        "0",
        22,
        padding.top + chartH
    );

    /* baseline */
    ctx.strokeStyle =
    "rgba(255,255,255,0.16)";

    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top + chartH + 0.5);
    ctx.lineTo(padding.left + chartW, padding.top + chartH + 0.5);
    ctx.stroke();

    const gap =
    rows.length > 20 ? 3 : 5;

    const barW =
    rows.length > 0
    ? Math.max(3, (chartW - gap * (rows.length - 1)) / rows.length)
    : 0;

    rows.forEach((row, index) => {
        const plays =
        Number(row.plays || 0);

        const h =
        (plays / maxPlays) * chartH;

        const x =
        padding.left + index * (barW + gap);

        const y =
        padding.top + chartH - h;

        ctx.fillStyle =
        "rgba(255,255,255,0.9)";

        ctx.fillRect(
            x,
            y,
            barW,
            Math.max(1, h)
        );

        if(index === 0 || index === 14 || index === rows.length - 1){
            const date =
            new Date(row.day);

            const label =
            String(date.getDate()).padStart(2, "0") +
            "." +
            String(date.getMonth() + 1).padStart(2, "0");

            ctx.fillStyle =
            "rgba(255,255,255,0.62)";

            ctx.font =
            "10px Arial, sans-serif";

            ctx.fillText(
                label,
                Math.max(0, x - 4),
                cssHeight - 10
            );
        }
    });
}

/* =====================================
   INIT
===================================== */

async function init(){
    setStatus("lade statistik ...");

    await loadStats();
    await loadDailyChart();

    setStatus("");
}

init();

window.addEventListener("resize", () => {
    loadDailyChart();
});
</script>

</body>
</html>
