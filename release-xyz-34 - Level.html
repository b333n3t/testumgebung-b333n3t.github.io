(function(){

    if(!el) return;

    let countdownTimer = null;

    function updateCountdown(){
        const diff = targetDate - Date.now();
        if(diff <= 0){
            el.textContent = "OUT NOW";
            if(countdownTimer) clearInterval(countdownTimer);
            return;
        }

        const seconds = Math.floor(diff / 1000);
        const days = Math.floor(seconds / 86400);
        const hours = String(Math.floor((seconds % 86400) / 3600)).padStart(2,"0");
        const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2,"0");
        const secs = String(seconds % 60).padStart(2,"0");
        el.textContent = days > 0 ? days + "d " + hours + ":" + mins + ":" + secs : hours + ":" + mins + ":" + secs;
    }

    countdownTimer = setInterval(updateCountdown,1000);
    updateCountdown();
}());

    c.style.height = window.innerHeight + "px";

        document.querySelectorAll(".level-btn").forEach(b => b.classList.remove("active"));

/* =====================================
   DIFFICULTY
===================================== */
function getConfig(){
    return levelConfigs[selectedLevel] || levelConfigs[1];
}

function getElapsedSeconds(){
    if(!gameStartTime) return 0;
    return Math.max(0,(performance.now() - gameStartTime) / 1000);
}

function lerp(a,b,p){
    return a + (b - a) * p;
}

function getPhaseIndex(){
    const elapsed = getElapsedSeconds();
    if(elapsed < 25) return 0;
    if(elapsed < 40) return 1;
    return 2;
}

function getCurrentSpeed(){
    const cfg = getConfig();
    const elapsed = getElapsedSeconds();
    const key = isMobile ? "mobile" : "desktop";
    const ranges = cfg.speed[key];

    for(const r of ranges){
        const startT = r[0];
        const endT = r[1];
        const start = r[2];
        const end = r[3];
        if(elapsed < endT){
            const p = Math.max(0, Math.min(1, (elapsed - startT) / (endT - startT)));
            return lerp(start,end,p);
        }
    }

    return ranges[ranges.length - 1][3];
}

function getSpawnDelay(){
    const cfg = getConfig();
    const key = isMobile ? "mobile" : "desktop";
    return cfg.spawnDelay[key][getPhaseIndex()];
}

function getRandomFrom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

/* =====================================
   CONTROLS
===================================== */
function moveUp(){
    if(!running) return;
    player.vy = isMobile ? -7 : -9;
}

function moveDown(){
    if(!running) return;
    player.vy = isMobile ? 7 : 9;
}

window.addEventListener("keydown", e => {
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space"){
        e.preventDefault();
        moveUp();
    }
    if(e.code === "ArrowDown" || e.code === "KeyS"){
        e.preventDefault();
        moveDown();
    }
});

window.addEventListener("touchmove", e => {
    if(!running) return;
    e.preventDefault();
    const touch = e.touches[0];
    const y = touch.clientY;
    player.y += (y - player.y - player.h/2) * 0.25;
},{passive:false});

function escapeHtml(value){
    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getCleanName(){
    return (document.getElementById("name").value || "").trim().slice(0,12);
}

function getPlayerId(){
    let id = localStorage.getItem("playerId");
    if(!id){
        id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : "player_" + Date.now() + "_" + Math.random().toString(16).slice(2);
        localStorage.setItem("playerId", id);
    }
    return id;
}

function getBrowserCountry(){
    const lang = navigator.language || navigator.userLanguage || "";
    const parts = lang.split("-");
    if(parts.length >= 2) return parts[1].toUpperCase();
    return null;
}

function circleRectOverlap(cx, cy, r, rx, ry, rw, rh, padding = 0){
    const nearestX = Math.max(rx - padding, Math.min(cx, rx + rw + padding));
    const nearestY = Math.max(ry - padding, Math.min(cy, ry + rh + padding));
    const dx = cx - nearestX;
    const dy = cy - nearestY;
    return dx * dx + dy * dy < (r + padding) * (r + padding);
}

function orbInsideObstacle(x,y,r = 12){
    const padding = 18;
    for(let o of obstacles){
        if(circleRectOverlap(x,y,r,o.x,o.y,o.w,o.h,padding)) return true;
    }
    return false;
}

function obstacleOverlapsOrb(x,y,w,h){
    const padding = 22;
    for(let orb of orbs){
        if(circleRectOverlap(orb.x,orb.y,orb.r || 12,x,y,w,h,padding)) return true;
    }
    return false;
}

function spawnParticles(x,y,color){
    for(let i=0;i<30;i++){
        particles.push({
            x,y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6,
            life:40,
            color:color || "white"
        });
    }
}

/* =====================================
   SPAWN
===================================== */
function spawnObstacle(){
    const cfg = getConfig();
    const key = isMobile ? "mobile" : "desktop";
    const phase = getPhaseIndex();
    const heights = cfg.heights[key][phase];
    const widths = cfg.widths[key][phase];

    let h,w,y;
    let safeObstacle = false;
    let attempts = 0;

    while(!safeObstacle && attempts < 20){
        attempts++;
        const lane = Math.floor(Math.random() * 3);
        h = getRandomFrom(heights);
        w = getRandomFrom(widths);

        if(lane === 0) y = 80;
        if(lane === 1) y = window.innerHeight / 2 - h / 2;
        if(lane === 2) y = window.innerHeight - 180 - h;

        safeObstacle = !obstacleOverlapsOrb(window.innerWidth + 100, y, w, h);
    }

    const color = obstacleColors[Math.floor(Math.random() * obstacleColors.length)];

    obstacles.push({
        x:window.innerWidth + 100,
        y,w,h,
        color,
        type:cfg.theme,
        passed:false
    });

    const threshold = cfg.orbThreshold[phase];

    if(Math.random() > threshold){
        let orbX = window.innerWidth + 100 + w + 120;
        let orbY;
        let safe = false;
        let orbAttempts = 0;

        while(!safe && orbAttempts < 35){
            orbAttempts++;
            orbY = Math.random() * (window.innerHeight - 260) + 100;
            safe = !orbInsideObstacle(orbX, orbY, 12);
        }

        if(safe){
            orbs.push({x:orbX,y:orbY,r:12,taken:false,type:cfg.theme});
        }
    }
}

function updateSpawning(){
    const now = performance.now();
    if(now - lastSpawnTime >= nextSpawnDelay){
        spawnObstacle();
        lastSpawnTime = now;
        nextSpawnDelay = getSpawnDelay() * (0.82 + Math.random() * 0.36);
    }
}

/* =====================================
   UPDATE
===================================== */
function update(){
    const cfg = getConfig();
    const speed = getCurrentSpeed();
    bgOffset += speed * 0.2;

    updateSpawning();

    player.y += player.vy;
    player.vy *= 0.90;

    if(player.y < 40) player.y = 40;
    if(player.y > window.innerHeight - 140) player.y = window.innerHeight - 140;

    obstacles.forEach(o => {
        o.x -= speed;

        if(player.x < o.x + o.w && player.x + player.w > o.x && player.y < o.y + o.h && player.y + player.h > o.y){
            endGame("gameover");
        }

        if(!o.passed && o.x < player.x){
            o.passed = true;
            score += Math.round(10 * cfg.scoreMultiplier);
            if(score % 100 === 0) spawnParticles(player.x, player.y, cfg.playerColor);
        }
    });

    orbs.forEach(o => {
        o.x -= speed;
        const dx = (player.x + player.w/2) - o.x;
        const dy = (player.y + player.h/2) - o.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 30 && !o.taken){
            o.taken = true;
            score += Math.round(25 * cfg.scoreMultiplier);
            spawnParticles(o.x,o.y,cfg.orbColor);
        }
    });

    obstacles = obstacles.filter(o => o.x > -400);
    orbs = orbs.filter(o => o.x > -100 && !o.taken);

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(p => p.life > 0);

    document.getElementById("score").innerText = score;
}

/* =====================================
   DRAW BACKGROUND
===================================== */
function drawBackground(cfg){
    ctx.fillStyle = cfg.bg;
    ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

    if(cfg.theme === "normal"){
        for(let i=0;i<20;i++){
            ctx.fillStyle = "rgba(255,255,255,0.03)";
            ctx.fillRect((i*180 - performance.now()*0.05) % window.innerWidth, i*60, 120, 1);
        }
    }

    if(cfg.theme === "underwater"){
        const grad = ctx.createLinearGradient(0,0,0,window.innerHeight);
        grad.addColorStop(0,"#063c5f");
        grad.addColorStop(1,"#01121d");
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

        for(let i=0;i<32;i++){
            const x = (i*95 - bgOffset*0.8) % (window.innerWidth + 120);
            const y = 60 + (i*57) % (window.innerHeight - 120);
            ctx.strokeStyle = "rgba(185,245,255,0.16)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x,y,6 + (i%4)*3,0,Math.PI*2);
            ctx.stroke();
        }
    }

    if(cfg.theme === "sky"){
        const grad = ctx.createLinearGradient(0,0,0,window.innerHeight);
        grad.addColorStop(0,"#184f8a");
        grad.addColorStop(1,"#071b3a");
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

        for(let i=0;i<18;i++){
            const x = (i*170 - bgOffset*1.1) % (window.innerWidth + 220) - 110;
            const y = 70 + (i*83) % (window.innerHeight - 180);
            drawCloud(x,y,70 + (i%3)*22,"rgba(255,255,255,0.10)");
        }
    }

    if(cfg.theme === "forest"){
        const grad = ctx.createLinearGradient(0,0,0,window.innerHeight);
        grad.addColorStop(0,"#0d2d17");
        grad.addColorStop(1,"#020a05");
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

        for(let i=0;i<22;i++){
            const x = (i*130 - bgOffset*0.9) % (window.innerWidth + 160) - 80;
            const y = window.innerHeight - 65 - (i%4)*18;
            drawTree(x,y,45 + (i%3)*18,"rgba(80,180,90,0.12)");
        }
    }
}

function drawCloud(x,y,size,color){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x,y,size*0.25,0,Math.PI*2);
    ctx.arc(x+size*0.22,y-size*0.08,size*0.32,0,Math.PI*2);
    ctx.arc(x+size*0.52,y,size*0.25,0,Math.PI*2);
    ctx.rect(x-size*0.02,y,size*0.58,size*0.2);
    ctx.fill();
}

function drawTree(x,y,size,color){
    ctx.fillStyle = "rgba(90,55,20,0.16)";
    ctx.fillRect(x-4,y-size*0.2,8,size*0.35);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x,y-size);
    ctx.lineTo(x-size*0.45,y);
    ctx.lineTo(x+size*0.45,y);
    ctx.closePath();
    ctx.fill();
}

/* =====================================
   DRAW OBJECTS
===================================== */
function drawPlayer(cfg){
    ctx.save();
    ctx.fillStyle = cfg.playerColor;

    if(cfg.theme === "underwater"){
        drawFish(player.x + player.w/2, player.y + player.h/2, player.w*1.15, cfg.playerColor, true);
    }else if(cfg.theme === "sky"){
        drawStar(player.x + player.w/2, player.y + player.h/2, player.w*0.65, cfg.playerColor);
    }else if(cfg.theme === "forest"){
        drawLeaf(player.x + player.w/2, player.y + player.h/2, player.w*0.75, cfg.playerColor);
    }else{
        ctx.fillRect(player.x,player.y,player.w,player.h);
    }

    ctx.restore();
}

function drawObstacle(o){
    ctx.save();

    if(o.type === "underwater"){
        drawFish(o.x + o.w/2, o.y + o.h/2, Math.max(o.w,o.h)*0.62, o.color, false);
    }else if(o.type === "sky"){
        drawCloud(o.x, o.y + o.h/2, Math.max(o.w,o.h)*0.72, "rgba(255,255,255,0.72)");
        ctx.strokeStyle = "rgba(0,0,0,0.35)";
        ctx.strokeRect(o.x,o.y,o.w,o.h);
    }else if(o.type === "forest"){
        drawTree(o.x + o.w/2, o.y + o.h, Math.max(o.w,o.h)*0.75, "rgba(60,190,90,0.8)");
        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.strokeRect(o.x,o.y,o.w,o.h);
    }else{
        ctx.fillStyle = o.color || "red";
        ctx.fillRect(o.x,o.y,o.w,o.h);
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x,o.y,o.w,o.h);
    }

    ctx.restore();
}

function drawOrb(o,cfg){
    ctx.save();
    ctx.fillStyle = cfg.orbColor;

    if(o.type === "underwater"){
        ctx.strokeStyle = cfg.orbColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(o.x-3,o.y-3,o.r*0.25,0,Math.PI*2);
        ctx.fill();
    }else if(o.type === "sky"){
        drawStar(o.x,o.y,o.r,cfg.orbColor);
    }else if(o.type === "forest"){
        drawLeaf(o.x,o.y,o.r*1.2,cfg.orbColor);
    }else{
        ctx.beginPath();
        ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

function drawFish(x,y,size,color,faceRight){
    ctx.save();
    if(faceRight) ctx.scale(1,1);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x,y,size*0.55,size*0.28,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    if(faceRight){
        ctx.moveTo(x-size*0.55,y);
        ctx.lineTo(x-size*0.88,y-size*0.25);
        ctx.lineTo(x-size*0.88,y+size*0.25);
    }else{
        ctx.moveTo(x+size*0.55,y);
        ctx.lineTo(x+size*0.88,y-size*0.25);
        ctx.lineTo(x+size*0.88,y+size*0.25);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.beginPath();
    ctx.arc(faceRight ? x+size*0.25 : x-size*0.25,y-size*0.06,size*0.045,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
}

function drawStar(x,y,r,color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    for(let i=0;i<10;i++){
        const a = -Math.PI/2 + i * Math.PI/5;
        const rr = i % 2 === 0 ? r : r*0.45;
        const px = x + Math.cos(a) * rr;
        const py = y + Math.sin(a) * rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawLeaf(x,y,size,color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x,y,size*0.55,size*0.28,-0.6,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x-size*0.3,y+size*0.16);
    ctx.lineTo(x+size*0.34,y-size*0.16);
    ctx.stroke();
    ctx.restore();
}

function draw(){
    const cfg = getConfig();
    drawBackground(cfg);
    drawPlayer(cfg);
    obstacles.forEach(drawObstacle);
    orbs.forEach(o => drawOrb(o,cfg));

    particles.forEach(p => {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color || "white";
        ctx.fillRect(p.x,p.y,4,4);
    });
    ctx.globalAlpha = 1;
}

function loop(){
    if(!running) return;
    update();
    draw();
    animationFrameId = requestAnimationFrame(loop);
}

function startTimer(){
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if(!running){
            clearInterval(timerInterval);
            timerInterval = null;
            return;
        }

        time--;
        document.getElementById("timer").innerText = time;
        score += Math.round(1 * getConfig().scoreMultiplier);

        if(time <= 0){
            clearInterval(timerInterval);
            timerInterval = null;
            endGame("finish");
        }
    },1000);
}

/* =====================================
   SUPABASE DATA
===================================== */
async function trackPlay(){
    if(!supabaseClient) return;

    const playerName = getCleanName() || localStorage.getItem("playerName") || "PLAYER";
    const payload = {
        event:"play",
        player:playerName,
        player_id:getPlayerId(),
        device:isMobile ? "mobile" : "desktop",
        country:getBrowserCountry(),
        level:selectedLevel
    };

    const { error } = await supabaseClient.from("analytics").insert([payload]);
    if(error) console.error("Analytics insert failed:", error.message, error);
}

async function submitScore(){
    if(!supabaseClient) return;

    const name = getCleanName() || localStorage.getItem("playerName") || "PLAYER";
    const payload = { name, score:Number(score), level:selectedLevel };

    const { error } = await supabaseClient.from("scores").insert([payload]);
    if(error) console.error("Supabase insert failed:", error.message, error);
}

async function loadLeaderboard(targetId = "startLeaderboard", level = leaderboardLevel){
    const board = document.getElementById(targetId);
    if(!board) return;

    board.innerHTML = "<h3>TOP 10</h3>" + renderLeaderboardTabs(level);

    if(!supabaseClient){
        board.innerHTML += "<p>Leaderboard offline.</p>";
        return;
    }

    let query = supabaseClient
        .from("scores")
        .select("name, score, created_at, level")
        .order("score", { ascending:false })
        .order("created_at", { ascending:true })
        .limit(10);

    query = query.eq("level", level);

    const { data, error } = await query;

    if(error){
        console.error("Supabase select failed:", error.message, error);
        board.innerHTML += "<p>Leaderboard konnte nicht geladen werden.</p>";
        bindLeaderboardTabs();
        return;
    }

    if(!data || data.length === 0){
        board.innerHTML += "<p>No scores yet.</p>";
        bindLeaderboardTabs();
        return;
    }

    data.forEach((s,i) => {
        board.innerHTML += `
            <div class="scoreRow">
                <span>${i+1}. ${escapeHtml(s.name)}</span>
                <span>${Number(s.score)}</span>
            </div>
        `;
    });

    bindLeaderboardTabs();
}

function renderLeaderboardTabs(activeLevel){
    let html = '<div class="leaderboard-tabs">';
    for(let i=1;i<=4;i++){
        html += `<button class="lb-tab ${i===activeLevel?'active':''}" type="button" data-lb-level="${i}">L${i}</button>`;
    }
    html += '</div>';
    return html;
}

function bindLeaderboardTabs(){
    document.querySelectorAll(".lb-tab").forEach(btn => {
        btn.onclick = () => {
            leaderboardLevel = Number(btn.dataset.lbLevel || 1);
            loadLeaderboard("startLeaderboard", leaderboardLevel).catch(console.warn);
        };
    });
}

/* =====================================
   START SCREEN
===================================== */
function updateStartScreenMode(){
    const input = document.getElementById("name");
    const btn = document.getElementById("startBtn");
    const levelSelect = document.getElementById("levelSelect");

    if(waitingForNewName){
        input.style.display = "block";
        levelSelect.style.display = "grid";
        btn.textContent = "START";
    }else{
        input.style.display = "none";
        levelSelect.style.display = "grid";
        btn.textContent = "RETRY";
    }
}

function showStartScreen(resultType, finalScore){
    const headline = document.getElementById("resultHeadline");
    const resultScore = document.getElementById("resultScore");
    const title = document.getElementById("startTitle");

    title.textContent = "NEW RELEASE";

    if(resultType === "finish") headline.textContent = "FINISH";
    else if(resultType === "gameover") headline.textContent = "GAME OVER";
    else headline.textContent = "";

    if(typeof finalScore === "number") resultScore.textContent = "SCORE: " + finalScore + " / LEVEL " + selectedLevel;
    else resultScore.textContent = "";

    updateStartScreenMode();
    document.getElementById("start").style.display = "flex";
}

async function endGame(resultType = "gameover"){
    if(ending) return;
    ending = true;
    running = false;

    if(animationFrameId){ cancelAnimationFrame(animationFrameId); animationFrameId = null; }
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }

    song.pause();
    const finalScore = score;

    await submitScore();

    retryCount++;

    if(retryCount >= 4){
        waitingForNewName = true;
        retryCount = 0;
        document.getElementById("name").value = "";
        localStorage.removeItem("playerName");
    }else{
        waitingForNewName = false;
    }

    showStartScreen(resultType, finalScore);
    leaderboardLevel = selectedLevel;
    await loadLeaderboard("startLeaderboard", leaderboardLevel);

    ending = false;
}

function resetGameState(){
    ending = false;
    running = false;

    if(animationFrameId){ cancelAnimationFrame(animationFrameId); animationFrameId = null; }
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }

    const cfg = getConfig();
    score = 0;
    time = cfg.duration;
    gameStartTime = 0;
    lastSpawnTime = 0;
    nextSpawnDelay = 1300;
    bgOffset = 0;

    obstacles = [];
    particles = [];
    orbs = [];

    player.x = isMobile ? window.innerWidth * 0.22 : window.innerWidth * 0.25;
    player.y = window.innerHeight * 0.5;
    player.vy = 0;

    document.getElementById("score").innerText = score;
    document.getElementById("timer").innerText = time;
    document.getElementById("levelLabel").innerText = selectedLevel;
}

const startBtn = document.getElementById("startBtn");

startBtn.addEventListener("click", function(){
    startGame().catch(function(err){
        console.error("Start failed:", err);
        setStartStatus("Start fehlgeschlagen. Bitte Browser-Konsole prüfen.");
        startBtn.disabled = false;
    });
});

async function startGame(){
    startBtn.disabled = true;
    setStartStatus("");

    const input = document.getElementById("name");
    const playerName = getCleanName();

    if(input.style.display !== "none" && playerName.length < 1){
        setStartStatus("bitte gib zuerst deinen namen ein");
        input.focus();
        startBtn.disabled = false;
        return;
    }

    if(input.style.display !== "none"){
        retryCount = 0;
        waitingForNewName = false;
    }

    localStorage.setItem("playerName", playerName || localStorage.getItem("playerName") || "PLAYER");

    await trackPlay();

    resetGameState();

    document.getElementById("start").style.display = "none";

    try{
        const cfg = getConfig();
        song.pause();
        song.src = cfg.audio;
        song.currentTime = 0;
        await song.play();
    }catch(err){
        console.warn("Audio blocked, game starts without audio:", err);
    }

    running = true;
    gameStartTime = performance.now();
    lastSpawnTime = performance.now();
    nextSpawnDelay = getSpawnDelay();

    loop();
    startTimer();

    startBtn.disabled = false;
}

/* =====================================
   INIT
===================================== */
waitingForNewName = true;
retryCount = 0;
document.getElementById("name").value = "";
showStartScreen(null);
loadLeaderboard("startLeaderboard", leaderboardLevel).catch(console.warn);
</script>
