(function(){

    if(!el) return;

    let countdownTimer = null;

    function updateCountdown(){
        const diff = targetDate - Date.now();
        if(diff <= 0){
            el.textContent = "OUT NOW";
            if(countdownTimer) clearInterval(countdownTimer);
            return;
        }

        const seconds = Math.floor(diff / 1000);
        const days = Math.floor(seconds / 86400);
        const hours = String(Math.floor((seconds % 86400) / 3600)).padStart(2,"0");
        const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2,"0");
        const secs = String(seconds % 60).padStart(2,"0");
        el.textContent = days > 0 ? days + "d " + hours + ":" + mins + ":" + secs : hours + ":" + mins + ":" + secs;
    }

    countdownTimer = setInterval(updateCountdown,1000);
    updateCountdown();
}());

    c.style.height = window.innerHeight + "px";

        document.querySelectorAll(".level-btn").forEach(b => b.classList.remove("active"));

/* =====================================
   DIFFICULTY
===================================== */
function getConfig(){
    return levelConfigs[selectedLevel] || levelConfigs[1];
}

function getElapsedSeconds(){
    if(!gameStartTime) return 0;
    return Math.max(0,(performance.now() - gameStartTime) / 1000);
}

function lerp(a,b,p){
    return a + (b - a) * p;
}

function getPhaseIndex(){
    const elapsed = getElapsedSeconds();
    if(elapsed < 25) return 0;
    if(elapsed < 40) return 1;
    return 2;
}

function getCurrentSpeed(){
    const cfg = getConfig();
    const elapsed = getElapsedSeconds();
    const key = isMobile ? "mobile" : "desktop";
    const ranges = cfg.speed[key];

    for(const r of ranges){
        const startT = r[0];
        const endT = r[1];
        const start = r[2];
        const end = r[3];
        if(elapsed < endT){
            const p = Math.max(0, Math.min(1, (elapsed - startT) / (endT - startT)));
            return lerp(start,end,p);
        }
    }

    return ranges[ranges.length - 1][3];
}

function getSpawnDelay(){
    const cfg = getConfig();
    const key = isMobile ? "mobile" : "desktop";
    return cfg.spawnDelay[key][getPhaseIndex()];
}

function getRandomFrom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

/* =====================================
   CONTROLS
===================================== */
function moveUp(){
    if(!running) return;
    player.vy = isMobile ? -7 : -9;
}

function moveDown(){
    if(!running) return;
    player.vy = isMobile ? 7 : 9;
}

window.addEventListener("keydown", e => {
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space"){
        e.preventDefault();
        moveUp();
    }
    if(e.code === "ArrowDown" || e.code === "KeyS"){
        e.preventDefault();
        moveDown();
    }
});

window.addEventListener("touchmove", e => {
    if(!running) return;
    e.preventDefault();
    const touch = e.touches[0];
    const y = touch.clientY;
    player.y += (y - player.y - player.h/2) * 0.25;
},{passive:false});

function escapeHtml(value){
    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getCleanName(){
    return (document.getElementById("name").value || "").trim().slice(0,12);
}

function getPlayerId(){
    let id = localStorage.getItem("playerId");
    if(!id){
        id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : "player_" + Date.now() + "_" + Math.random().toString(16).slice(2);
        localStorage.setItem("playerId", id);
    }
    return id;
}

function getBrowserCountry(){
    const lang = navigator.language || navigator.userLanguage || "";
    const parts = lang.split("-");
    if(parts.length >= 2) return parts[1].toUpperCase();
    return null;
}

function circleRectOverlap(cx, cy, r, rx, ry, rw, rh, padding = 0){
    const nearestX = Math.max(rx - padding, Math.min(cx, rx + rw + padding));
    const nearestY = Math.max(ry - padding, Math.min(cy, ry + rh + padding));
    const dx = cx - nearestX;
    const dy = cy - nearestY;
    return dx * dx + dy * dy < (r + padding) * (r + padding);
}

function orbInsideObstacle(x,y,r = 12){
    const padding = 18;
    for(let o of obstacles){
        if(circleRectOverlap(x,y,r,o.x,o.y,o.w,o.h,padding)) return true;
    }
    return false;
}

function obstacleOverlapsOrb(x,y,w,h){
    const padding = 22;
    for(let orb of orbs){
        if(circleRectOverlap(orb.x,orb.y,orb.r || 12,x,y,w,h,padding)) return true;
    }
    return false;
}

function spawnParticles(x,y,color){
    for(let i=0;i<30;i++){
        particles.push({
            x,y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6,
            life:40,
            color:color || "white"
        });
    }
}

/* =====================================
   SPAWN
===================================== */
function spawnObstacle(){
    const cfg = getConfig();
    const key = isMobile ? "mobile" : "desktop";
    const phase = getPhaseIndex();
    const heights = cfg.heights[key][phase];
    const widths = cfg.widths[key][phase];

    let h;
    let w;
    let y;
    let x = window.innerWidth + 100;
    let vx = null;
    let vy = 0;
    let kind = cfg.theme;
    let safeObstacle = false;
    let attempts = 0;

    /* Level 2: Haie plus Wasserpflanzen von unten/oben */
    if(cfg.theme === "underwater"){
        const r = Math.random();

        if(r < 0.18){
            kind = "plantBottom";
            w = getRandomFrom(isMobile ? [55,70,85] : [70,90,110]);
            h = getRandomFrom(isMobile ? [150,190,230] : [190,250,310]);
            y = window.innerHeight - h;
            safeObstacle = true;
        }else if(r < 0.32){
            kind = "plantTop";
            w = getRandomFrom(isMobile ? [55,70,85] : [70,90,110]);
            h = getRandomFrom(isMobile ? [130,170,215] : [170,230,290]);
            y = 0;
            safeObstacle = true;
        }
    }

    /* Level 4: Tannen, Maulwurfhügel, Adler, Busch und Fuchs */
    if(cfg.theme === "forest"){
        const r = Math.random();

        if(r < 0.18){
            kind = "molehill";
            w = getRandomFrom(isMobile ? [75,95,115] : [95,125,155]);
            h = Math.round(w * 0.42);
            y = window.innerHeight - h - 26;
            safeObstacle = true;
        }else if(r < 0.34){
            kind = "eagle";
            w = getRandomFrom(isMobile ? [120,150,180] : [165,210,255]);
            h = Math.round(w * 0.42);
            x = -w - 80;
            y = getRandomFrom([55,90,130,170]);
            vx = getCurrentSpeed() * (1.05 + phase * 0.16);
            safeObstacle = true;
        }else if(r < 0.48){
            kind = "bush";
            w = getRandomFrom(isMobile ? [85,110,140] : [120,155,195]);
            h = Math.round(w * 0.55);
            y = window.innerHeight - h - 32;
            safeObstacle = true;
        }else if(r < 0.62){
            kind = "fox";
            w = getRandomFrom(isMobile ? [125,155,190] : [165,215,260]);
            h = Math.round(w * 0.48);
            y = window.innerHeight - h - 34;
            safeObstacle = true;
        }else{
            kind = "pine";
        }
    }

    /* Level 3: Gewitterwolken, Ballons und Jets */
    if(cfg.theme === "sky"){
        const r = Math.random();

        if(r < 0.18){
            kind = "balloon";
            w = getRandomFrom(isMobile ? [58,72,86] : [74,92,112]);
            h = Math.round(w * 1.45);
            x = window.innerWidth + getRandomFrom([40,120,220]);
            y = window.innerHeight + h + 20;
            vy = isMobile ? -1.4 - phase * 0.35 : -1.7 - phase * 0.45;
            safeObstacle = true;
        }else if(r < 0.34){
            kind = "jet";
            w = getRandomFrom(isMobile ? [130,160,190] : [170,220,260]);
            h = Math.round(w * 0.34);
            x = -w - 80;
            y = getRandomFrom([70,105,145,185]);
            vx = getCurrentSpeed() * (1.15 + phase * 0.18);
            safeObstacle = true;
        }else{
            kind = "thundercloud";
        }
    }

    while(!safeObstacle && attempts < 20){
        attempts++;
        const lane = Math.floor(Math.random() * 3);
        h = getRandomFrom(heights);
        w = getRandomFrom(widths);

        if(lane === 0) y = 80;
        if(lane === 1) y = window.innerHeight / 2 - h / 2;
        if(lane === 2) y = window.innerHeight - 180 - h;

        safeObstacle = !obstacleOverlapsOrb(x, y, w, h);
    }

    const color = obstacleColors[Math.floor(Math.random() * obstacleColors.length)];

    obstacles.push({
        x,y,w,h,
        vx,vy,
        color,
        type:cfg.theme,
        kind,
        passed:false,
        seed:Math.random() * 9999
    });

    const threshold = cfg.orbThreshold[phase];

    if(Math.random() > threshold){
        let orbX = window.innerWidth + 100 + w + 120;
        let orbY;
        let safe = false;
        let orbAttempts = 0;

        while(!safe && orbAttempts < 35){
            orbAttempts++;
            orbY = Math.random() * (window.innerHeight - 260) + 100;
            safe = !orbInsideObstacle(orbX, orbY, 12);
        }

        if(safe){
            orbs.push({x:orbX,y:orbY,r:12,taken:false,type:cfg.theme});
        }
    }
}

function updateSpawning(){
    const now = performance.now();
    if(now - lastSpawnTime >= nextSpawnDelay){
        spawnObstacle();
        lastSpawnTime = now;
        nextSpawnDelay = getSpawnDelay() * (0.82 + Math.random() * 0.36);
    }
}

/* =====================================
   VISIBLE-SHAPE COLLISION
   - Level 1 bleibt rechteckig
   - Level 2 nutzt die sichtbare Hai-/Fischform statt der unsichtbaren Bounding Box
   - Level 3/4 bekommen ebenfalls weichere Trefferflächen
===================================== */
function pointInTriangle(px, py, ax, ay, bx, by, cx, cy){
    const v0x = cx - ax;
    const v0y = cy - ay;
    const v1x = bx - ax;
    const v1y = by - ay;
    const v2x = px - ax;
    const v2y = py - ay;

    const dot00 = v0x * v0x + v0y * v0y;
    const dot01 = v0x * v1x + v0y * v1y;
    const dot02 = v0x * v2x + v0y * v2y;
    const dot11 = v1x * v1x + v1y * v1y;
    const dot12 = v1x * v2x + v1y * v2y;

    const invDenom = 1 / (dot00 * dot11 - dot01 * dot01 || 1);
    const u = (dot11 * dot02 - dot01 * dot12) * invDenom;
    const v = (dot00 * dot12 - dot01 * dot02) * invDenom;

    return u >= 0 && v >= 0 && u + v <= 1;
}

function pointInEllipse(px, py, cx, cy, rx, ry){
    const dx = (px - cx) / rx;
    const dy = (py - cy) / ry;
    return dx * dx + dy * dy <= 1;
}

function samplePlayerPoints(rect){
    const points = [];
    const cols = 5;
    const rows = 5;

    for(let ix = 0; ix < cols; ix++){
        for(let iy = 0; iy < rows; iy++){
            points.push({
                x:rect.x + (rect.w * ix) / (cols - 1),
                y:rect.y + (rect.h * iy) / (rows - 1)
            });
        }
    }

    return points;
}

function pointHitsShark(px, py, o){
    const mouthOpen = getSharkMouthOpen();

    const bodyCx = o.x + o.w * 0.48;
    const bodyCy = o.y + o.h * 0.52;
    const bodyRx = o.w * 0.34;
    const bodyRy = o.h * 0.25;

    const headCx = o.x + o.w * 0.23;
    const headCy = o.y + o.h * 0.52;
    const headRx = o.w * 0.20;
    const headRy = o.h * 0.22;

    const tailHit = pointInTriangle(
        px, py,
        o.x + o.w * 0.79, o.y + o.h * 0.52,
        o.x + o.w * 0.99, o.y + o.h * 0.28,
        o.x + o.w * 0.99, o.y + o.h * 0.76
    );

    const topFinHit = pointInTriangle(
        px, py,
        o.x + o.w * 0.42, o.y + o.h * 0.34,
        o.x + o.w * 0.56, o.y + o.h * 0.05,
        o.x + o.w * 0.62, o.y + o.h * 0.38
    );

    const bottomFinHit = pointInTriangle(
        px, py,
        o.x + o.w * 0.48, o.y + o.h * 0.66,
        o.x + o.w * 0.61, o.y + o.h * 0.90,
        o.x + o.w * 0.66, o.y + o.h * 0.64
    );

    const bodyHit =
        pointInEllipse(px, py, bodyCx, bodyCy, bodyRx, bodyRy) ||
        pointInEllipse(px, py, headCx, headCy, headRx, headRy) ||
        tailHit ||
        topFinHit ||
        bottomFinHit;

    if(!bodyHit){
        return false;
    }

    /* Der schwarze Maul-Innenraum ist eine visuelle Aussparung.
       Wenn der Player nur in diese Öffnung ragt, zählt es nicht als Treffer. */
    const mouthTipX = o.x + o.w * 0.05;
    const mouthTopX = o.x + o.w * 0.31;
    const mouthTopY = o.y + o.h * (0.48 - mouthOpen * 0.10);
    const mouthBottomX = o.x + o.w * 0.31;
    const mouthBottomY = o.y + o.h * (0.57 + mouthOpen * 0.10);

    const inMouthHole = pointInTriangle(
        px, py,
        mouthTipX, o.y + o.h * 0.52,
        mouthTopX, mouthTopY,
        mouthBottomX, mouthBottomY
    );

    return !inMouthHole;
}

function pointHitsCloud(px, py, o){
    return (
        pointInEllipse(px, py, o.x + o.w * 0.24, o.y + o.h * 0.56, o.w * 0.20, o.h * 0.24) ||
        pointInEllipse(px, py, o.x + o.w * 0.45, o.y + o.h * 0.42, o.w * 0.27, o.h * 0.30) ||
        pointInEllipse(px, py, o.x + o.w * 0.68, o.y + o.h * 0.56, o.w * 0.22, o.h * 0.24) ||
        (px >= o.x + o.w * 0.18 && px <= o.x + o.w * 0.78 && py >= o.y + o.h * 0.55 && py <= o.y + o.h * 0.72)
    );
}

function pointHitsThunderCloud(px, py, o){
    const cloudHit = pointHitsCloud(px, py, o);

    if(cloudHit){
        return true;
    }

    const flashOn = Math.floor((performance.now() + o.seed) / 520) % 2 === 0;

    if(flashOn){
        return pointInTriangle(
            px, py,
            o.x + o.w * 0.50, o.y + o.h * 0.66,
            o.x + o.w * 0.38, o.y + o.h * 1.02,
            o.x + o.w * 0.58, o.y + o.h * 0.86
        ) || pointInTriangle(
            px, py,
            o.x + o.w * 0.58, o.y + o.h * 0.82,
            o.x + o.w * 0.46, o.y + o.h * 1.20,
            o.x + o.w * 0.70, o.y + o.h * 0.94
        );
    }

    return false;
}

function pointHitsBalloon(px, py, o){
    return (
        pointInEllipse(px, py, o.x + o.w * 0.50, o.y + o.h * 0.32, o.w * 0.34, o.h * 0.22) ||
        pointInTriangle(px, py, o.x + o.w * 0.38, o.y + o.h * 0.47, o.x + o.w * 0.62, o.y + o.h * 0.47, o.x + o.w * 0.50, o.y + o.h * 0.62) ||
        (px >= o.x + o.w * 0.34 && px <= o.x + o.w * 0.66 && py >= o.y + o.h * 0.72 && py <= o.y + o.h * 0.92)
    );
}

function pointHitsJet(px, py, o){
    return (
        pointInTriangle(px, py, o.x + o.w * 0.05, o.y + o.h * 0.50, o.x + o.w * 0.30, o.y + o.h * 0.26, o.x + o.w * 0.30, o.y + o.h * 0.74) ||
        (px >= o.x + o.w * 0.25 && px <= o.x + o.w * 0.88 && py >= o.y + o.h * 0.38 && py <= o.y + o.h * 0.62) ||
        pointInTriangle(px, py, o.x + o.w * 0.48, o.y + o.h * 0.40, o.x + o.w * 0.64, o.y + o.h * 0.05, o.x + o.w * 0.72, o.y + o.h * 0.42) ||
        pointInTriangle(px, py, o.x + o.w * 0.48, o.y + o.h * 0.60, o.x + o.w * 0.64, o.y + o.h * 0.95, o.x + o.w * 0.72, o.y + o.h * 0.58) ||
        pointInTriangle(px, py, o.x + o.w * 0.84, o.y + o.h * 0.38, o.x + o.w * 0.98, o.y + o.h * 0.18, o.x + o.w * 0.92, o.y + o.h * 0.48)
    );
}

function pointHitsWaterPlant(px, py, o){
    const stems = [0.28, 0.45, 0.62, 0.76];

    for(let i = 0; i < stems.length; i++){
        const sx = o.x + o.w * stems[i];
        const sway = Math.sin(performance.now() * 0.002 + o.seed + i) * o.w * 0.10;
        const topY = o.kind === "plantTop" ? o.y + o.h : o.y;
        const bottomY = o.kind === "plantTop" ? o.y : o.y + o.h;

        const minY = Math.min(topY, bottomY);
        const maxY = Math.max(topY, bottomY);
        const localY = (py - minY) / Math.max(1, maxY - minY);
        const curveX = sx + sway * Math.sin(localY * Math.PI);

        if(Math.abs(px - curveX) < o.w * 0.08 && py >= minY && py <= maxY){
            return true;
        }

        if(pointInEllipse(px, py, curveX - o.w * 0.10, py, o.w * 0.11, o.w * 0.045)){
            return true;
        }
    }

    return false;
}

function pointHitsTree(px, py, o){
    return (
        pointInTriangle(px, py, o.x + o.w * 0.50, o.y + o.h * 0.04, o.x + o.w * 0.10, o.y + o.h * 0.72, o.x + o.w * 0.90, o.y + o.h * 0.72) ||
        pointInTriangle(px, py, o.x + o.w * 0.50, o.y + o.h * 0.18, o.x + o.w * 0.16, o.y + o.h * 0.86, o.x + o.w * 0.84, o.y + o.h * 0.86) ||
        (px >= o.x + o.w * 0.43 && px <= o.x + o.w * 0.57 && py >= o.y + o.h * 0.68 && py <= o.y + o.h * 0.98)
    );
}

function pointHitsMolehill(px, py, o){
    return pointInEllipse(px, py, o.x + o.w * 0.50, o.y + o.h * 0.76, o.w * 0.47, o.h * 0.40);
}

function pointHitsBush(px, py, o){
    return (
        pointInEllipse(px, py, o.x + o.w * 0.24, o.y + o.h * 0.66, o.w * 0.22, o.h * 0.28) ||
        pointInEllipse(px, py, o.x + o.w * 0.46, o.y + o.h * 0.50, o.w * 0.28, o.h * 0.34) ||
        pointInEllipse(px, py, o.x + o.w * 0.70, o.y + o.h * 0.66, o.w * 0.24, o.h * 0.28) ||
        (px >= o.x + o.w * 0.12 && px <= o.x + o.w * 0.86 && py >= o.y + o.h * 0.62 && py <= o.y + o.h * 0.88)
    );
}

function pointHitsEagle(px, py, o){
    const flap = Math.sin(performance.now() * 0.010 + o.seed);
    const wingLift = flap * o.h * 0.16;

    return (
        pointInEllipse(px, py, o.x + o.w * 0.50, o.y + o.h * 0.50, o.w * 0.16, o.h * 0.16) ||
        pointInTriangle(px, py, o.x + o.w * 0.40, o.y + o.h * 0.50, o.x + o.w * 0.06, o.y + o.h * (0.24 - wingLift / o.h), o.x + o.w * 0.38, o.y + o.h * 0.66) ||
        pointInTriangle(px, py, o.x + o.w * 0.60, o.y + o.h * 0.50, o.x + o.w * 0.94, o.y + o.h * (0.24 - wingLift / o.h), o.x + o.w * 0.62, o.y + o.h * 0.66) ||
        pointInTriangle(px, py, o.x + o.w * 0.62, o.y + o.h * 0.46, o.x + o.w * 0.82, o.y + o.h * 0.42, o.x + o.w * 0.66, o.y + o.h * 0.58)
    );
}

function pointHitsFox(px, py, o){
    const bodyHit =
        pointInEllipse(px, py, o.x + o.w * 0.42, o.y + o.h * 0.62, o.w * 0.30, o.h * 0.24) ||
        pointInEllipse(px, py, o.x + o.w * 0.67, o.y + o.h * 0.50, o.w * 0.20, o.h * 0.18) ||
        pointInTriangle(px, py, o.x + o.w * 0.16, o.y + o.h * 0.58, o.x + o.w * 0.02, o.y + o.h * 0.28, o.x + o.w * 0.28, o.y + o.h * 0.48) ||
        pointInTriangle(px, py, o.x + o.w * 0.58, o.y + o.h * 0.36, o.x + o.w * 0.62, o.y + o.h * 0.08, o.x + o.w * 0.72, o.y + o.h * 0.36) ||
        pointInTriangle(px, py, o.x + o.w * 0.74, o.y + o.h * 0.36, o.x + o.w * 0.82, o.y + o.h * 0.10, o.x + o.w * 0.84, o.y + o.h * 0.42) ||
        (px >= o.x + o.w * 0.28 && px <= o.x + o.w * 0.76 && py >= o.y + o.h * 0.72 && py <= o.y + o.h * 0.98);

    if(!bodyHit){
        return false;
    }

    const mouthOpen = getFoxMouthOpen(o);
    const inMouthHole = pointInTriangle(
        px, py,
        o.x + o.w * 0.83, o.y + o.h * 0.52,
        o.x + o.w * 0.68, o.y + o.h * (0.48 - mouthOpen * 0.06),
        o.x + o.w * 0.68, o.y + o.h * (0.56 + mouthOpen * 0.06)
    );

    return !inMouthHole;
}

function hitObstacle(rect, o){
    /* Schneller Vorabcheck: wenn die groben Boxen sich nicht schneiden, ist sicher kein Treffer. */
    if(
        rect.x >= o.x + o.w ||
        rect.x + rect.w <= o.x ||
        rect.y >= o.y + o.h ||
        rect.y + rect.h <= o.y
    ){
        return false;
    }

    if(o.type === "normal"){
        return true;
    }

    const points = samplePlayerPoints(rect);

    for(const p of points){
        if(o.type === "underwater"){
            if((o.kind === "plantBottom" || o.kind === "plantTop") && pointHitsWaterPlant(p.x, p.y, o)){
                return true;
            }

            if(o.kind !== "plantBottom" && o.kind !== "plantTop" && pointHitsShark(p.x, p.y, o)){
                return true;
            }
        }

        if(o.type === "sky"){
            if(o.kind === "thundercloud" && pointHitsThunderCloud(p.x, p.y, o)){
                return true;
            }

            if(o.kind === "balloon" && pointHitsBalloon(p.x, p.y, o)){
                return true;
            }

            if(o.kind === "jet" && pointHitsJet(p.x, p.y, o)){
                return true;
            }

            if((!o.kind || o.kind === "sky") && pointHitsCloud(p.x, p.y, o)){
                return true;
            }
        }

        if(o.type === "forest"){
            if((!o.kind || o.kind === "pine") && pointHitsTree(p.x, p.y, o)){
                return true;
            }

            if(o.kind === "molehill" && pointHitsMolehill(p.x, p.y, o)){
                return true;
            }

            if(o.kind === "eagle" && pointHitsEagle(p.x, p.y, o)){
                return true;
            }

            if(o.kind === "bush" && pointHitsBush(p.x, p.y, o)){
                return true;
            }

            if(o.kind === "fox" && pointHitsFox(p.x, p.y, o)){
                return true;
            }
        }
    }

    return false;
}

/* =====================================
   UPDATE
===================================== */
function update(){
    const cfg = getConfig();
    const speed = getCurrentSpeed();
    bgOffset += speed * 0.2;

    updateSpawning();

    player.y += player.vy;
    player.vy *= 0.90;

    if(player.y < 40) player.y = 40;
    if(player.y > window.innerHeight - 140) player.y = window.innerHeight - 140;

    obstacles.forEach(o => {
        if(typeof o.vx === "number"){
            o.x += o.vx;
        }else{
            o.x -= speed;
        }

        if(typeof o.vy === "number"){
            o.y += o.vy;
        }

        if(hitObstacle(player, o)){
            endGame("gameover");
        }

        if(!o.passed){
            const passedFromRight = (typeof o.vx !== "number" || o.vx <= 0) && o.x < player.x;
            const passedFromLeft = typeof o.vx === "number" && o.vx > 0 && o.x > player.x + player.w;

            if(passedFromRight || passedFromLeft){
                o.passed = true;
                score += Math.round(10 * cfg.scoreMultiplier);
                if(score % 100 === 0) spawnParticles(player.x, player.y, cfg.playerColor);
            }
        }
    });

    orbs.forEach(o => {
        o.x -= speed;
        const dx = (player.x + player.w/2) - o.x;
        const dy = (player.y + player.h/2) - o.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 30 && !o.taken){
            o.taken = true;
            score += Math.round(25 * cfg.scoreMultiplier);
            spawnParticles(o.x,o.y,cfg.orbColor);
        }
    });

    obstacles = obstacles.filter(o => {
        if(typeof o.vx === "number" && o.vx > 0){
            return o.x < window.innerWidth + 450 && o.y > -450 && o.y < window.innerHeight + 450;
        }

        return o.x > -450 && o.y > -450 && o.y < window.innerHeight + 450;
    });
    orbs = orbs.filter(o => o.x > -100 && !o.taken);

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(p => p.life > 0);

    document.getElementById("score").innerText = score;
}

/* =====================================
   DRAW BACKGROUND
===================================== */
function drawBackground(cfg){
    ctx.fillStyle = cfg.bg;
    ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

    if(cfg.theme === "normal"){
        for(let i=0;i<20;i++){
            ctx.fillStyle = "rgba(255,255,255,0.03)";
            ctx.fillRect((i*180 - performance.now()*0.05) % window.innerWidth, i*60, 120, 1);
        }
    }

    if(cfg.theme === "underwater"){
        const grad = ctx.createLinearGradient(0,0,0,window.innerHeight);
        grad.addColorStop(0,"#063c5f");
        grad.addColorStop(1,"#01121d");
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

        for(let i=0;i<32;i++){
            const x = (i*95 - bgOffset*0.8) % (window.innerWidth + 120);
            const y = 60 + (i*57) % (window.innerHeight - 120);
            ctx.strokeStyle = "rgba(185,245,255,0.16)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x,y,6 + (i%4)*3,0,Math.PI*2);
            ctx.stroke();
        }
    }

    if(cfg.theme === "sky"){
        const grad = ctx.createLinearGradient(0,0,0,window.innerHeight);
        grad.addColorStop(0,"#184f8a");
        grad.addColorStop(1,"#071b3a");
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

        for(let i=0;i<18;i++){
            const x = (i*170 - bgOffset*1.1) % (window.innerWidth + 220) - 110;
            const y = 70 + (i*83) % (window.innerHeight - 180);
            drawCloud(x,y,70 + (i%3)*22,"rgba(255,255,255,0.10)");
        }
    }

    if(cfg.theme === "forest"){
        const grad = ctx.createLinearGradient(0,0,0,window.innerHeight);
        grad.addColorStop(0,"#0d2d17");
        grad.addColorStop(1,"#020a05");
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

        for(let i=0;i<22;i++){
            const x = (i*130 - bgOffset*0.9) % (window.innerWidth + 160) - 80;
            const y = window.innerHeight - 65 - (i%4)*18;
            drawTree(x,y,45 + (i%3)*18,"rgba(80,180,90,0.12)");
        }
    }
}

function drawCloud(x,y,size,color){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x,y,size*0.25,0,Math.PI*2);
    ctx.arc(x+size*0.22,y-size*0.08,size*0.32,0,Math.PI*2);
    ctx.arc(x+size*0.52,y,size*0.25,0,Math.PI*2);
    ctx.rect(x-size*0.02,y,size*0.58,size*0.2);
    ctx.fill();
}

function drawTree(x,y,size,color){
    ctx.fillStyle = "rgba(105,62,24,0.95)";
    ctx.fillRect(x-size*0.09,y-size*0.30,size*0.18,size*0.32);

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x,y-size);
    ctx.lineTo(x-size*0.45,y-size*0.35);
    ctx.lineTo(x+size*0.45,y-size*0.35);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x,y-size*0.78);
    ctx.lineTo(x-size*0.55,y-size*0.12);
    ctx.lineTo(x+size*0.55,y-size*0.12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(72,42,18,0.95)";
    ctx.fillRect(x-size*0.075,y-size*0.18,size*0.15,size*0.20);
}

/* =====================================
   DRAW OBJECTS
===================================== */
function drawPlayer(cfg){
    ctx.save();
    ctx.fillStyle = cfg.playerColor;

    if(cfg.theme === "underwater"){
        drawFish(player.x + player.w/2, player.y + player.h/2, player.w*1.15, cfg.playerColor, true);
    }else if(cfg.theme === "sky"){
        drawPlayerPlane(player.x + player.w/2, player.y + player.h/2, player.w*1.5, cfg.playerColor);
    }else if(cfg.theme === "forest"){
        drawSquirrel(player.x + player.w/2, player.y + player.h/2, player.w*1.35, cfg.playerColor);
    }else{
        ctx.fillRect(player.x,player.y,player.w,player.h);
    }

    ctx.restore();
}

function drawObstacle(o){
    ctx.save();

    if(o.type === "underwater"){
        if(o.kind === "plantBottom" || o.kind === "plantTop"){
            drawWaterPlant(o);
        }else{
            drawShark(o);
        }
    }else if(o.type === "sky"){
        if(o.kind === "balloon"){
            drawHotAirBalloon(o);
        }else if(o.kind === "jet"){
            drawJet(o);
        }else{
            drawThunderCloud(o);
        }
    }else if(o.type === "forest"){
        if(o.kind === "molehill"){
            drawMolehill(o);
        }else if(o.kind === "eagle"){
            drawEagle(o);
        }else if(o.kind === "bush"){
            drawBush(o);
        }else if(o.kind === "fox"){
            drawFox(o);
        }else{
            drawTree(o.x + o.w/2, o.y + o.h, Math.max(o.w,o.h)*0.75, "rgba(60,190,90,0.8)");
        }
    }else{
        ctx.fillStyle = o.color || "red";
        ctx.fillRect(o.x,o.y,o.w,o.h);
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x,o.y,o.w,o.h);
    }

    ctx.restore();
}

function getSharkMouthOpen(){
    return 0.5 + 0.5 * Math.sin(performance.now() * 0.008);
}

function drawShark(o){
    const mouthOpen = getSharkMouthOpen();
    const x = o.x;
    const y = o.y;
    const w = o.w;
    const h = o.h;

    const bodyColor = o.color || "#18c7e8";
    const darkColor = "rgba(0,0,0,0.82)";
    const lightColor = "rgba(255,255,255,0.92)";

    ctx.save();

    /* Schwanzflosse */
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.79, y + h * 0.52);
    ctx.lineTo(x + w * 0.99, y + h * 0.22);
    ctx.lineTo(x + w * 0.99, y + h * 0.82);
    ctx.closePath();
    ctx.fill();

    /* Körper */
    ctx.beginPath();
    ctx.ellipse(x + w * 0.48, y + h * 0.52, w * 0.35, h * 0.27, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Kopf etwas voller */
    ctx.beginPath();
    ctx.ellipse(x + w * 0.23, y + h * 0.52, w * 0.21, h * 0.23, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Rückenflosse */
    ctx.beginPath();
    ctx.moveTo(x + w * 0.42, y + h * 0.35);
    ctx.lineTo(x + w * 0.56, y + h * 0.04);
    ctx.lineTo(x + w * 0.62, y + h * 0.39);
    ctx.closePath();
    ctx.fill();

    /* Bauchflosse */
    ctx.beginPath();
    ctx.moveTo(x + w * 0.48, y + h * 0.65);
    ctx.lineTo(x + w * 0.61, y + h * 0.91);
    ctx.lineTo(x + w * 0.66, y + h * 0.64);
    ctx.closePath();
    ctx.fill();

    /* Auge */
    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.arc(x + w * 0.27, y + h * 0.40, Math.max(2, w * 0.028), 0, Math.PI * 2);
    ctx.fill();

    /* Animiertes Maul: schwarze Öffnung */
    const mouthTopY = y + h * (0.48 - mouthOpen * 0.10);
    const mouthBottomY = y + h * (0.57 + mouthOpen * 0.10);
    const mouthTipX = x + w * 0.04;
    const mouthBackX = x + w * 0.32;

    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.moveTo(mouthTipX, y + h * 0.52);
    ctx.lineTo(mouthBackX, mouthTopY);
    ctx.lineTo(mouthBackX, mouthBottomY);
    ctx.closePath();
    ctx.fill();

    /* Zähne oben */
    ctx.fillStyle = lightColor;
    const toothCount = 5;
    for(let i = 0; i < toothCount; i++){
        const tx = x + w * (0.10 + i * 0.040);
        const ty = y + h * (0.495 - mouthOpen * 0.055);
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx + w * 0.020, ty);
        ctx.lineTo(tx + w * 0.010, y + h * 0.535);
        ctx.closePath();
        ctx.fill();
    }

    /* Zähne unten */
    for(let i = 0; i < toothCount; i++){
        const tx = x + w * (0.11 + i * 0.040);
        const ty = y + h * (0.575 + mouthOpen * 0.055);
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx + w * 0.020, ty);
        ctx.lineTo(tx + w * 0.010, y + h * 0.535);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawOrb(o,cfg){
    ctx.save();
    ctx.fillStyle = cfg.orbColor;

    if(o.type === "underwater"){
        ctx.strokeStyle = cfg.orbColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(o.x-3,o.y-3,o.r*0.25,0,Math.PI*2);
        ctx.fill();
    }else if(o.type === "sky"){
        drawStar(o.x,o.y,o.r,cfg.orbColor);
    }else if(o.type === "forest"){
        drawPeanut(o.x,o.y,o.r*1.35);
    }else{
        ctx.beginPath();
        ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

function drawFish(x,y,size,color,faceRight){
    ctx.save();
    if(faceRight) ctx.scale(1,1);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x,y,size*0.55,size*0.28,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    if(faceRight){
        ctx.moveTo(x-size*0.55,y);
        ctx.lineTo(x-size*0.88,y-size*0.25);
        ctx.lineTo(x-size*0.88,y+size*0.25);
    }else{
        ctx.moveTo(x+size*0.55,y);
        ctx.lineTo(x+size*0.88,y-size*0.25);
        ctx.lineTo(x+size*0.88,y+size*0.25);
    }
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.beginPath();
    ctx.arc(faceRight ? x+size*0.25 : x-size*0.25,y-size*0.06,size*0.045,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
}

function drawWaterPlant(o){
    ctx.save();
    ctx.strokeStyle = "rgba(80,220,160,0.92)";
    ctx.lineCap = "round";

    const stems = [0.28, 0.45, 0.62, 0.76];

    stems.forEach((pos, i) => {
        const sx = o.x + o.w * pos;
        const sway = Math.sin(performance.now() * 0.002 + o.seed + i) * o.w * 0.18;
        const startY = o.kind === "plantTop" ? o.y : o.y + o.h;
        const endY = o.kind === "plantTop" ? o.y + o.h : o.y;

        ctx.lineWidth = Math.max(4, o.w * 0.07);
        ctx.beginPath();
        ctx.moveTo(sx, startY);
        ctx.quadraticCurveTo(sx + sway, (startY + endY) / 2, sx - sway * 0.4, endY);
        ctx.stroke();

        ctx.fillStyle = "rgba(120,255,190,0.82)";
        for(let j = 0; j < 3; j++){
            const yy = startY + (endY - startY) * (0.28 + j * 0.20);
            const side = j % 2 === 0 ? -1 : 1;
            ctx.beginPath();
            ctx.ellipse(sx + side * o.w * 0.12, yy, o.w * 0.14, o.w * 0.045, side * 0.7, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    ctx.restore();
}

function drawPlayerPlane(x,y,size,color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(x + size * 0.55, y);
    ctx.lineTo(x + size * 0.18, y - size * 0.15);
    ctx.lineTo(x - size * 0.45, y - size * 0.08);
    ctx.lineTo(x - size * 0.52, y);
    ctx.lineTo(x - size * 0.45, y + size * 0.08);
    ctx.lineTo(x + size * 0.18, y + size * 0.15);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.moveTo(x - size * 0.02, y - size * 0.04);
    ctx.lineTo(x + size * 0.18, y - size * 0.28);
    ctx.lineTo(x + size * 0.24, y - size * 0.03);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawThunderCloud(o){
    ctx.save();
    const x = o.x;
    const y = o.y;
    const w = o.w;
    const h = o.h;
    const flashOn = Math.floor((performance.now() + o.seed) / 520) % 2 === 0;
    const rainOn = !flashOn;

    const cloudColor = flashOn ? "rgba(86,86,92,0.98)" : "rgba(54,56,66,0.96)";
    drawCloud(x, y + h * 0.52, Math.max(w,h)*0.72, cloudColor);

    if(rainOn){
        ctx.strokeStyle = "rgba(130,205,255,0.72)";
        ctx.lineWidth = 2;
        for(let i=0;i<8;i++){
            const rx = x + w * (0.18 + i * 0.08);
            const ry = y + h * (0.70 + (i%2)*0.08);
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx - w * 0.035, ry + h * 0.26);
            ctx.stroke();
        }
    }else{
        ctx.fillStyle = "rgba(255,235,70,0.98)";
        ctx.beginPath();
        ctx.moveTo(x + w * 0.50, y + h * 0.66);
        ctx.lineTo(x + w * 0.38, y + h * 1.02);
        ctx.lineTo(x + w * 0.58, y + h * 0.86);
        ctx.lineTo(x + w * 0.46, y + h * 1.22);
        ctx.lineTo(x + w * 0.70, y + h * 0.80);
        ctx.lineTo(x + w * 0.55, y + h * 0.90);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawHotAirBalloon(o){
    ctx.save();
    const x = o.x;
    const y = o.y;
    const w = o.w;
    const h = o.h;

    ctx.fillStyle = "rgba(255,110,90,0.94)";
    ctx.beginPath();
    ctx.ellipse(x + w * 0.5, y + h * 0.30, w * 0.34, h * 0.23, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.5, y + h * 0.08);
    ctx.quadraticCurveTo(x + w * 0.38, y + h * 0.30, x + w * 0.46, y + h * 0.52);
    ctx.moveTo(x + w * 0.5, y + h * 0.08);
    ctx.quadraticCurveTo(x + w * 0.62, y + h * 0.30, x + w * 0.54, y + h * 0.52);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,255,255,0.62)";
    ctx.beginPath();
    ctx.moveTo(x + w * 0.40, y + h * 0.52);
    ctx.lineTo(x + w * 0.36, y + h * 0.72);
    ctx.moveTo(x + w * 0.60, y + h * 0.52);
    ctx.lineTo(x + w * 0.64, y + h * 0.72);
    ctx.stroke();

    ctx.fillStyle = "rgba(120,75,35,0.95)";
    ctx.fillRect(x + w * 0.34, y + h * 0.72, w * 0.32, h * 0.20);
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.strokeRect(x + w * 0.34, y + h * 0.72, w * 0.32, h * 0.20);

    ctx.restore();
}

function drawJet(o){
    ctx.save();
    const x = o.x;
    const y = o.y;
    const w = o.w;
    const h = o.h;

    ctx.fillStyle = "rgba(210,220,230,0.96)";
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(x + w * 0.05, y + h * 0.50);
    ctx.lineTo(x + w * 0.30, y + h * 0.26);
    ctx.lineTo(x + w * 0.88, y + h * 0.38);
    ctx.lineTo(x + w * 0.98, y + h * 0.50);
    ctx.lineTo(x + w * 0.88, y + h * 0.62);
    ctx.lineTo(x + w * 0.30, y + h * 0.74);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(150,170,190,0.96)";
    ctx.beginPath();
    ctx.moveTo(x + w * 0.48, y + h * 0.40);
    ctx.lineTo(x + w * 0.64, y + h * 0.05);
    ctx.lineTo(x + w * 0.72, y + h * 0.42);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + w * 0.48, y + h * 0.60);
    ctx.lineTo(x + w * 0.64, y + h * 0.95);
    ctx.lineTo(x + w * 0.72, y + h * 0.58);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(255,120,40,0.85)";
    ctx.beginPath();
    ctx.moveTo(x + w * 0.04, y + h * 0.50);
    ctx.lineTo(x - w * 0.10, y + h * 0.35);
    ctx.lineTo(x - w * 0.06, y + h * 0.50);
    ctx.lineTo(x - w * 0.10, y + h * 0.65);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawStar(x,y,r,color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    for(let i=0;i<10;i++){
        const a = -Math.PI/2 + i * Math.PI/5;
        const rr = i % 2 === 0 ? r : r*0.45;
        const px = x + Math.cos(a) * rr;
        const py = y + Math.sin(a) * rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawLeaf(x,y,size,color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x,y,size*0.55,size*0.28,-0.6,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x-size*0.3,y+size*0.16);
    ctx.lineTo(x+size*0.34,y-size*0.16);
    ctx.stroke();
    ctx.restore();
}

function drawPeanut(x,y,size){
    ctx.save();
    ctx.fillStyle = "rgba(214,151,72,0.96)";
    ctx.strokeStyle = "rgba(80,45,18,0.8)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x-size*0.22,y,size*0.28,size*0.38,-0.35,0,Math.PI*2);
    ctx.ellipse(x+size*0.22,y,size*0.28,size*0.38,0.35,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(120,75,35,0.32)";
    for(let i=0;i<5;i++){
        ctx.beginPath();
        ctx.arc(x + (i-2)*size*0.16, y + Math.sin(i)*size*0.12, size*0.025, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
}

function drawSquirrel(x,y,size,color){
    ctx.save();
    const fur = "rgba(182,103,42,0.98)";
    const belly = "rgba(245,197,126,0.95)";
    const dark = "rgba(35,20,10,0.9)";

    ctx.fillStyle = fur;
    ctx.beginPath();
    ctx.ellipse(x-size*0.32,y-size*0.05,size*0.28,size*0.45,-0.7,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(x,y+size*0.06,size*0.28,size*0.23,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = belly;
    ctx.beginPath();
    ctx.ellipse(x+size*0.04,y+size*0.08,size*0.13,size*0.15,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = fur;
    ctx.beginPath();
    ctx.ellipse(x+size*0.26,y-size*0.10,size*0.18,size*0.16,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x+size*0.20,y-size*0.23);
    ctx.lineTo(x+size*0.28,y-size*0.39);
    ctx.lineTo(x+size*0.34,y-size*0.22);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.arc(x+size*0.32,y-size*0.13,size*0.025,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = dark;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x+size*0.15,y+size*0.05);
    ctx.lineTo(x+size*0.35,y+size*0.02);
    ctx.moveTo(x-size*0.08,y+size*0.23);
    ctx.lineTo(x-size*0.20,y+size*0.34);
    ctx.moveTo(x+size*0.12,y+size*0.24);
    ctx.lineTo(x+size*0.25,y+size*0.33);
    ctx.stroke();

    ctx.restore();
}

function drawMolehill(o){
    ctx.save();
    ctx.fillStyle = "rgba(112,72,42,0.95)";
    ctx.beginPath();
    ctx.ellipse(o.x + o.w*0.50, o.y + o.h*0.76, o.w*0.47, o.h*0.40, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "rgba(60,35,18,0.45)";
    ctx.beginPath();
    ctx.ellipse(o.x + o.w*0.50, o.y + o.h*0.67, o.w*0.20, o.h*0.10, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
}

function drawBush(o){
    ctx.save();
    ctx.fillStyle = "rgba(49,165,72,0.92)";
    ctx.beginPath();
    ctx.arc(o.x+o.w*0.24,o.y+o.h*0.66,o.w*0.22,0,Math.PI*2);
    ctx.arc(o.x+o.w*0.46,o.y+o.h*0.50,o.w*0.28,0,Math.PI*2);
    ctx.arc(o.x+o.w*0.70,o.y+o.h*0.66,o.w*0.24,0,Math.PI*2);
    ctx.rect(o.x+o.w*0.12,o.y+o.h*0.62,o.w*0.74,o.h*0.28);
    ctx.fill();
    ctx.restore();
}

function drawEagle(o){
    ctx.save();
    const flap = Math.sin(performance.now() * 0.010 + o.seed);
    const x=o.x, y=o.y, w=o.w, h=o.h;
    const wingLift = flap * h * 0.16;

    ctx.fillStyle = "rgba(98,65,34,0.96)";
    ctx.beginPath();
    ctx.moveTo(x+w*0.40,y+h*0.50);
    ctx.lineTo(x+w*0.06,y+h*0.24-wingLift);
    ctx.lineTo(x+w*0.38,y+h*0.66);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x+w*0.60,y+h*0.50);
    ctx.lineTo(x+w*0.94,y+h*0.24-wingLift);
    ctx.lineTo(x+w*0.62,y+h*0.66);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(75,45,22,0.98)";
    ctx.beginPath();
    ctx.ellipse(x+w*0.50,y+h*0.50,w*0.16,h*0.16,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "rgba(230,230,215,0.96)";
    ctx.beginPath();
    ctx.ellipse(x+w*0.66,y+h*0.46,w*0.08,h*0.09,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "rgba(245,190,40,0.95)";
    ctx.beginPath();
    ctx.moveTo(x+w*0.72,y+h*0.46);
    ctx.lineTo(x+w*0.84,y+h*0.42);
    ctx.lineTo(x+w*0.74,y+h*0.53);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function getFoxMouthOpen(o){
    return 0.5 + 0.5 * Math.sin(performance.now() * 0.010 + o.seed);
}

function drawFox(o){
    ctx.save();
    const x=o.x, y=o.y, w=o.w, h=o.h;
    const mouthOpen = getFoxMouthOpen(o);
    const orange = "rgba(218,92,28,0.98)";
    const cream = "rgba(250,230,190,0.96)";
    const dark = "rgba(25,14,8,0.9)";

    ctx.fillStyle = orange;
    ctx.beginPath();
    ctx.moveTo(x+w*0.18,y+h*0.58);
    ctx.lineTo(x+w*0.02,y+h*0.28);
    ctx.lineTo(x+w*0.28,y+h*0.48);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = cream;
    ctx.beginPath();
    ctx.moveTo(x+w*0.04,y+h*0.31);
    ctx.lineTo(x+w*0.02,y+h*0.28);
    ctx.lineTo(x+w*0.12,y+h*0.36);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = orange;
    ctx.beginPath();
    ctx.ellipse(x+w*0.42,y+h*0.62,w*0.30,h*0.24,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x+w*0.67,y+h*0.50,w*0.20,h*0.18,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x+w*0.58,y+h*0.36);
    ctx.lineTo(x+w*0.62,y+h*0.08);
    ctx.lineTo(x+w*0.72,y+h*0.36);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x+w*0.74,y+h*0.36);
    ctx.lineTo(x+w*0.82,y+h*0.10);
    ctx.lineTo(x+w*0.84,y+h*0.42);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = cream;
    ctx.beginPath();
    ctx.ellipse(x+w*0.46,y+h*0.67,w*0.17,h*0.11,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.arc(x+w*0.72,y+h*0.45,w*0.018,0,Math.PI*2);
    ctx.fill();

    const mouthTipX = x+w*0.84;
    const mouthBackX = x+w*0.68;
    const mouthTopY = y+h*(0.48 - mouthOpen*0.06);
    const mouthBottomY = y+h*(0.56 + mouthOpen*0.06);

    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.moveTo(mouthTipX,y+h*0.52);
    ctx.lineTo(mouthBackX,mouthTopY);
    ctx.lineTo(mouthBackX,mouthBottomY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "white";
    for(let i=0;i<4;i++){
        const tx = x+w*(0.70+i*0.032);
        ctx.beginPath();
        ctx.moveTo(tx,mouthTopY+h*0.01);
        ctx.lineTo(tx+w*0.018,mouthTopY+h*0.01);
        ctx.lineTo(tx+w*0.009,y+h*0.525);
        ctx.closePath();
        ctx.fill();
    }

    for(let i=0;i<4;i++){
        const tx = x+w*(0.705+i*0.032);
        ctx.beginPath();
        ctx.moveTo(tx,mouthBottomY-h*0.01);
        ctx.lineTo(tx+w*0.018,mouthBottomY-h*0.01);
        ctx.lineTo(tx+w*0.009,y+h*0.535);
        ctx.closePath();
        ctx.fill();
    }

    ctx.fillStyle = dark;
    ctx.fillRect(x+w*0.32,y+h*0.76,w*0.055,h*0.20);
    ctx.fillRect(x+w*0.55,y+h*0.76,w*0.055,h*0.20);

    ctx.restore();
}

function draw(){
    const cfg = getConfig();
    drawBackground(cfg);
    drawPlayer(cfg);
    obstacles.forEach(drawObstacle);
    orbs.forEach(o => drawOrb(o,cfg));

    particles.forEach(p => {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color || "white";
        ctx.fillRect(p.x,p.y,4,4);
    });
    ctx.globalAlpha = 1;
}

function loop(){
    if(!running) return;
    update();
    draw();
    animationFrameId = requestAnimationFrame(loop);
}

function startTimer(){
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if(!running){
            clearInterval(timerInterval);
            timerInterval = null;
            return;
        }

        time--;
        document.getElementById("timer").innerText = time;
        score += Math.round(1 * getConfig().scoreMultiplier);

        if(time <= 0){
            clearInterval(timerInterval);
            timerInterval = null;
            endGame("finish");
        }
    },1000);
}

/* =====================================
   SUPABASE DATA
===================================== */
async function trackPlay(){
    if(!supabaseClient) return;

    const playerName = getCleanName() || localStorage.getItem("playerName") || "PLAYER";
    const payload = {
        event:"play",
        player:playerName,
        player_id:getPlayerId(),
        device:isMobile ? "mobile" : "desktop",
        country:getBrowserCountry(),
        level:selectedLevel
    };

    const { error } = await supabaseClient.from("analytics").insert([payload]);
    if(error) console.error("Analytics insert failed:", error.message, error);
}

async function submitScore(){
    if(!supabaseClient) return;

    const name = getCleanName() || localStorage.getItem("playerName") || "PLAYER";
    const payload = { name, score:Number(score), level:selectedLevel };

    const { error } = await supabaseClient.from("scores").insert([payload]);
    if(error) console.error("Supabase insert failed:", error.message, error);
}

async function loadLeaderboard(targetId = "startLeaderboard", level = leaderboardLevel){
    const board = document.getElementById(targetId);
    if(!board) return;

    board.innerHTML = "<h3>TOP 10</h3>" + renderLeaderboardTabs(level);

    if(!supabaseClient){
        board.innerHTML += "<p>Leaderboard offline.</p>";
        return;
    }

    let query = supabaseClient
        .from("scores")
        .select("name, score, created_at, level")
        .order("score", { ascending:false })
        .order("created_at", { ascending:true })
        .limit(10);

    query = query.eq("level", level);

    const { data, error } = await query;

    if(error){
        console.error("Supabase select failed:", error.message, error);
        board.innerHTML += "<p>Leaderboard konnte nicht geladen werden.</p>";
        bindLeaderboardTabs();
        return;
    }

    if(!data || data.length === 0){
        board.innerHTML += "<p>No scores yet.</p>";
        bindLeaderboardTabs();
        return;
    }

    data.forEach((s,i) => {
        board.innerHTML += `
            <div class="scoreRow">
                <span>${i+1}. ${escapeHtml(s.name)}</span>
                <span>${Number(s.score)}</span>
            </div>
        `;
    });

    bindLeaderboardTabs();
}

function renderLeaderboardTabs(activeLevel){
    let html = '<div class="leaderboard-tabs">';
    for(let i=1;i<=4;i++){
        html += `<button class="lb-tab ${i===activeLevel?'active':''}" type="button" data-lb-level="${i}">L${i}</button>`;
    }
    html += '</div>';
    return html;
}

function bindLeaderboardTabs(){
    document.querySelectorAll(".lb-tab").forEach(btn => {
        btn.onclick = () => {
            leaderboardLevel = Number(btn.dataset.lbLevel || 1);
            loadLeaderboard("startLeaderboard", leaderboardLevel).catch(console.warn);
        };
    });
}

/* =====================================
   START SCREEN
===================================== */
function updateStartScreenMode(){
    const input = document.getElementById("name");
    const btn = document.getElementById("startBtn");
    const levelSelect = document.getElementById("levelSelect");

    if(waitingForNewName){
        input.style.display = "block";
        levelSelect.style.display = "grid";
        btn.textContent = "START";
    }else{
        input.style.display = "none";
        levelSelect.style.display = "grid";
        btn.textContent = "RETRY";
    }
}

function showStartScreen(resultType, finalScore){
    const headline = document.getElementById("resultHeadline");
    const resultScore = document.getElementById("resultScore");
    const title = document.getElementById("startTitle");

    title.textContent = "NEW RELEASE";

    if(resultType === "finish") headline.textContent = "FINISH";
    else if(resultType === "gameover") headline.textContent = "GAME OVER";
    else headline.textContent = "";

    if(typeof finalScore === "number") resultScore.textContent = "SCORE: " + finalScore + " / LEVEL " + selectedLevel;
    else resultScore.textContent = "";

    updateStartScreenMode();
    document.getElementById("start").style.display = "flex";
}

async function endGame(resultType = "gameover"){
    if(ending) return;
    ending = true;
    running = false;

    if(animationFrameId){ cancelAnimationFrame(animationFrameId); animationFrameId = null; }
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }

    song.pause();
    const finalScore = score;

    await submitScore();

    retryCount++;

    if(retryCount >= 4){
        waitingForNewName = true;
        retryCount = 0;
        document.getElementById("name").value = "";
        localStorage.removeItem("playerName");
    }else{
        waitingForNewName = false;
    }

    showStartScreen(resultType, finalScore);
    leaderboardLevel = selectedLevel;
    await loadLeaderboard("startLeaderboard", leaderboardLevel);

    ending = false;
}

function resetGameState(){
    ending = false;
    running = false;

    if(animationFrameId){ cancelAnimationFrame(animationFrameId); animationFrameId = null; }
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }

    const cfg = getConfig();
    score = 0;
    time = cfg.duration;
    gameStartTime = 0;
    lastSpawnTime = 0;
    nextSpawnDelay = 1300;
    bgOffset = 0;

    obstacles = [];
    particles = [];
    orbs = [];

    player.x = isMobile ? window.innerWidth * 0.22 : window.innerWidth * 0.25;
    player.y = window.innerHeight * 0.5;
    player.vy = 0;

    document.getElementById("score").innerText = score;
    document.getElementById("timer").innerText = time;
    document.getElementById("levelLabel").innerText = selectedLevel;
}

const startBtn = document.getElementById("startBtn");

startBtn.addEventListener("click", function(){
    startGame().catch(function(err){
        console.error("Start failed:", err);
        setStartStatus("Start fehlgeschlagen. Bitte Browser-Konsole prüfen.");
        startBtn.disabled = false;
    });
});

async function startGame(){
    startBtn.disabled = true;
    setStartStatus("");

    const input = document.getElementById("name");
    const playerName = getCleanName();

    if(input.style.display !== "none" && playerName.length < 1){
        setStartStatus("bitte gib zuerst deinen namen ein");
        input.focus();
        startBtn.disabled = false;
        return;
    }

    if(input.style.display !== "none"){
        retryCount = 0;
        waitingForNewName = false;
    }

    localStorage.setItem("playerName", playerName || localStorage.getItem("playerName") || "PLAYER");

    await trackPlay();

    resetGameState();

    document.getElementById("start").style.display = "none";

    try{
        const cfg = getConfig();
        song.pause();
        song.src = cfg.audio;
        song.currentTime = 0;
        await song.play();
    }catch(err){
        console.warn("Audio blocked, game starts without audio:", err);
    }

    running = true;
    gameStartTime = performance.now();
    lastSpawnTime = performance.now();
    nextSpawnDelay = getSpawnDelay();

    loop();
    startTimer();

    startBtn.disabled = false;
}

/* =====================================
   INIT
===================================== */
waitingForNewName = true;
retryCount = 0;
document.getElementById("name").value = "";
showStartScreen(null);
loadLeaderboard("startLeaderboard", leaderboardLevel).catch(console.warn);
</script>
