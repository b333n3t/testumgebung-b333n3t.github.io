    :root{
      --awb-text-main:#fdfdfd;
      --page-max-width:960px;

    html,

    /* =========================================================
       WEBGL SPACE
       ========================================================= */

    #webgl-space{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      pointer-events:none;
      opacity:0;
      transition:opacity 1s ease;
      mix-blend-mode:screen;
    }

    .page-wrap{
      min-height:100vh;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:flex-start;

      padding:
        clamp(2.8rem,4vw,3.8rem)

      box-sizing:border-box;

      position:relative;
      z-index:2;
    }

    .content{
      width:100%;
      max-width:var(--page-max-width);
      position:relative;
    }

    main.main{
      display:flex;
      flex-direction:column;
      gap:clamp(1.6rem,2.4vw,2.2rem);
    }

    .topline{
      display:flex;
      flex-wrap:wrap;
      align-items:baseline;
      gap:0.7rem;

      font-size:0.92rem;
      letter-spacing:0.04em;

      margin-bottom:
        clamp(1.6rem,2.4vw,2.2rem);
    }

    .brand-link{
      color:#ffffff;
      font-weight:700;
      text-decoration:none;
      letter-spacing:0.04em;
    }

    .count-label{
      opacity:0.9;
    }

    #awb-countdown-timer{
      font-variant-numeric:tabular-nums;
      font-weight:700;
      color:#fff;
      min-width:8ch;
      display:inline-block;
    }

    /* =========================================================
       VIDEO / PLAYER WRAP
       ========================================================= */

    .video-wrap{
      margin:
        0 auto
        clamp(2rem,3vw,2.8rem);

      max-width:720px;
      width:100%;

      opacity:1;
      visibility:visible;
      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
      pointer-events:auto;
    }

    .video-wrap.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    /* prefers-reduced-motion: Animationen reduzieren */
    @media (prefers-reduced-motion: reduce){
      .video-wrap,
      .release-cover,
      .player-bg-glow,
      #webgl-space{
        transition:none !important;
        animation:none !important;
      }
    }

    /*
      Der äußere Wrapper hat overflow:visible
      damit der animierte Hintergrund
      über den Rahmen hinausfließen kann.
    */
    .video-inner{
      border-radius:22px;

      /* KEIN overflow:hidden mehr – Hintergrund soll durchscheinen */
      overflow:visible;

      aspect-ratio:16 / 9;

      position:relative;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        0 0 120px rgba(120,180,255,0.08);

      /* Rahmen-Clip nur für den Inhalt via pseudo-element */
      isolation:isolate;
    }

    /*
      Clip-Maske als Pseudo-Element –
      schneidet nur den Inhalt, nicht den Hintergrund.
    */
    .video-inner::before{
      content:'';
      position:absolute;
      inset:0;
      border-radius:22px;
      z-index:1;
      pointer-events:none;
    }

    /*
      Der eigentliche Clip-Container für Cover + Audio.
      Dieser clippt den Inhalt auf den Rahmen.
      Statischer Gradient als "Vorschau" des Sternenhintergrunds.
    */
    .video-clip{
      position:absolute;
      inset:0;
      border-radius:22px;
      overflow:hidden;
      z-index:2;

      background:
        radial-gradient(
          ellipse at 30% 60%,
          rgba(160,200,255,0.18) 0%,
          transparent 55%
        ),
        radial-gradient(
          ellipse at 75% 30%,
          rgba(100,150,220,0.14) 0%,
          transparent 50%
        ),
        linear-gradient(
          145deg,
          #0a0f1e 0%,
          #0f1a2e 40%,
          #152240 70%,
          #0d1525 100%
        );
    }

    /*
      Das Cover-Bild – zeigt beim Laden den gleichen
      Farbhintergrund wie die Animation.
      Fadet beim Play smooth aus.
    */
    .release-cover{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;

      /* Sanfter Übergang: Cover fadet aus */
      opacity:1;
      transition:opacity 0.9s ease;

      position:relative;
      z-index:3;
    }

    /*
      Wenn Audio spielt: Cover transparent
      → animierter Hintergrund scheint durch
    */
    .release-cover.playing{
      opacity:0;
    }

    /*
      Der animierte Hintergrund "hinter" dem Frame –
      sichtbar durch den transparenten Cover-Bereich.
      Nutzt den globalen WebGL-Canvas (fixed) der
      schon da ist, plus ein dediziertes Glow-Element
      das nur bei playing aktiv ist.
    */
    .player-bg-glow{
      position:absolute;
      inset:-18px;                   /* leicht größer als Rahmen */
      border-radius:30px;
      z-index:0;                     /* hinter dem Clip-Container */

      opacity:0;
      transition:opacity 1s ease;

      /* Gleiche Farbe wie der WebGL-Hintergrund */
      background:radial-gradient(
        ellipse at 50% 50%,
        rgba(120,180,255,0.22) 0%,
        rgba(88,127,166,0.12) 60%,
        transparent 100%
      );

      pointer-events:none;
    }

    .player-bg-glow.playing{
      opacity:1;
    }

    /*
      Glühender Rahmen-Ring wenn playing –
      macht den "Übergang" zum Hintergrund weich
    */
    .video-inner.playing{
      box-shadow:
        0 0 0 1.5px rgba(255,255,255,0.08),
        0 20px 60px rgba(0,0,0,0.35),
        0 0 80px rgba(120,180,255,0.30),
        0 0 180px rgba(120,180,255,0.15);
    }

    .audio-overlay{
      display:block;
      width:100%;
      margin-top:0.6rem;

    }

    section.block{

    section.block h2{

  <!-- COUNTDOWN -->

  <script>

    (() => {

      const targetDate =
        new Date("2026-03-06T00:00:00+01:00").getTime();

      const el =
        document.getElementById("awb-countdown-timer");

      if(!el) return;

      function updateCountdown(){

        const now = Date.now();

        const diff = targetDate - now;

        if(diff <= 0){

          el.textContent = "OUT NOW";

          clearInterval(timer);

          return;
        }

        const seconds = Math.floor(diff / 1000);

        const days =
          Math.floor(seconds / (3600 * 24));

        const hours =
          Math.floor((seconds % (3600 * 24)) / 3600);

        const mins =
          Math.floor((seconds % 3600) / 60);

        const secs = seconds % 60;

        const hh =
          String(hours).padStart(2, "0");

        const mm =
          String(mins).padStart(2, "0");

        const ss =
          String(secs).padStart(2, "0");

        el.textContent =
          days > 0
          ? `${days}d ${hh}:${mm}:${ss}`
          : `${hh}:${mm}:${ss}`;
      }

      updateCountdown();

      const timer =
        setInterval(updateCountdown, 1000);

    })();

  </script>

  <script>

  (() => {

    const audio =
      document.getElementById('release-audio');

    if(!audio) return;

    /* =========================================================
       ELEMENTE FÜR DEN COVER-EFFEKT
       ========================================================= */

    const cover =
      document.getElementById('release-cover');

    const playerFrame =
      document.getElementById('player-frame');

    const playerBgGlow =
      document.getElementById('player-bg-glow');

    const videoWrap =
      document.querySelector('.video-wrap');

    /* Audio-Element separat referenzieren für iOS-kompatibles Verstecken */
    const audioEl =
      document.getElementById('release-audio');

    /* =========================================================
       WEBGL
       ========================================================= */

    const renderer =
      new THREE.WebGLRenderer({
        alpha:true,
        antialias:true
      });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.domElement.id = 'webgl-space';

    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();

    const camera =
      new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        4000
      );

    camera.position.z = 500;

    /* =========================================================
       AUDIO
       ========================================================= */

    const audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const source =
      audioCtx.createMediaElementSource(audio);

    const analyser =
      audioCtx.createAnalyser();

    analyser.fftSize = 256;

    source.connect(analyser);

    analyser.connect(audioCtx.destination);

    const bufferLength =
      analyser.frequencyBinCount;

    const dataArray =
      new Uint8Array(bufferLength);

    function getAudioLevel(){

      analyser.getByteFrequencyData(dataArray);

      let sum = 0;

      for(let i = 0; i < bufferLength; i++){

        sum += dataArray[i];
      }

      return sum / bufferLength / 255;
    }

    /* =========================================================
       STARS
       ========================================================= */

    const geometry =
      new THREE.BufferGeometry();

    const starCount = 9000;

    const positions =
      new Float32Array(starCount * 3);

    for(let i = 0; i < starCount * 3; i++){

      positions[i] =
        (Math.random() - 0.5) * 3200;
    }

    geometry.setAttribute(
      'position',
      new THREE.BufferAttribute(positions, 3)
    );

    const starTexture =
      createStarTexture();

    const material =
      new THREE.PointsMaterial({

        map: starTexture,

        color:0xffffff,

        size:4.2,

        transparent:true,

        opacity:1,

        blending:THREE.AdditiveBlending,

        depthWrite:false,

        sizeAttenuation:true
      });

    const stars =
      new THREE.Points(
        geometry,
        material
      );

    scene.add(stars);

    function createStarTexture(){

      const canvas =
        document.createElement('canvas');

      canvas.width = 128;
      canvas.height = 128;

      const ctx =
        canvas.getContext('2d');

      const gradient =
        ctx.createRadialGradient(
          64,64,0,
          64,64,64
        );

      gradient.addColorStop(0,'rgba(255,255,255,1)');
      gradient.addColorStop(0.15,'rgba(255,255,255,1)');
      gradient.addColorStop(0.4,'rgba(255,255,255,0.9)');
      gradient.addColorStop(1,'rgba(255,255,255,0)');

      ctx.fillStyle = gradient;

      ctx.beginPath();

      ctx.arc(64,64,64,0,Math.PI * 2);

      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    /* =========================================================
       ASTRONAUT
       ========================================================= */

    let astronaut;

    const textureLoader =
      new THREE.TextureLoader();

    textureLoader.load(

      'assets/release/astronaut.webp',

      (texture) => {

        console.log('Astronaut geladen');

        const astronautMaterial =
          new THREE.SpriteMaterial({

            map:texture,

            transparent:true,

            depthWrite:false,

            opacity:1
          });

        astronaut =
          new THREE.Sprite(
            astronautMaterial
          );

        astronaut.scale.set(
          220,
          220,
          1
        );

        astronaut.position.set(
          0,
          0,
          -800
        );

        scene.add(astronaut);

      },

      undefined,

      (err) => {

        console.error(
          'Astronaut Fehler:',
          err
        );

      }

    );

    /* =========================================================
       DROP MODE
       ========================================================= */

    let dropMode = false;

    window.addEventListener('keydown', (e) => {

      if(e.key.toLowerCase() === 'd'){

        dropMode = !dropMode;

        document.body.classList.toggle(
          'drop-mode-active',
          dropMode
        );
      }

    });

    /* =========================================================
       PARALLAX
       ========================================================= */

    let mouseX = 0;
    let mouseY = 0;

    window.addEventListener('mousemove', (e) => {

      mouseX =
        (e.clientX / window.innerWidth - 0.5);

      mouseY =
        (e.clientY / window.innerHeight - 0.5);

    });

    /* =========================================================
       RESIZE
       ========================================================= */

    window.addEventListener('resize', () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });

    /* =========================================================
       ANIMATION
       ========================================================= */

    let animationId;
    let running = false;
    let astronautPhase = 0;
    let astronautRotation = 0;

    function animate(){

      const audioLevel =
        getAudioLevel();

      camera.position.x +=
        ((mouseX * 40) - camera.position.x) * 0.02;

      camera.position.y +=
        ((-mouseY * 40) - camera.position.y) * 0.02;

      camera.lookAt(scene.position);

      /* STARS */

      stars.rotation.y +=
        0.00018 + audioLevel * 0.003;

      stars.rotation.x +=
        0.00003;

      material.size =
        4.2 + audioLevel * 4;

      material.opacity = 1;

      /* =======================================================
         ASTRONAUT MOVEMENT
         – bleibt weiter hinten
         – dreht sich beim Entfernen schneller
         – driftet seitlich aus dem Bild
         ======================================================= */

      if(astronaut){

        astronautPhase += 0.0018;

        const wave = Math.sin(astronautPhase);

        /* Z: bleibt weit hinten, kommt nie zu nah */
        astronaut.position.z =
          -2200 + ((wave + 1) / 2) * 1800;

        /* Scale: kleiner als vorher */
        const scale = 120 + ((wave + 1) / 2) * 200;
        astronaut.scale.set(scale, scale, 1);

        /* X: normales Schweben + seitlicher Drift beim Entfernen */
        const drift = wave < 0 ? wave * 320 : 0;
        astronaut.position.x =
          Math.sin(astronautPhase * 0.7) * 120 + drift;

        astronaut.position.y =
          Math.cos(astronautPhase * 0.9) * 70;

        /* Rotation: akkumuliert, beschleunigt leicht beim Entfernen */
        const rotSpeed = wave < 0
          ? 0.001 + Math.abs(wave) * 0.008
          : 0.0006;

        astronautRotation += rotSpeed;
        astronaut.material.rotation = astronautRotation;

        /* Opacity: früher ausblenden beim Entfernen */
        astronaut.material.opacity = wave < -0.3
          ? Math.max(0, (wave + 1) * 0.6)
          : 0.35 + ((wave + 1) / 2) * 0.55;
      }

      renderer.render(scene, camera);

      animationId =
        requestAnimationFrame(animate);
    }

    /* =========================================================
       START / STOP   –   inkl. Cover-Effekt
       ========================================================= */

    async function startSpace(){

      if(running) return;

      running = true;

      await audioCtx.resume();

      /* prefers-reduced-motion: WebGL überspringen */
      const reduced =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      if(!reduced){
        renderer.domElement.style.opacity = '1';
      }

      /* Visuellen Rahmen + Cover ausblenden – Platz bleibt erhalten */
      if(playerFrame){
        playerFrame.style.transition = 'opacity 0.8s ease';
        playerFrame.style.opacity = '0';
        playerFrame.style.pointerEvents = 'none';
      }

      /* Audio-Controls ausblenden – bleiben im DOM aktiv */
      if(audioEl){
        audioEl.style.transition = 'opacity 0.8s ease';
        audioEl.style.opacity = '0';
        audioEl.style.pointerEvents = 'none';
      }

      if(cover)        cover.classList.add('playing');
      if(playerBgGlow) playerBgGlow.classList.add('playing');

      if(!reduced){
        animate();
      }
    }

    function stopSpace(){

      running = false;

      cancelAnimationFrame(animationId);

      /* WebGL ausblenden */
      renderer.domElement.style.opacity = '0';

      /* Visuellen Rahmen wieder einblenden */
      if(playerFrame){
        playerFrame.style.opacity = '1';
        playerFrame.style.pointerEvents = '';
      }

      /* Audio-Controls wieder einblenden */
      if(audioEl){
        audioEl.style.opacity = '1';
        audioEl.style.pointerEvents = '';
      }

      if(cover)        cover.classList.remove('playing');
      if(playerBgGlow) playerBgGlow.classList.remove('playing');
    }

    /* Pause zeigt Player NICHT zurück – nur Ende */
    audio.addEventListener('play',  startSpace);
    audio.addEventListener('ended', stopSpace);

  })();

  </script>
