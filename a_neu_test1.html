<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B3NN3T – gespalten</title>

<style>

/* =========================================================
   GRUNDLAYOUT
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07131b;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    color: #fff;
}


/* =========================================================
   HAUPTBÜHNE
========================================================= */

#stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #07131b;
}


/* =========================================================
   SEITEN
========================================================= */

.page {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;

    will-change: clip-path, transform;

    transition: none;
}


/* =========================================================
   SEITE 1
========================================================= */

#page1 {
    z-index: 2;

    background:
        radial-gradient(
            circle at 25% 50%,
            rgba(0, 110, 170, 0.25),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #071b28 0%,
            #0b3044 45%,
            #05131d 100%
        );
}


/* =========================================================
   SEITE 2
========================================================= */

#page2 {
    z-index: 1;

    background:
        radial-gradient(
            circle at 75% 50%,
            rgba(35, 130, 95, 0.22),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #071812 0%,
            #174c3b 48%,
            #07130f 100%
        );
}


/* =========================================================
   INHALT EINER SEITE
========================================================= */

.page-content {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: grid;
    grid-template-columns: 50% 50%;

    pointer-events: none;
}


/* =========================================================
   LINKE / RECHTE HÄLFTE
========================================================= */

.side {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;

    padding: clamp(30px, 6vw, 110px);
}

.side-left {
    align-items: flex-start;
    text-align: left;
}

.side-right {
    align-items: flex-end;
    text-align: right;
}


/* =========================================================
   TYPOGRAFIE
========================================================= */

.logo {
    margin: 0;

    font-size: clamp(42px, 8vw, 130px);
    line-height: 0.8;

    font-weight: 900;
    letter-spacing: -0.07em;

    color: #d88a43;

    text-shadow:
        1px 1px 0 #8d4d20,
        2px 2px 0 #5b3016,
        0 0 25px rgba(216, 138, 67, 0.18);
}


.title {
    margin: 24px 0 0 0;

    font-size: clamp(32px, 5.5vw, 90px);
    line-height: 0.9;

    font-weight: 800;
    letter-spacing: -0.045em;

    color: #e2a05f;

    text-transform: uppercase;
}


.subtitle {
    margin-top: 28px;

    max-width: 520px;

    font-size: clamp(15px, 1.4vw, 22px);
    line-height: 1.5;

    color: rgba(255,255,255,0.78);
}


.small-label {
    margin-bottom: 18px;

    font-size: 12px;
    letter-spacing: 0.25em;

    text-transform: uppercase;

    color: rgba(255,255,255,0.5);
}


.big-word {
    margin: 0;

    font-size: clamp(50px, 9vw, 145px);
    line-height: 0.82;

    font-weight: 900;
    letter-spacing: -0.075em;

    color: rgba(255,255,255,0.92);
}


/* =========================================================
   VIDEO
========================================================= */

.video-wrap {
    position: absolute;

    left: clamp(30px, 5vw, 90px);
    bottom: clamp(30px, 5vw, 80px);

    width: min(42vw, 600px);

    aspect-ratio: 16 / 9;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,0.18);

    background: #000;

    box-shadow:
        0 20px 80px rgba(0,0,0,0.45);
}


.video-wrap video {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* =========================================================
   TEXT-INFOS
========================================================= */

.info-list {
    margin-top: 40px;

    display: flex;
    flex-direction: column;
    gap: 14px;

    font-size: clamp(14px, 1.3vw, 20px);

    color: rgba(255,255,255,0.72);
}


.info-item {
    display: flex;
    align-items: center;
    gap: 12px;
}


.info-number {
    font-weight: 700;
    color: #d88a43;
}


/* =========================================================
   SEITE 2 SPEZIFISCHE ELEMENTE
========================================================= */

#page2 .logo {
    color: #dca26a;
}

#page2 .title {
    color: #b8d4b6;
}

#page2 .big-word {
    color: #d7e4d8;
}


/* =========================================================
   DIE BEIDEN SPALTKANTEN
   KEINE FESTE LINIE IN DER MITTE!
========================================================= */

.seam-edge {
    position: absolute;

    top: 0;

    width: 2px;
    height: 100%;

    z-index: 20;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0.05),
            rgba(255,255,255,0.65) 25%,
            rgba(255,255,255,0.25) 50%,
            rgba(255,255,255,0.65) 75%,
            rgba(255,255,255,0.05)
        );

    box-shadow:
        0 0 10px rgba(255,255,255,0.18);
}


/*
   Wichtig:
   Diese Kanten sitzen NICHT dauerhaft in der Mitte.
   Sie werden per JavaScript mit der Öffnung verschoben.
*/

#seamLeft {
    left: 50%;
}

#seamRight {
    left: 50%;
}


/* =========================================================
   LEICHTER INNERER SCHATTEN AN DER SPALTE
========================================================= */

.split-shadow {
    position: absolute;

    top: 0;
    height: 100%;

    width: 35px;

    pointer-events: none;

    z-index: 15;

    opacity: 0;
}

#shadowLeft {
    transform: translateX(-100%);

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(0,0,0,0.38)
        );
}

#shadowRight {
    background:
        linear-gradient(
            to left,
            transparent,
            rgba(0,0,0,0.38)
        );
}


/* =========================================================
   STATUS
========================================================= */

#state-label {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    z-index: 100;

    font-size: 10px;

    letter-spacing: 0.25em;
    text-transform: uppercase;

    color: rgba(255,255,255,0.35);

    pointer-events: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .page-content {
        grid-template-columns: 50% 50%;
    }

    .side {
        padding: 25px;
    }

    .video-wrap {
        width: 75vw;
        left: 25px;
        bottom: 30px;
    }

    .subtitle {
        max-width: 75vw;
    }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .page {
        transition: none;
    }

}

</style>
</head>


<body>

<div id="stage">

    <!-- =====================================================
         SEITE 2 – liegt zunächst HINTER SEITE 1
    ====================================================== -->

    <section
        id="page2"
        class="page"
        aria-hidden="true"
    >

        <div class="page-content">

            <!-- LINKe SEITE -->
            <div class="side side-left">

                <div class="small-label">
                    b3nn3t / 02
                </div>

                <h1 class="logo">
                    b3nn3t
                </h1>

                <h2 class="title">
                    die andere
                </h2>

                <div class="info-list">

                    <div class="info-item">
                        <span class="info-number">01</span>
                        <span>neue Perspektive</span>
                    </div>

                    <div class="info-item">
                        <span class="info-number">02</span>
                        <span>neue Räume</span>
                    </div>

                    <div class="info-item">
                        <span class="info-number">03</span>
                        <span>neue Richtung</span>
                    </div>

                </div>

            </div>


            <!-- RECHTE SEITE -->
            <div class="side side-right">

                <div class="small-label">
                    seite zwei
                </div>

                <h2 class="big-word">
                    NEU<br>
                    GEDACHT
                </h2>

            </div>

        </div>

    </section>



    <!-- =====================================================
         SEITE 1 – STARTSEITE
    ====================================================== -->

    <section
        id="page1"
        class="page"
        aria-hidden="false"
    >

        <div class="page-content">

            <!-- LINKE SEITE -->
            <div class="side side-left">

                <div class="small-label">
                    neues album / 01
                </div>

                <h1 class="logo">
                    b3nn3t
                </h1>

                <h2 class="title">
                    gespalten
                </h2>

                <p class="subtitle">
                    10 kurze Songs.
                    12 Minuten zwischen alt und neu.
                </p>


                <div class="video-wrap">

                    <video
                        src="/assets/gespalten/gespalten.mp4"
                        controls
                        playsinline
                        preload="metadata"
                    ></video>

                </div>

            </div>


            <!-- RECHTE SEITE -->
            <div class="side side-right">

                <div class="small-label">
                    die andere seite
                </div>

                <h2 class="big-word">
                    ZWISCHEN<br>
                    DEN<br>
                    SEITEN
                </h2>

            </div>

        </div>

    </section>



    <!-- =====================================================
         DIE SPALTKANTEN
         WICHTIG:
         KEINE BLAUE DAUERLINIE!
    ====================================================== -->

    <div
        id="seamLeft"
        class="seam-edge"
    ></div>

    <div
        id="seamRight"
        class="seam-edge"
    ></div>


    <!-- SCHATTEN DER ÖFFNUNG -->

    <div
        id="shadowLeft"
        class="split-shadow"
    ></div>

    <div
        id="shadowRight"
        class="split-shadow"
    ></div>


    <!-- STATUS -->

    <div id="state-label">
        gespalten
    </div>

</div>


<script>

/* =========================================================
   B3NN3T – GESPALTEN
   VERSION 3

   ZWEI ZUSTÄNDE:

   SEITE 1
       ↓
   SPALTE
       ↓
   SEITE 2

   und wieder zurück:

   SEITE 2
       ↓
   SPALTE
       ↓
   SEITE 1

========================================================= */


/* =========================================================
   ELEMENTE
========================================================= */

const stage = document.getElementById("stage");

const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

const seamLeft = document.getElementById("seamLeft");
const seamRight = document.getElementById("seamRight");

const shadowLeft = document.getElementById("shadowLeft");
const shadowRight = document.getElementById("shadowRight");

const stateLabel = document.getElementById("state-label");


/* =========================================================
   ZUSTAND
========================================================= */

/*
   state = 0
   Seite 1 sichtbar

   state = 1
   Seite 2 sichtbar
*/

let state = 0;


/*
   progress:

   0 = Seite vollständig geschlossen

   1 = Seite vollständig geöffnet
*/

let progress = 0;


/*
   Maximale Breite der Spalte
*/

const MAX_OPENING = 50;


/*
   Geschwindigkeit
*/

const SCROLL_SPEED = 0.0018;


/*
   Touch
*/

let touchStartY = null;


/*
   verhindert zu schnelle Mehrfachauslösung
*/

let lastInputTime = 0;


/* =========================================================
   INITIALISIERUNG
========================================================= */

function init() {

    page1.style.zIndex = "2";
    page2.style.zIndex = "1";

    page1.style.display = "block";
    page2.style.display = "block";

    render();

}

init();


/* =========================================================
   RENDERN
========================================================= */

function render() {

    /*
       Öffnungsbreite.

       Bei progress = 0:

       keine Spalte

       Bei progress = 1:

       50px links
       50px rechts

       = 100px Gesamtöffnung
    */

    const opening = progress * MAX_OPENING;


    /* =====================================================
       AKTIVE SEITE
    ===================================================== */

    const activePage =
        state === 0
            ? page1
            : page2;


    const inactivePage =
        state === 0
            ? page2
            : page1;


    /* =====================================================
       Z-INDEX
    ===================================================== */

    activePage.style.zIndex = "2";
    inactivePage.style.zIndex = "1";


    /* =====================================================
       AKTIVE SEITE SPALTEN
    ===================================================== */

    /*
       Die Seite wird NICHT verschoben.

       Stattdessen wird die Mitte transparent.

       Dadurch kommt die darunterliegende Seite
       durch die Öffnung zum Vorschein.
    */

    const left =
        `calc(50% - ${opening}px)`;

    const right =
        `calc(50% + ${opening}px)`;


    const mask = `
        linear-gradient(
            to right,
            black 0,
            black ${left},
            transparent ${left},
            transparent ${right},
            black ${right},
            black 100%
        )
    `;


    activePage.style.webkitMaskImage = mask;
    activePage.style.maskImage = mask;


    /* =====================================================
       DIE INAKTIVE SEITE
    ===================================================== */

    inactivePage.style.webkitMaskImage = "none";
    inactivePage.style.maskImage = "none";


    /* =====================================================
       SPALTKANTEN
    ===================================================== */

    /*
       GANZ WICHTIG:

       Die Kanten sind nicht mehr dauerhaft bei 50%.

       Sie wandern mit der Öffnung nach außen.

       Dadurch gibt es KEINE blaue Linie mehr,
       die von Anfang an in der Mitte steht.
    */

    if (progress <= 0.001) {

        seamLeft.style.opacity = "0";
        seamRight.style.opacity = "0";

        shadowLeft.style.opacity = "0";
        shadowRight.style.opacity = "0";

    } else {

        /*
           Die Kanten werden langsam sichtbar.
        */

        const edgeOpacity =
            Math.min(1, progress * 5);


        seamLeft.style.opacity =
            edgeOpacity;

        seamRight.style.opacity =
            edgeOpacity;


        /*
           Linke Kante
        */

        seamLeft.style.left =
            `calc(50% - ${opening}px)`;


        /*
           Rechte Kante
        */

        seamRight.style.left =
            `calc(50% + ${opening}px)`;


        /*
           Schatten
        */

        shadowLeft.style.left =
            `calc(50% - ${opening}px)`;

        shadowRight.style.left =
            `calc(50% + ${opening}px)`;


        shadowLeft.style.opacity =
            edgeOpacity * 0.7;

        shadowRight.style.opacity =
            edgeOpacity * 0.7;

    }


    /* =====================================================
       STATUS-TEXT
    ===================================================== */

    if (state === 0) {

        stateLabel.textContent =
            "gespalten · seite 1";

    } else {

        stateLabel.textContent =
            "gespalten · seite 2";

    }

}


/* =========================================================
   ÜBERGANG ZU ANDERER SEITE
========================================================= */

function switchPage() {

    /*
       Seite wechseln
    */

    state =
        state === 0
            ? 1
            : 0;


    /*
       Nach dem Seitenwechsel beginnt die neue Seite
       wieder geschlossen.

       Dadurch entsteht:

       Seite 1
          →
       Spalte
          →
       Seite 2
          →
       Spalte
          →
       Seite 1
    */

    progress = 0;


    render();

}


/* =========================================================
   SCROLL
========================================================= */

function handleScroll(delta) {

    const now = Date.now();

    /*
       Kleine Eingaben zusammenfassen,
       damit Trackpads nicht zu hektisch reagieren.
    */

    if (now - lastInputTime < 8) {
        return;
    }

    lastInputTime = now;


    /*
       Normale Scrollrichtung:

       runter  = vorwärts
       hoch    = rückwärts
    */

    const movement =
        delta * SCROLL_SPEED;


    progress += movement;


    /* =====================================================
       VORWÄRTS BIS ZUR NÄCHSTEN SEITE
    ===================================================== */

    if (progress >= 1) {

        progress = 1;

        render();

        /*
           kurze Verzögerung, damit die vollständig
           geöffnete Spalte sichtbar bleibt
        */

        setTimeout(() => {

            /*
               Nur wechseln, wenn wir tatsächlich
               noch am Ende sind.
            */

            if (progress >= 1) {

                switchPage();

            }

        }, 120);

        return;
    }


    /* =====================================================
       RÜCKWÄRTS
    ===================================================== */

    if (progress <= 0) {

        /*
           Wenn wir bereits am Anfang der aktuellen
           Seite stehen, wird bei weiterem Hochscrollen
           die vorherige Seite geöffnet.
        */

        if (state === 1) {

            state = 0;

            progress = 1;

        } else {

            /*
               Seite 1 ist Anfang des Zyklus.
               Wir bleiben dort.
            */

            progress = 0;

        }

    }


    render();

}


/* =========================================================
   MAUS / TRACKPAD
========================================================= */

window.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        handleScroll(event.deltaY);

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH
========================================================= */

window.addEventListener(
    "touchstart",
    function(event) {

        if (!event.touches.length) {
            return;
        }

        touchStartY =
            event.touches[0].clientY;

    },
    {
        passive: true
    }
);


window.addEventListener(
    "touchmove",
    function(event) {

        if (
            touchStartY === null ||
            !event.touches.length
        ) {
            return;
        }

        const currentY =
            event.touches[0].clientY;

        const delta =
            touchStartY - currentY;


        if (Math.abs(delta) < 2) {
            return;
        }


        handleScroll(delta);


        touchStartY = currentY;


        event.preventDefault();

    },
    {
        passive: false
    }
);


window.addEventListener(
    "touchend",
    function() {

        touchStartY = null;

    },
    {
        passive: true
    }
);


/* =========================================================
   TASTATUR
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        /*
           Pfeil nach unten / PageDown / Leertaste
           = vorwärts
        */

        if (
            event.key === "ArrowDown" ||
            event.key === "PageDown" ||
            event.key === " "
        ) {

            event.preventDefault();

            handleScroll(120);

            return;
        }


        /*
           Pfeil nach oben / PageUp
           = rückwärts
        */

        if (
            event.key === "ArrowUp" ||
            event.key === "PageUp"
        ) {

            event.preventDefault();

            handleScroll(-120);

            return;
        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        render();

    }
);

</script>

</body>
</html>
