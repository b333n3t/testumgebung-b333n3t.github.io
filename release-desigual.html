  <script>
    /* =========================================================
       WELTWEITE RELEASE-TIMELINE + SVG MAP
       ========================================================= */
    (function () {
      const RELEASE_YEAR = 2026;
      const RELEASE_MONTH = 6;
      const RELEASE_DAY = 31;

      const COUNTRIES = [
        { name: "Kiribati",        code: "KI", offset: 14 },
        { name: "Tonga",           code: "TO", offset: 13 },
        { name: "Samoa",           code: "WS", offset: 13 },
        { name: "New Zealand",     code: "NZ", offset: 12 },
        { name: "Australia",       code: "AU", offset: 10 },
        { name: "Japan",           code: "JP", offset: 9 },
        { name: "South Korea",     code: "KR", offset: 9 },
        { name: "Singapore",       code: "SG", offset: 8 },
        { name: "India",           code: "IN", offset: 5.5 },
        { name: "UAE",             code: "AE", offset: 4 },
        { name: "Germany",         code: "DE", offset: 2 },
        { name: "Switzerland",     code: "CH", offset: 2 },
        { name: "United Kingdom",  code: "GB", offset: 1 },
        { name: "New York",        code: "US", offset: -4 },
        { name: "Los Angeles",     code: "US", offset: -7 },
        { name: "Hawaii",          code: "US", offset: -10 }
      ];

      const ZONE_WEIGHTS = {
        "14": 1,
        "13": 5,
        "12": 8,
        "11": 7,
        "10": 6,
        "9": 6,
        "8": 12,
        "7": 8,
        "6.5": 1,
        "6": 5,
        "5.75": 1,
        "5.5": 2,
        "5": 7,
        "4.5": 1,
        "4": 9,
        "3.5": 1,
        "3": 24,
        "2": 37,
        "1": 30,
        "0": 12,
        "-1": 3,
        "-2": 2,
        "-3": 10,
        "-3.5": 1,
        "-4": 19,
        "-5": 10,
        "-6": 9,
        "-7": 6,
        "-8": 3,
        "-9": 1,
        "-9.5": 1,
        "-10": 2,
        "-11": 1
      };

      const TOTAL_COUNTRIES = 251;

      function releaseInstant(offsetHours) {
        return Date.UTC(RELEASE_YEAR, RELEASE_MONTH, RELEASE_DAY, 0, 0, 0) - offsetHours * 3600 * 1000;
      }

      const countEl = document.getElementById("released-count");
      const listEl = document.getElementById("timeline-list");
      const mapNowEl = document.getElementById("map-now");

      if (!countEl || !listEl) return;

      function formatCountdown(ms) {
        const seconds = Math.max(0, Math.floor(ms / 1000));
        const days = Math.floor(seconds / (3600 * 24));
        const hours = Math.floor((seconds % (3600 * 24)) / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;

        const hh = String(hours).padStart(2, "0");
        const mm = String(mins).padStart(2, "0");
        const ss = String(secs).padStart(2, "0");

        return days > 0
          ? days + "d " + hh + ":" + mm + ":" + ss
          : hh + ":" + mm + ":" + ss;
      }

      function formatSwissTime(timestamp) {
        const date = new Date(timestamp);

        return new Intl.DateTimeFormat("de-CH", {
          timeZone: "Europe/Zurich",
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function formatSwissTimeFull(timestamp) {
        const date = new Date(timestamp);

        return new Intl.DateTimeFormat("de-CH", {
          timeZone: "Europe/Zurich",
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }).format(date);
      }

      function formatOnlineSince(ms) {
        const totalMinutes = Math.max(0, Math.floor(ms / 60000));
        const days = Math.floor(totalMinutes / (60 * 24));
        const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
        const minutes = totalMinutes % 60;

        if (days > 0) {
          return "seit " + days + "d " + hours + "h " + minutes + "min";
        }

        if (hours > 0) {
          return "seit " + hours + "h " + minutes + "min";
        }

        return "seit " + minutes + "min";
      }

      function updateMap(now) {
        const zones = Array.from(document.querySelectorAll(".map-tz"));

        zones.forEach(function (zone) {
          const offset = parseFloat(zone.dataset.offset);
          const instant = releaseInstant(offset);

          zone.classList.remove("is-live", "is-next");

          if (instant <= now) {
            zone.classList.add("is-live");
          }
        });

        const nextZone = zones.find(function (zone) {
          const offset = parseFloat(zone.dataset.offset);
          return releaseInstant(offset) > now;
        });

        if (nextZone) {
          nextZone.classList.add("is-next");
        }

        if (mapNowEl) {
          mapNowEl.textContent = "Swiss time " + formatSwissTimeFull(now);
        }
      }

      function render() {
        const now = Date.now();

        let releasedTotal = 0;

        for (const key in ZONE_WEIGHTS) {
          if (releaseInstant(parseFloat(key)) <= now) {
            releasedTotal += ZONE_WEIGHTS[key];
          }
        }

        releasedTotal = Math.min(releasedTotal, TOTAL_COUNTRIES);
        countEl.textContent = String(releasedTotal).padStart(3, "0");

        updateMap(now);

        const rows = COUNTRIES.map(c => ({
          ...c,
          instant: releaseInstant(c.offset),
          isLive: releaseInstant(c.offset) <= now
        }));

        const nextIndex = rows.findIndex(r => !r.isLive);

        listEl.innerHTML = "";

        rows.forEach((r, i) => {
          const row = document.createElement("div");
          let statusHtml;
          let rowClass;

          const swissTime = formatSwissTime(r.instant);

          if (r.isLive) {
            statusHtml =
              '<span class="status-dot">🟢</span>' +
              '<span class="country-code">' + r.code + '</span>' +
              '<span class="country-name">' + r.name + '</span>' +
              '<span class="release-time">' + swissTime + '</span>' +
              '<span class="status-text">LIVE</span>' +
              '<span class="online-since">' + formatOnlineSince(now - r.instant) + '</span>';

            rowClass = "is-live";
          } else if (i === nextIndex) {
            statusHtml =
              '<span class="status-dot">▶</span>' +
              '<span class="country-code">' + r.code + '</span>' +
              '<span class="country-name">' + r.name + '</span>' +
              '<span class="release-time">' + swissTime + '</span>' +
              '<span class="status-text">in ' + formatCountdown(r.instant - now) + '</span>' +
              '<span class="online-since"></span>';

            rowClass = "is-next";
          } else {
            statusHtml =
              '<span class="status-dot">○</span>' +
              '<span class="country-code">' + r.code + '</span>' +
              '<span class="country-name">' + r.name + '</span>' +
              '<span class="release-time">' + swissTime + '</span>' +
              '<span class="status-text"></span>' +
              '<span class="online-since"></span>';

            rowClass = "is-upcoming";
          }

          row.className = "timeline-row " + rowClass;
          row.innerHTML = statusHtml;
          listEl.appendChild(row);
        });
      }

      render();
      setInterval(render, 1000);
    })();
  </script>

  <script>
    (function () {
      const cross = document.getElementById("crosshair");
      const lineX = cross?.querySelector(".line-x");
      const lineY = cross?.querySelector(".line-y");

      if (!cross || !lineX || !lineY) return;

      if (!window.matchMedia("(pointer: fine)").matches) {
        cross.style.display = "none";
        return;
      }

      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        cross.style.display = "none";
        return;
      }

      let x = -9999;
      let y = -9999;
      let raf = null;

      function render() {
        lineX.style.top = y + "px";
        lineY.style.left = x + "px";
        raf = null;
      }

      window.addEventListener("mousemove", function (e) {
        x = e.clientX;
        y = e.clientY;

        if (!raf) {
          raf = requestAnimationFrame(render);
        }
      }, { passive: true });

      window.addEventListener("mouseleave", function () {
        x = -9999;
        y = -9999;
        render();
      });
    })();
  </script>
