  <!-- COUNTDOWN -->

  <script>

    (() => {

      const targetDate =
        new Date("2026-03-06T00:00:00+01:00").getTime();

      const el =
        document.getElementById("awb-countdown-timer");

      if(!el) return;

      function updateCountdown(){

        const now = Date.now();

        const diff = targetDate - now;

        if(diff <= 0){

          el.textContent = "OUT NOW";

          clearInterval(timer);

          return;
        }

        const seconds = Math.floor(diff / 1000);

        const days =
          Math.floor(seconds / (3600 * 24));

        const hours =
          Math.floor((seconds % (3600 * 24)) / 3600);

        const mins =
          Math.floor((seconds % 3600) / 60);

        const secs = seconds % 60;

        const hh =
          String(hours).padStart(2, "0");

        const mm =
          String(mins).padStart(2, "0");

        const ss =
          String(secs).padStart(2, "0");

        el.textContent =
          days > 0
          ? `${days}d ${hh}:${mm}:${ss}`
          : `${hh}:${mm}:${ss}`;
      }

      updateCountdown();

      const timer =
        setInterval(updateCountdown, 1000);

    })();

  </script>

  <!-- CROSSHAIR SCRIPT -->

  <script>

    (() => {

      const cross =
        document.getElementById('crosshair');

      const lineX =
        cross?.querySelector('.line-x');

      const lineY =
        cross?.querySelector('.line-y');

      if(!cross || !lineX || !lineY) return;

      let x = -9999;
      let y = -9999;

      let raf = null;

      function render(){

        lineX.style.top = y + 'px';

        lineY.style.left = x + 'px';

        raf = null;
      }

      window.addEventListener('mousemove', (e) => {

        x = e.clientX;

        y = e.clientY;

        if(!raf){

          raf = requestAnimationFrame(render);
        }

      }, { passive:true });

    })();

  </script>

  <!-- WEBGL SPACE -->

  <script>

    (() => {

      const audio =
        document.getElementById('release-audio');

      if(!audio) return;

      const renderer =
        new THREE.WebGLRenderer({
          alpha:true,
          antialias:true
        });

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.domElement.id = 'webgl-space';

      document.body.prepend(renderer.domElement);

      const scene = new THREE.Scene();

      const camera =
        new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          3000
        );

      camera.position.z = 500;

      /* AUDIO */

      const audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      const source =
        audioCtx.createMediaElementSource(audio);

      const analyser =
        audioCtx.createAnalyser();

      analyser.fftSize = 256;

      source.connect(analyser);

      analyser.connect(audioCtx.destination);

      const bufferLength =
        analyser.frequencyBinCount;

      const dataArray =
        new Uint8Array(bufferLength);

      function getAudioLevel(){

        analyser.getByteFrequencyData(dataArray);

        let sum = 0;

        for(let i = 0; i < bufferLength; i++){

          sum += dataArray[i];
        }

        return sum / bufferLength / 255;
      }

      /* STARS */

      const geometry =
        new THREE.BufferGeometry();

      const starCount = 5000;

      const positions =
        new Float32Array(starCount * 3);

      for(let i = 0; i < starCount * 3; i++){

        positions[i] =
          (Math.random() - 0.5) * 2500;
      }

      geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
      );

/* ROUND STAR TEXTURE */

const starCanvas = document.createElement('canvas');

starCanvas.width = 64;
starCanvas.height = 64;

const starCtx = starCanvas.getContext('2d');

const gradient = starCtx.createRadialGradient(
  32, 32, 0,
  32, 32, 32
);

gradient.addColorStop(0, 'rgba(255,255,255,1)');
gradient.addColorStop(0.2, 'rgba(255,255,255,1)');
gradient.addColorStop(0.45, 'rgba(255,255,255,0.6)');
gradient.addColorStop(1, 'rgba(255,255,255,0)');

starCtx.fillStyle = gradient;

starCtx.beginPath();

starCtx.arc(32, 32, 32, 0, Math.PI * 2);

starCtx.fill();

const starTexture =
  new THREE.CanvasTexture(starCanvas);

/* MATERIAL */

const material =
  new THREE.PointsMaterial({

    map: starTexture,

    color:0xffffff,

    size:2.8,

    transparent:true,

    opacity:0.9,

    blending:THREE.AdditiveBlending,

    depthWrite:false,

    alphaTest:0.01
  });


      const stars =
        new THREE.Points(
          geometry,
          material
        );

      scene.add(stars);

      /* DROP MODE */

      let dropMode = false;

      window.addEventListener('keydown', (e) => {

        if(e.key.toLowerCase() === 'd'){

          dropMode = !dropMode;

          document.body.classList.toggle(
            'drop-mode-active',
            dropMode
          );
        }

      });

      /* PARALLAX */

      let mouseX = 0;
      let mouseY = 0;

      window.addEventListener('mousemove', (e) => {

        mouseX =
          (e.clientX / window.innerWidth - 0.5);

        mouseY =
          (e.clientY / window.innerHeight - 0.5);

      });

      /* RESIZE */

      window.addEventListener('resize', () => {

        camera.aspect =
          window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      });

      /* ANIMATION */

      let animationId;

      let running = false;

      function animate(){

        const audioLevel =
          getAudioLevel();

        camera.position.x +=
          ((mouseX * 40) - camera.position.x) * 0.02;

        camera.position.y +=
          ((-mouseY * 40) - camera.position.y) * 0.02;

        camera.lookAt(scene.position);

        stars.rotation.y +=
          dropMode
          ? 0.002 + audioLevel * 0.03
          : 0.0007 + audioLevel * 0.01;

        stars.rotation.x += 0.00015;

        material.size =
          dropMode
          ? 3 + audioLevel * 10
          : 2 + audioLevel * 4;

        material.opacity =
          dropMode
          ? 0.9
          : 0.7;

        renderer.render(scene, camera);

        animationId =
          requestAnimationFrame(animate);
      }

      /* START / STOP */

      async function startSpace(){

        if(running) return;

        running = true;

        await audioCtx.resume();

        renderer.domElement.style.opacity = '1';

        animate();
      }

      function stopSpace(){

        running = false;

        cancelAnimationFrame(animationId);

        renderer.domElement.style.opacity = '0';
      }

      audio.addEventListener('play', startSpace);

      audio.addEventListener('pause', stopSpace);

      audio.addEventListener('ended', stopSpace);

    })();

  </script>
