<!-- WEBGL -->
<script>
(() => {

const audio = document.getElementById("release-audio");

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 2000
);

camera.position.z = 500;

const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.domElement.id = "webgl-space";
document.body.prepend(renderer.domElement);

/* =========================
   AUDIO ANALYSER
========================= */

const ctx = new AudioContext();
const source = ctx.createMediaElementSource(audio);
const analyser = ctx.createAnalyser();

analyser.fftSize = 256;

source.connect(analyser);
analyser.connect(ctx.destination);

const data = new Uint8Array(analyser.frequencyBinCount);

function audioLevel(){
analyser.getByteFrequencyData(data);
return data.reduce((a,b)=>a+b,0)/data.length/255;
}

/* =========================
   STARS (PIXEL SQUARES)
========================= */

const geo = new THREE.BufferGeometry();
const count = 4000;

const pos = new Float32Array(count*3);

for(let i=0;i<count*3;i++){
pos[i]=(Math.random()-0.5)*2000;
}

geo.setAttribute("position", new THREE.BufferAttribute(pos,3));

const mat = new THREE.PointsMaterial({
color:0xffffff,
size:3,
transparent:true,
opacity:0.8
});

const stars = new THREE.Points(geo,mat);
scene.add(stars);

/* =========================
   GALAXY ROTATION
========================= */

const galaxyGeo = new THREE.BufferGeometry();
const gCount = 2500;
const gPos = new Float32Array(gCount*3);

for(let i=0;i<gCount;i++){
const i3=i*3;
const r=Math.random()*600;
const a=(i%4)*(Math.PI*2/4);
gPos[i3]=Math.cos(a)*r;
gPos[i3+1]=(Math.random()-0.5)*80;
gPos[i3+2]=Math.sin(a)*r;
}

galaxyGeo.setAttribute("position",new THREE.BufferAttribute(gPos,3));

const galaxy = new THREE.Points(
galaxyGeo,
new THREE.PointsMaterial({
color:0x88cfff,
size:2,
transparent:true,
opacity:0.2
})
);

scene.add(galaxy);

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

/* =========================
   ANIMATION
========================= */

let running=false;
let frame;

function animate(){

const lvl = audioLevel();

/* stars */
stars.rotation.y += 0.001 + lvl*0.01;
mat.size = 2 + lvl*4;

/* galaxy */
galaxy.rotation.y += 0.0005;
galaxy.scale.setScalar(1 + lvl*0.1);

renderer.render(scene,camera);

frame=requestAnimationFrame(animate);
}

/* =========================
   START / STOP
========================= */

async function start(){
if(running) return;
running=true;
await ctx.resume();
renderer.domElement.style.opacity=1;
animate();
}

function stop(){
running=false;
cancelAnimationFrame(frame);
renderer.domElement.style.opacity=0;
}

audio.addEventListener("play",start);
audio.addEventListener("pause",stop);
audio.addEventListener("ended",stop);

})();
</script>

</body>
