<!-- =========================================================
     WEBGL FIXED SYSTEM (ONLY ADDITION)
========================================================= -->

<script>
(() => {

const audio = document.getElementById("release-audio");

/* ===================== THREE SETUP ===================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 3000
);

camera.position.z = 600;

const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });

renderer.setSize(window.innerWidth, window.innerHeight);

renderer.domElement.id = "webgl-space";

document.body.prepend(renderer.domElement);

/* ===================== AUDIO ===================== */

const ctx = new (window.AudioContext || window.webkitAudioContext)();

const source = ctx.createMediaElementSource(audio);

const analyser = ctx.createAnalyser();

analyser.fftSize = 256;

source.connect(analyser);
analyser.connect(ctx.destination);

const data = new Uint8Array(analyser.frequencyBinCount);

function level(){
analyser.getByteFrequencyData(data);
return data.reduce((a,b)=>a+b,0)/data.length/255;
}

/* ===================== STARS ===================== */

const geo = new THREE.BufferGeometry();

const count = 5000;

const pos = new Float32Array(count*3);

for(let i=0;i<count*3;i++){
pos[i]=(Math.random()-0.5)*2000;
}

geo.setAttribute("position", new THREE.BufferAttribute(pos,3));

const mat = new THREE.PointsMaterial({
color:0xffffff,
size:2,
transparent:true,
opacity:0.8
});

const stars = new THREE.Points(geo,mat);
scene.add(stars);

/* ===================== GALAXY ===================== */

const gGeo = new THREE.BufferGeometry();

const gCount = 2500;

const gPos = new Float32Array(gCount*3);

for(let i=0;i<gCount;i++){

const i3=i*3;
const r=Math.random()*700;
const a=(i%4)*(Math.PI*2/4);

gPos[i3]=Math.cos(a)*r;
gPos[i3+1]=(Math.random()-0.5)*80;
gPos[i3+2]=Math.sin(a)*r;

}

gGeo.setAttribute("position", new THREE.BufferAttribute(gPos,3));

const galaxy = new THREE.Points(
gGeo,
new THREE.PointsMaterial({
color:0x8fc8ff,
size:2,
transparent:true,
opacity:0.15
})
);

scene.add(galaxy);

/* ===================== RESIZE ===================== */

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);

});

/* ===================== ANIMATION ===================== */

let running=false;
let frame;

function animate(){

const l = level();

/* stars */
stars.rotation.y += 0.001 + l*0.01;
mat.size = 2 + l*4;

/* galaxy */
galaxy.rotation.y += 0.0005;
galaxy.scale.setScalar(1 + l*0.08);

renderer.render(scene,camera);

frame=requestAnimationFrame(animate);

}

/* ===================== START / STOP ===================== */

async function start(){

if(running) return;
running=true;

await ctx.resume();

renderer.domElement.style.opacity=1;

animate();

}

function stop(){

running=false;

cancelAnimationFrame(frame);

renderer.domElement.style.opacity=0;

}

audio.addEventListener("play",start);
audio.addEventListener("pause",stop);
audio.addEventListener("ended",stop);

})();
</script>
