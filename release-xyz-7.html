<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>b3nn3t „¾“</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  background:#587fa6;
  font-family:system-ui;
  color:white;
}

#webgl{
  position:fixed;
  inset:0;
  z-index:0;
}

.page{
  position:relative;
  z-index:2;
  max-width:900px;
  margin:auto;
  padding:60px 20px;
}

audio{
  width:100%;
  margin-top:20px;
}
</style>
</head>

<body>

<canvas id="webgl"></canvas>

<div class="page">
  <h1>b3nn3t „¾“</h1>

  <audio id="audio" controls preload="metadata">
    <source src="/assets/release/3-4/drei-viertel.prelisten.mp3">
  </audio>
</div>

<script>

(() => {

  /* =========================
     BASIC SETUP
  ========================= */

  const canvas = document.getElementById("webgl");

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth/window.innerHeight,
    0.1,
    2000
  );

  camera.position.z = 600;

  /* =========================
     AUDIO (SAFE INIT)
  ========================= */

  const audio = document.getElementById("audio");

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaElementSource(audio);
  const analyser = audioCtx.createAnalyser();

  analyser.fftSize = 256;

  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  const freq = new Uint8Array(analyser.frequencyBinCount);

  function getBass(){

    analyser.getByteFrequencyData(freq);

    let v = 0;

    for(let i=0;i<8;i++){
      v += freq[i];
    }

    return v / 8 / 255;
  }

  /* =========================
     STAR TEXTURE (SOFT GLOW)
  ========================= */

  function createTexture(){

    const c = document.createElement("canvas");
    c.width = 64;
    c.height = 64;

    const ctx = c.getContext("2d");

    const g = ctx.createRadialGradient(32,32,0,32,32,32);

    g.addColorStop(0,"rgba(255,255,255,1)");
    g.addColorStop(0.25,"rgba(180,220,255,0.8)");
    g.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = g;
    ctx.fillRect(0,0,64,64);

    return new THREE.CanvasTexture(c);
  }

  const starTex = createTexture();

  /* =========================
     STARS
  ========================= */

  const starGeo = new THREE.BufferGeometry();

  const starCount = 5000;

  const pos = new Float32Array(starCount*3);

  for(let i=0;i<pos.length;i++){
    pos[i] = (Math.random()-0.5)*2000;
  }

  starGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));

  const starMat = new THREE.PointsMaterial({
    map: starTex,
    size:5,
    transparent:true,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  /* =========================
     NEBULA
  ========================= */

  const nebGeo = new THREE.BufferGeometry();

  const nebCount = 1200;
  const npos = new Float32Array(nebCount*3);

  for(let i=0;i<npos.length;i++){
    npos[i] = (Math.random()-0.5)*1500;
  }

  nebGeo.setAttribute("position", new THREE.BufferAttribute(npos,3));

  const nebMat = new THREE.PointsMaterial({
    color:0x7fbfff,
    size:18,
    transparent:true,
    opacity:0.08,
    blending:THREE.AdditiveBlending
  });

  const nebula = new THREE.Points(nebGeo,nebMat);
  scene.add(nebula);

  /* =========================
     PARALLAX
  ========================= */

  let mx = 0;
  let my = 0;

  window.addEventListener("mousemove",(e)=>{

    mx = e.clientX/window.innerWidth - 0.5;
    my = e.clientY/window.innerHeight - 0.5;

  });

  /* =========================
     RESIZE
  ========================= */

  window.addEventListener("resize",()=>{

    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth,window.innerHeight);

  });

  /* =========================
     ANIMATION
  ========================= */

  let started = false;

  function animate(){

    const bass = getBass();

    camera.position.x += ((mx*80)-camera.position.x)*0.03;
    camera.position.y += ((-my*80)-camera.position.y)*0.03;

    stars.rotation.y += 0.0005 + bass*0.01;
    nebula.rotation.y += 0.0002;

    starMat.size = 4 + bass*14;
    nebMat.opacity = 0.06 + bass*0.18;

    renderer.render(scene,camera);

    requestAnimationFrame(animate);
  }

  function start(){

    if(started) return;

    started = true;

    audioCtx.resume();

    animate();
  }

  audio.addEventListener("play",start);

})();

</script>

</body>
</html>
