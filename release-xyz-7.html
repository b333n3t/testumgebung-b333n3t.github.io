
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>b3nn3t „¾“</title>

<link rel="icon" href="/favicon.ico" />

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>

html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow-x:hidden;
  background:#587fa6;
  font-family:system-ui;
  color:white;
}

#webgl{
  position:fixed;
  inset:0;
  z-index:0;
}

.page{
  position:relative;
  z-index:2;
  max-width:900px;
  margin:auto;
  padding:60px 20px;
}

.audio{
  width:100%;
  margin-top:30px;
}

</style>
</head>

<body>

<canvas id="webgl"></canvas>

<div class="page">

  <h1>b3nn3t „¾“</h1>

  <audio id="audio" class="audio" controls>
    <source src="/assets/release/3-4/drei-viertel.prelisten.mp3">
  </audio>

</div>

<script>

(() => {

  const canvas = document.getElementById("webgl");

  const renderer = new THREE.WebGLRenderer({
    canvas,
    alpha:true,
    antialias:true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth/window.innerHeight,
    0.1,
    2000
  );

  camera.position.z = 600;

  /* ======================
     AUDIO SETUP
  ====================== */

  const audio = document.getElementById("audio");

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const source = ctx.createMediaElementSource(audio);
  const analyser = ctx.createAnalyser();

  analyser.fftSize = 256;

  source.connect(analyser);
  analyser.connect(ctx.destination);

  const data = new Uint8Array(analyser.frequencyBinCount);

  function bass(){
    analyser.getByteFrequencyData(data);

    let v = 0;
    for(let i=0;i<8;i++){
      v += data[i];
    }

    return v/8/255;
  }

  /* ======================
     STARS (GLOW)
  ====================== */

  const starGeo = new THREE.BufferGeometry();
  const count = 6000;

  const pos = new Float32Array(count*3);

  for(let i=0;i<pos.length;i++){
    pos[i] = (Math.random()-0.5)*2000;
  }

  starGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));

  const tex = (()=>{

    const c = document.createElement("canvas");
    c.width = 64;
    c.height = 64;

    const g = c.getContext("2d")
      .createRadialGradient(32,32,0,32,32,32);

    const ctx2 = c.getContext("2d");

    g.addColorStop(0,"white");
    g.addColorStop(0.2,"rgba(180,220,255,0.8)");
    g.addColorStop(1,"transparent");

    ctx2.fillStyle = g;
    ctx2.fillRect(0,0,64,64);

    return new THREE.CanvasTexture(c);

  })();

  const starMat = new THREE.PointsMaterial({
    map:tex,
    size:5,
    transparent:true,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  const stars = new THREE.Points(starGeo,starMat);
  scene.add(stars);

  /* ======================
     NEBULA
  ====================== */

  const nebGeo = new THREE.BufferGeometry();

  const nebCount = 1500;
  const npos = new Float32Array(nebCount*3);

  for(let i=0;i<npos.length;i++){
    npos[i] = (Math.random()-0.5)*1500;
  }

  nebGeo.setAttribute("position", new THREE.BufferAttribute(npos,3));

  const nebMat = new THREE.PointsMaterial({
    color:0x7fbfff,
    size:20,
    transparent:true,
    opacity:0.08,
    blending:THREE.AdditiveBlending
  });

  const nebula = new THREE.Points(nebGeo,nebMat);
  scene.add(nebula);

  /* ======================
     PARALLAX
  ====================== */

  let mx=0,my=0;

  window.addEventListener("mousemove",(e)=>{
    mx = e.clientX/window.innerWidth - 0.5;
    my = e.clientY/window.innerHeight - 0.5;
  });

  /* ======================
     RESIZE
  ====================== */

  window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });

  /* ======================
     LOOP
  ====================== */

  let run = false;

  function animate(){

    const b = bass();

    camera.position.x += ((mx*80)-camera.position.x)*0.03;
    camera.position.y += ((-my*80)-camera.position.y)*0.03;

    stars.rotation.y += 0.0005 + b*0.01;
    nebula.rotation.y += 0.0002;

    starMat.size = 4 + b*12;
    nebMat.opacity = 0.06 + b*0.2;

    renderer.render(scene,camera);

    requestAnimationFrame(animate);
  }

  function start(){

    if(run) return;
    run = true;

    ctx.resume();

    animate();
  }

  audio.addEventListener("play",start);

})();

</script>

</body>
</html>
