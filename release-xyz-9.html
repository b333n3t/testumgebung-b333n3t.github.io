  <!-- COUNTDOWN -->

  <script>

    (() => {

      const targetDate =
        new Date("2026-03-06T00:00:00+01:00").getTime();

      const el =
        document.getElementById("awb-countdown-timer");

      if(!el) return;

      function updateCountdown(){

        const now = Date.now();

        const diff = targetDate - now;

        if(diff <= 0){

          el.textContent = "OUT NOW";

          clearInterval(timer);

          return;
        }

        const seconds = Math.floor(diff / 1000);

        const days =
          Math.floor(seconds / (3600 * 24));

        const hours =
          Math.floor((seconds % (3600 * 24)) / 3600);

        const mins =
          Math.floor((seconds % 3600) / 60);

        const secs = seconds % 60;

        const hh =
          String(hours).padStart(2, "0");

        const mm =
          String(mins).padStart(2, "0");

        const ss =
          String(secs).padStart(2, "0");

        el.textContent =
          days > 0
          ? `${days}d ${hh}:${mm}:${ss}`
          : `${hh}:${mm}:${ss}`;
      }

      updateCountdown();

      const timer =
        setInterval(updateCountdown, 1000);

    })();

  </script>

  <!-- CROSSHAIR SCRIPT -->

  <script>

    (() => {

      const cross =
        document.getElementById('crosshair');

      const lineX =
        cross?.querySelector('.line-x');

      const lineY =
        cross?.querySelector('.line-y');

      if(!cross || !lineX || !lineY) return;

      if(!window.matchMedia('(pointer:fine)').matches){

        cross.style.display = 'none';

        return;
      }

      let x = -9999;
      let y = -9999;

      let raf = null;

      function render(){

        lineX.style.top = y + 'px';

        lineY.style.left = x + 'px';

        raf = null;
      }

      window.addEventListener('mousemove', (e) => {

        x = e.clientX;

        y = e.clientY;

        if(!raf){

          raf = requestAnimationFrame(render);
        }

      }, { passive:true });

    })();

  </script>

  <!-- WEBGL SPACE -->

  <script>

    (() => {

      const audio =
        document.getElementById('release-audio');

      if(!audio) return;

      /* =====================================================
         RENDERER
         ===================================================== */

      const renderer =
        new THREE.WebGLRenderer({
          alpha:true,
          antialias:true
        });

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.domElement.id = 'webgl-space';

      document.body.prepend(renderer.domElement);

      const scene = new THREE.Scene();

      const camera =
        new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          3000
        );

      camera.position.z = 500;

      /* =====================================================
         AUDIO
         ===================================================== */

      const audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      const source =
        audioCtx.createMediaElementSource(audio);

      const analyser =
        audioCtx.createAnalyser();

      analyser.fftSize = 256;

      source.connect(analyser);

      analyser.connect(audioCtx.destination);

      const bufferLength =
        analyser.frequencyBinCount;

      const dataArray =
        new Uint8Array(bufferLength);

      function getAudioLevel(){

        analyser.getByteFrequencyData(dataArray);

        let sum = 0;

        for(let i = 0; i < bufferLength; i++){

          sum += dataArray[i];
        }

        return sum / bufferLength / 255;
      }

      /* =====================================================
         STARS
         ===================================================== */

      const starGeometry =
        new THREE.BufferGeometry();

      const starCount = 5000;

      const positions =
        new Float32Array(starCount * 3);

      for(let i = 0; i < starCount * 3; i++){

        positions[i] =
          (Math.random() - 0.5) * 2500;
      }

      starGeometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
      );

      const starMaterial =
        new THREE.PointsMaterial({
          color:0xbfe3ff,
          size:2,
          transparent:true,
          opacity:0.85,
          blending:THREE.AdditiveBlending,
          depthWrite:false
        });

      const stars =
        new THREE.Points(
          starGeometry,
          starMaterial
        );

      scene.add(stars);

      /* =====================================================
         GALAXY
         ===================================================== */

      const galaxyGeometry =
        new THREE.BufferGeometry();

      const galaxyCount = 2500;

      const galaxyPositions =
        new Float32Array(galaxyCount * 3);

      for(let i = 0; i < galaxyCount; i++){

        const i3 = i * 3;

        const radius =
          Math.random() * 700;

        const spin =
          radius * 0.008;

        const branchAngle =
          (i % 4) *
          (Math.PI * 2 / 4);

        galaxyPositions[i3] =
          Math.cos(branchAngle + spin) * radius;

        galaxyPositions[i3 + 1] =
          (Math.random() - 0.5) * 80;

        galaxyPositions[i3 + 2] =
          Math.sin(branchAngle + spin) * radius;
      }

      galaxyGeometry.setAttribute(
        'position',
        new THREE.BufferAttribute(
          galaxyPositions,
          3
        )
      );

      const galaxyMaterial =
        new THREE.PointsMaterial({
          color:0x6fb8ff,
          size:3,
          transparent:true,
          opacity:0.18,
          blending:THREE.AdditiveBlending,
          depthWrite:false
        });

      const galaxy =
        new THREE.Points(
          galaxyGeometry,
          galaxyMaterial
        );

      scene.add(galaxy);

      /* =====================================================
         SHOOTING STARS
         ===================================================== */

      const shootingStars = [];

      function createShootingStar(){

        const geometry =
          new THREE.BufferGeometry();

        const vertices =
          new Float32Array([
            0,0,0,
            -50,0,0
          ]);

        geometry.setAttribute(
          'position',
          new THREE.BufferAttribute(vertices, 3)
        );

        const material =
          new THREE.LineBasicMaterial({
            color:0xffffff,
            transparent:true,
            opacity:0.9
          });

        const line =
          new THREE.Line(
            geometry,
            material
          );

        line.position.x =
          (Math.random() - 0.5) * 1200;

        line.position.y =
          Math.random() * 600;

        line.position.z =
          (Math.random() - 0.5) * 1000;

        line.rotation.z =
          -Math.PI / 4;

        scene.add(line);

        shootingStars.push({
          mesh:line,
          speed:10 + Math.random() * 12
        });
      }

      for(let i = 0; i < 12; i++){

        createShootingStar();
      }

      /* =====================================================
         PARALLAX
         ===================================================== */

      let mouseX = 0;
      let mouseY = 0;

      window.addEventListener('mousemove', (e) => {

        mouseX =
          (e.clientX / window.innerWidth - 0.5);

        mouseY =
          (e.clientY / window.innerHeight - 0.5);

      });

      /* =====================================================
         RESIZE
         ===================================================== */

      window.addEventListener('resize', () => {

        camera.aspect =
          window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      });

      /* =====================================================
         ANIMATION
         ===================================================== */

      let animationId;

      let running = false;

      function animate(){

        const audioLevel =
          getAudioLevel();

        /* CAMERA */

        camera.position.x +=
          ((mouseX * 40) - camera.position.x) * 0.02;

        camera.position.y +=
          ((-mouseY * 40) - camera.position.y) * 0.02;

        camera.lookAt(scene.position);

        /* STARS */

        stars.rotation.y +=
          0.0007 + audioLevel * 0.01;

        stars.rotation.x += 0.00015;

        starMaterial.size =
          2 + audioLevel * 4;

        starMaterial.opacity =
          0.8 + audioLevel * 0.25;

        /* GALAXY */

        galaxy.rotation.y += 0.0005;

        galaxy.rotation.z += 0.00008;

        galaxy.scale.setScalar(
          1 + audioLevel * 0.08
        );

        galaxyMaterial.opacity =
          0.16 + audioLevel * 0.2;

        /* SHOOTING STARS */

        for(const s of shootingStars){

          s.mesh.position.x += s.speed;

          s.mesh.position.y -= s.speed * 0.4;

          if(s.mesh.position.x > 900){

            s.mesh.position.x =
              -900 - Math.random() * 500;

            s.mesh.position.y =
              Math.random() * 700;

            s.mesh.position.z =
              (Math.random() - 0.5) * 1000;
          }
        }

        renderer.render(scene, camera);

        animationId =
          requestAnimationFrame(animate);
      }

      /* =====================================================
         START / STOP
         ===================================================== */

      async function startSpace(){

        if(running) return;

        running = true;

        await audioCtx.resume();

        renderer.domElement.style.opacity = '1';

        animate();
      }

      function stopSpace(){

        running = false;

        cancelAnimationFrame(animationId);

        renderer.domElement.style.opacity = '0';
      }

      audio.addEventListener('play', startSpace);

      audio.addEventListener('pause', stopSpace);

      audio.addEventListener('ended', stopSpace);

    })();

  </script>
