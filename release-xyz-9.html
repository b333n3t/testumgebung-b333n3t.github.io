:root{

html,
body{
  margin:0;
  padding:0;
  width:100%;

    radial-gradient(circle at center, #6d8fb2 0%, #587fa6 45%, #314b63 100%);

/* =========================================================
   SPACE LAYERS
   ========================================================= */

#space-wrap{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
  pointer-events:none;
}

#galaxy{
  position:absolute;
  inset:-20%;
  opacity:0;
  transition:opacity 1.2s ease;
  background:
    radial-gradient(circle at center,
      rgba(120,180,255,0.25) 0%,
      rgba(120,180,255,0.08) 18%,
      rgba(0,0,0,0) 50%);
  filter:blur(30px);
  transform-origin:center center;
}

#starfield{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 1s ease;
}

#noise{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 0.5s ease;
  mix-blend-mode:soft-light;
}

.space-active #starfield,
.space-active #galaxy,
.space-active #noise{
  opacity:1;
}

/* =========================================================
   LENS FLARE
   ========================================================= */

#lensflare{
  position:absolute;
  width:600px;
  height:600px;
  border-radius:50%;
  background:
    radial-gradient(circle,
      rgba(120,190,255,0.25) 0%,
      rgba(120,190,255,0.12) 20%,
      rgba(255,255,255,0.04) 35%,
      transparent 70%);
  filter:blur(10px);
  pointer-events:none;
  opacity:0;
  transition:opacity 1s ease;
  transform:translate(-50%,-50%);
}

.space-active #lensflare{
  opacity:1;
}

/* =========================================================
   PAGE
   ========================================================= */

}

}

.release-video{

.audio-overlay{

/* =========================================================

   ========================================================= */

#crosshair{

  inset:0;
  pointer-events:none;

.line-x,
.line-y{

/* =========================================================

<!-- =========================================================
     SPACE ENGINE
     ========================================================= -->

<script>

(() => {

const audio = document.getElementById('release-audio');

const canvas = document.getElementById('starfield');

const noiseCanvas = document.getElementById('noise');

const galaxy = document.getElementById('galaxy');

const flare = document.getElementById('lensflare');

const ctx = canvas.getContext('2d');

const nctx = noiseCanvas.getContext('2d');

let w;
let h;

let animationId;

let running = false;

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let galaxyRotation = 0;

const stars = [];
const particles = [];

function resize(){

  w = canvas.width = noiseCanvas.width = window.innerWidth;

  h = canvas.height = noiseCanvas.height = window.innerHeight;
}

resize();

window.addEventListener('resize', resize);

/* =========================================================
   AUDIO ANALYSER
   ========================================================= */

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const source = audioCtx.createMediaElementSource(audio);

const analyser = audioCtx.createAnalyser();

analyser.fftSize = 256;

source.connect(analyser);

analyser.connect(audioCtx.destination);

const bufferLength = analyser.frequencyBinCount;

const dataArray = new Uint8Array(bufferLength);

function getAudioLevel(){

  analyser.getByteFrequencyData(dataArray);

  let sum = 0;

  for(let i = 0; i < bufferLength; i++){

    sum += dataArray[i];
  }

  return sum / bufferLength / 255;
}

/* =========================================================
   STARS
   ========================================================= */

class Star{

  constructor(){

    this.reset(true);
  }

  reset(initial=false){

    this.x = (Math.random() - 0.5) * w;

    this.y = (Math.random() - 0.5) * h;

    this.z = Math.random() * w;

    this.speed = 6 + Math.random() * 18;

    this.size = 1 + Math.random() * 2;

    if(initial){

      this.z = Math.random() * w;
    }
  }

  update(audioBoost){

    this.z -= this.speed + audioBoost * 25;

    if(this.z <= 1){

      this.reset();

      this.z = w;
    }
  }

  draw(audioBoost){

    const parallaxX = (mouseX - w/2) * 0.015;

    const parallaxY = (mouseY - h/2) * 0.015;

    const px = ((this.x + parallaxX) / this.z) * w + w/2;

    const py = ((this.y + parallaxY) / this.z) * h + h/2;

    const prevZ = this.z + this.speed * 2;

    const ppx = ((this.x + parallaxX) / prevZ) * w + w/2;

    const ppy = ((this.y + parallaxY) / prevZ) * h + h/2;

    const alpha = 1 - this.z / w;

    ctx.beginPath();

    ctx.moveTo(ppx, ppy);

    ctx.lineTo(px, py);

    ctx.strokeStyle = `rgba(180,220,255,${alpha})`;

    ctx.lineWidth = this.size + audioBoost * 2;

    ctx.shadowBlur = 10 + audioBoost * 25;

    ctx.shadowColor = 'rgba(120,190,255,0.8)';

    ctx.stroke();
  }
}

/* =========================================================
   PARTICLES
   ========================================================= */

class Particle{

  constructor(){

    this.reset();
  }

  reset(){

    this.x = Math.random() * w;

    this.y = Math.random() * h;

    this.radius = Math.random() * 2;

    this.speed = 0.2 + Math.random() * 0.7;

    this.alpha = 0.08 + Math.random() * 0.2;
  }

  update(){

    this.y -= this.speed;

    if(this.y < -10){

      this.y = h + 10;
    }
  }

  draw(){

    ctx.beginPath();

    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

    ctx.fillStyle = `rgba(140,200,255,${this.alpha})`;

    ctx.fill();
  }
}

for(let i=0;i<180;i++){

  stars.push(new Star());
}

for(let i=0;i<80;i++){

  particles.push(new Particle());
}

/* =========================================================
   VHS NOISE
   ========================================================= */

function drawNoise(){

  const imageData = nctx.createImageData(w, h);

  const buffer = new Uint32Array(imageData.data.buffer);

  for(let i = 0; i < buffer.length; i++){

    if(Math.random() > 0.985){

      buffer[i] = 0xffffffff;
    }
  }

  nctx.putImageData(imageData, 0, 0);
}

/* =========================================================
   ANIMATE
   ========================================================= */

function animate(){

  const audioLevel = getAudioLevel();

  ctx.clearRect(0,0,w,h);

  galaxyRotation += 0.0004;

  galaxy.style.transform =
    `rotate(${galaxyRotation}rad) scale(${1 + audioLevel * 0.04})`;

  flare.style.left = mouseX + 'px';

  flare.style.top = mouseY + 'px';

  flare.style.transform =
    `translate(-50%,-50%) scale(${1 + audioLevel * 0.3})`;

  drawNoise();

  for(const p of particles){

    p.update();

    p.draw();
  }

  for(const star of stars){

    star.update(audioLevel);

    star.draw(audioLevel);
  }

  animationId = requestAnimationFrame(animate);
}

/* =========================================================
   START / STOP
   ========================================================= */

async function start(){

  if(running) return;

  running = true;

  await audioCtx.resume();

  document.body.classList.add('space-active');

  animate();
}

function stop(){

  running = false;

  cancelAnimationFrame(animationId);

  ctx.clearRect(0,0,w,h);

  document.body.classList.remove('space-active');
}

audio.addEventListener('play', start);

audio.addEventListener('pause', stop);

audio.addEventListener('ended', stop);

/* =========================================================
   MOUSE PARALLAX
   ========================================================= */

window.addEventListener('mousemove', e => {

  mouseX = e.clientX;

  mouseY = e.clientY;
});

/* =========================================================
   CROSSHAIR
   ========================================================= */

const lineX = document.querySelector('.line-x');

const lineY = document.querySelector('.line-y');

window.addEventListener('mousemove', e => {

  lineX.style.top = e.clientY + 'px';

  lineY.style.left = e.clientX + 'px';
});

})();

</script>
