  <!-- COUNTDOWN -->

  <script>

    (() => {

      const targetDate =
        new Date("2026-03-06T00:00:00+01:00").getTime();

      const el =
        document.getElementById("awb-countdown-timer");

      if(!el) return;

      function updateCountdown(){

        const now = Date.now();

        const diff = targetDate - now;

        if(diff <= 0){

          el.textContent = "OUT NOW";

          clearInterval(timer);

          return;
        }

        const seconds = Math.floor(diff / 1000);

        const days =
          Math.floor(seconds / (3600 * 24));

        const hours =
          Math.floor((seconds % (3600 * 24)) / 3600);

        const mins =
          Math.floor((seconds % 3600) / 60);

        const secs = seconds % 60;

        const hh =
          String(hours).padStart(2, "0");

        const mm =
          String(mins).padStart(2, "0");

        const ss =
          String(secs).padStart(2, "0");

        el.textContent =
          days > 0
          ? `${days}d ${hh}:${mm}:${ss}`
          : `${hh}:${mm}:${ss}`;
      }

      updateCountdown();

      const timer =
        setInterval(updateCountdown, 1000);

    })();

  </script>

  <!-- CROSSHAIR SCRIPT -->

  <script>

    (() => {

      const cross =
        document.getElementById('crosshair');

      const lineX =
        cross?.querySelector('.line-x');

      const lineY =
        cross?.querySelector('.line-y');

      if(!cross || !lineX || !lineY) return;

      if(!window.matchMedia('(pointer:fine)').matches){

        cross.style.display = 'none';

        return;
      }

      let x = -9999;
      let y = -9999;

      let raf = null;

      function render(){

        lineX.style.top = y + 'px';

        lineY.style.left = x + 'px';

        raf = null;
      }

      window.addEventListener('mousemove', (e) => {

        x = e.clientX;

        y = e.clientY;

        if(!raf){

          raf = requestAnimationFrame(render);
        }

      }, { passive:true });

    })();

  </script>

  <!-- CONCERT BACKGROUND SCRIPT -->

  <script>

    (() => {

      const audio = document.getElementById('release-audio');

      const canvas = document.getElementById('starfield');

      if (!audio || !canvas) return;

      const ctx = canvas.getContext('2d');

      let w;
      let h;

      let animationId = null;

      let running = false;

      const phones = [];

      function resize() {

        w = canvas.width = window.innerWidth;

        h = canvas.height = window.innerHeight;
      }

      resize();

      window.addEventListener('resize', resize);

      class PhoneLight {

        constructor() {

          this.reset();
        }

        reset() {

          this.x = Math.random() * w;

          this.y =
            h * 0.15 +
            Math.random() * h * 0.75;

          this.radius =
            1 +
            Math.random() * 4;

          this.alpha =
            0.2 +
            Math.random() * 0.8;

          this.pulse =
            Math.random() * Math.PI * 2;

          this.speed =
            0.01 +
            Math.random() * 0.03;

          this.blur =
            8 +
            Math.random() * 20;
        }

        update(audioLevel) {

          this.pulse += this.speed;

          this.currentAlpha =
            this.alpha *
            (0.65 + Math.sin(this.pulse) * 0.35) *
            (1 + audioLevel * 1.5);

          this.currentRadius =
            this.radius *
            (1 + audioLevel * 0.8);
        }

        draw() {

          ctx.beginPath();

          ctx.arc(
            this.x,
            this.y,
            this.currentRadius,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            `rgba(255,255,255,${this.currentAlpha})`;

          ctx.shadowBlur = this.blur;

          ctx.shadowColor =
            'rgba(255,255,255,0.9)';

          ctx.fill();
        }
      }

      for (let i = 0; i < 180; i++) {

        phones.push(new PhoneLight());
      }

      const audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

      const source =
        audioCtx.createMediaElementSource(audio);

      const analyser =
        audioCtx.createAnalyser();

      analyser.fftSize = 256;

      source.connect(analyser);

      analyser.connect(audioCtx.destination);

      const bufferLength =
        analyser.frequencyBinCount;

      const dataArray =
        new Uint8Array(bufferLength);

      function getAudioLevel() {

        analyser.getByteFrequencyData(dataArray);

        let sum = 0;

        for (let i = 0; i < bufferLength; i++) {

          sum += dataArray[i];
        }

        return sum / bufferLength / 255;
      }

      function drawCrowd() {

        const gradient =
          ctx.createLinearGradient(
            0,
            h * 0.55,
            0,
            h
          );

        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.96)');

        ctx.fillStyle = gradient;

        ctx.fillRect(0, h * 0.55, w, h);

        for (let i = 0; i < 24; i++) {

          const x =
            (i / 24) * w;

          const height =
            80 +
            Math.random() * 180;

          ctx.beginPath();

          ctx.arc(
            x,
            h - height,
            40 + Math.random() * 30,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            'rgba(0,0,0,0.95)';

          ctx.fill();
        }
      }

      function drawStageGlow(audioLevel) {

        const glow =
          ctx.createRadialGradient(
            w / 2,
            h * 0.38,
            20,
            w / 2,
            h * 0.38,
            h * 0.5
          );

        glow.addColorStop(
          0,
          `rgba(255,255,255,${0.08 + audioLevel * 0.25})`
        );

        glow.addColorStop(
          0.3,
          `rgba(180,200,255,${0.04 + audioLevel * 0.12})`
        );

        glow.addColorStop(
          1,
          'rgba(0,0,0,0)'
        );

        ctx.fillStyle = glow;

        ctx.fillRect(0, 0, w, h);
      }

      function animate() {

        const audioLevel =
          getAudioLevel();

        ctx.clearRect(0, 0, w, h);

        const bg =
          ctx.createLinearGradient(
            0,
            0,
            0,
            h
          );

        bg.addColorStop(0, '#05070b');
        bg.addColorStop(0.45, '#10141d');
        bg.addColorStop(1, '#000000');

        ctx.fillStyle = bg;

        ctx.fillRect(0, 0, w, h);

        drawStageGlow(audioLevel);

        for (const phone of phones) {

          phone.update(audioLevel);

          phone.draw();
        }

        drawCrowd();

        animationId =
          requestAnimationFrame(animate);
      }

      async function startBackground() {

        if (running) return;

        running = true;

        await audioCtx.resume();

        canvas.classList.add('active');

        animate();
      }

      function stopBackground() {

        running = false;

        cancelAnimationFrame(animationId);

        ctx.clearRect(0, 0, w, h);

        canvas.classList.remove('active');
      }

      audio.addEventListener('play', startBackground);

      audio.addEventListener('pause', stopBackground);

      audio.addEventListener('ended', stopBackground);

    })();

  </script>
