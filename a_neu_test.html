<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>gespalten – Endlosschleife</title>

<style>

/* =========================================================
   GRUNDLAGEN
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #050505;
    color: #f4f4f4;
    font-family: Arial, Helvetica, sans-serif;
}

html {
    scroll-behavior: auto;
}

body {
    overflow-x: hidden;
}


/* =========================================================
   ALLGEMEINER INHALT
   ========================================================= */

.page {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
}


/* =========================================================
   SEITE 1
   ========================================================= */

.page-one {
    background:
        radial-gradient(
            circle at 50% 40%,
            #202020 0%,
            #0d0d0d 45%,
            #020202 100%
        );
}

.page-one-inner {
    width: min(1100px, 90vw);
    min-height: 100vh;
    margin: 0 auto;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 80px 0;
}

.small-label {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 20px;
}

.logo {
    font-size: clamp(70px, 12vw, 170px);
    line-height: 0.85;
    font-weight: 900;
    letter-spacing: -0.08em;
    margin: 0;
}

.subtitle {
    font-size: clamp(15px, 2vw, 22px);
    margin-top: 25px;
    opacity: 0.85;
}

.page-one-content {
    margin-top: 100px;
    width: min(800px, 90vw);
}

.page-one-content h2 {
    font-size: clamp(40px, 7vw, 90px);
    line-height: 0.9;
    margin: 0 0 30px;
    letter-spacing: -0.05em;
}

.page-one-content p {
    font-size: 18px;
    line-height: 1.7;
    opacity: 0.8;
}


/* =========================================================
   SEITE 2
   ========================================================= */

.page-two {
    background:
        linear-gradient(
            180deg,
            #121212 0%,
            #080808 50%,
            #020202 100%
        );
}

.page-two-inner {
    width: min(900px, 90vw);
    margin: 0 auto;

    padding-top: 15vh;
    padding-bottom: 20vh;
}

.page-two-kicker {
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 20px;
}

.page-two h2 {
    font-size: clamp(60px, 10vw, 140px);
    line-height: 0.85;
    letter-spacing: -0.07em;
    margin: 0 0 30px;
}

.page-two-intro {
    font-size: 22px;
    line-height: 1.5;
    opacity: 0.85;
    max-width: 700px;
}

.fragments {
    margin-top: 100px;
}

.fragment {
    border: 1px solid rgba(255,255,255,0.25);
    padding: 35px;
    margin-bottom: 30px;
    border-radius: 8px;
}

.fragment h3 {
    font-size: 28px;
    margin: 0 0 15px;
}

.fragment p {
    font-size: 17px;
    line-height: 1.7;
    opacity: 0.75;
}

.more-space {
    height: 45vh;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: clamp(40px, 7vw, 90px);
    font-weight: 900;
    letter-spacing: -0.05em;
}


/* =========================================================
   DIE ÜBERGANGSZONE
   ========================================================= */

/*
   WICHTIG:

   Diese Zone ist genau eine Bildschirmhöhe hoch.

   Seite 2 liegt HINTER den beiden Hälften von Seite 1.

   Beim Scrollen wird nur --split-progress verändert.

   0   = komplett geschlossen
   0.5 = halb geöffnet
   1   = komplett geöffnet
*/

.split-transition {
    position: relative;
    width: 100%;
    height: 100vh;
}


/*
   Der eigentliche Bildschirm.
*/

.split-stage {
    position: sticky;
    top: 0;

    width: 100%;
    height: 100vh;

    overflow: hidden;
}


/* =========================================================
   DAS ZIEL – SEITE, DIE HINTER DEM SPALT LIEGT
   ========================================================= */

.split-back {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    z-index: 1;
}


/*
   Damit die Vorschau von Seite 2 wirklich genauso
   aussieht wie der Anfang der echten Seite 2.
*/

.split-back .page-two-inner {
    min-height: 100vh;

    padding-top: 15vh;
    padding-bottom: 0;
}


/* =========================================================
   DIE VORDERE SEITE
   ========================================================= */

.split-front {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 5;

    pointer-events: none;
}


/*
   Beide Hälften enthalten den kompletten Inhalt.

   Durch clip-path wird aber nur jeweils eine Hälfte
   sichtbar.

   Dadurch gibt es KEINEN künstlichen schwarzen/weißen
   Spalt.

   Der Spalt entsteht ausschließlich dadurch,
   dass die beiden echten Seitenhälften auseinanderfahren.
*/

.split-panel {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            #202020 0%,
            #0d0d0d 45%,
            #020202 100%
        );

    will-change: transform;

    transition: none;
}


/* Linke Hälfte */

.split-panel.left {
    clip-path: inset(0 50% 0 0);

    transform:
        translateX(
            calc(
                var(--split-progress) * -50vw
            )
        );
}


/* Rechte Hälfte */

.split-panel.right {
    clip-path: inset(0 0 0 50%);

    transform:
        translateX(
            calc(
                var(--split-progress) * 50vw
            )
        );
}


/*
   Der Inhalt der Panels muss exakt an derselben Stelle
   stehen wie die Originalseite.
*/

.split-panel .page-one-inner {
    width: min(1100px, 90vw);
    min-height: 100vh;
}


/* =========================================================
   UMGEKEHRTER ÜBERGANG
   =========================================================

   Hier ist die Seite 2 vorne.

   Dahinter liegt Seite 1.

   Dadurch funktioniert der Rückweg genauso.
*/

.split-transition.reverse .split-panel {
    background:
        linear-gradient(
            180deg,
            #121212 0%,
            #080808 50%,
            #020202 100%
        );
}


/*
   Linke Seite 2-Hälfte
*/

.split-transition.reverse .split-panel.left {
    clip-path: inset(0 50% 0 0);

    transform:
        translateX(
            calc(
                var(--split-progress) * -50vw
            )
        );
}


/*
   Rechte Seite 2-Hälfte
*/

.split-transition.reverse .split-panel.right {
    clip-path: inset(0 0 0 50%);

    transform:
        translateX(
            calc(
                var(--split-progress) * 50vw
            )
        );
}


/* =========================================================
   KLEINER HINWEIS OBEN
   ========================================================= */

.top-button {
    position: fixed;

    top: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 50px;

    padding: 12px 22px;

    font-size: 13px;
    letter-spacing: 0.05em;

    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);

    opacity: 0.85;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .page-one-inner {
        padding-top: 100px;
        padding-bottom: 100px;
    }

    .page-one-content {
        margin-top: 70px;
    }

    .page-two-inner {
        padding-top: 120px;
    }

    .fragment {
        padding: 25px;
    }

    .top-button {
        top: 15px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     FESTER BUTTON
     ======================================================= -->

<div class="top-button">
    gespalten hören
</div>


<!-- =======================================================
     HIER WERDEN DIE ENDLOSCOPY-ZYKLEN ERZEUGT
     ======================================================= -->

<div id="loop-container"></div>



<script>

/* =========================================================
   SEITEN-INHALT
   ========================================================= */


/*
   ---------------------------------------------------------
   SEITE 1
   ---------------------------------------------------------
*/

function pageOneHTML() {

    return `
        <section class="page page-one">

            <div class="page-one-inner">

                <div class="small-label">
                    b3nn3t
                </div>

                <h1 class="logo">
                    gespalten
                </h1>

                <div class="subtitle">
                    10 kurze Songs. 12 Minuten zwischen alt und neu.
                </div>

                <div class="page-one-content">

                    <h2>
                        out now
                    </h2>

                    <p>
                        Ein Album zwischen alten Ideen,
                        neuen Fragmenten und allem,
                        was dazwischen passiert.
                    </p>

                </div>

            </div>

        </section>
    `;
}


/*
   ---------------------------------------------------------
   SEITE 2
   ---------------------------------------------------------
*/

function pageTwoHTML() {

    return `
        <section class="page page-two">

            <div class="page-two-inner">

                <div class="page-two-kicker">
                    die andere seite
                </div>

                <h2>
                    fragments
                </h2>

                <div class="page-two-intro">
                    die zweite seite von „gespalten“.
                </div>


                <div class="fragments">

                    <div class="fragment">
                        <h3>
                            fragment 01
                        </h3>

                        <p>
                            Texte, Bilder, Notizen,
                            Entstehungsgeschichte,
                            Lyrics oder weitere Videos.
                        </p>
                    </div>


                    <div class="fragment">
                        <h3>
                            fragment 02
                        </h3>

                        <p>
                            Hier kann dein tatsächlicher
                            zusätzlicher Inhalt stehen.
                        </p>
                    </div>


                    <div class="fragment">
                        <h3>
                            fragment 03
                        </h3>

                        <p>
                            Dieser Bereich kann beliebig
                            erweitert werden.
                        </p>
                    </div>


                    <div class="fragment">
                        <h3>
                            fragment 04
                        </h3>

                        <p>
                            Weitere Informationen,
                            Bilder oder Medien.
                        </p>
                    </div>


                    <div class="more-space">
                        noch mehr
                    </div>


                    <div class="fragment">
                        <h3>
                            fragment 05
                        </h3>

                        <p>
                            Das Ende der zweiten Seite.
                            Danach beginnt wieder der Spalt.
                        </p>
                    </div>

                </div>

            </div>

        </section>
    `;
}


/* =========================================================
   ÜBERGANG 1

   SEITE 1
        ↓
   SPALT
        ↓
   SEITE 2
   ========================================================= */

function transitionOneHTML() {

    return `
        <section class="split-transition">

            <div class="split-stage">

                <!-- SEITE 2 LIEGT HINTER DEM SPALT -->

                <div class="split-back">

                    ${pageTwoHTML()}

                </div>


                <!-- SEITE 1 IST VORNE -->

                <div class="split-front">

                    <!-- LINKE HÄLFTE -->

                    <div class="split-panel left">

                        ${pageOneHTML()}

                    </div>


                    <!-- RECHTE HÄLFTE -->

                    <div class="split-panel right">

                        ${pageOneHTML()}

                    </div>

                </div>

            </div>

        </section>
    `;
}


/* =========================================================
   ÜBERGANG 2

   SEITE 2
        ↓
   SPALT
        ↓
   SEITE 1

   ========================================================= */

function transitionTwoHTML() {

    return `
        <section class="split-transition reverse">

            <div class="split-stage">

                <!-- SEITE 1 LIEGT HINTER DEM SPALT -->

                <div class="split-back">

                    ${pageOneHTML()}

                </div>


                <!-- SEITE 2 IST VORNE -->

                <div class="split-front">

                    <!-- LINKE HÄLFTE -->

                    <div class="split-panel left">

                        ${pageTwoHTML()}

                    </div>


                    <!-- RECHTE HÄLFTE -->

                    <div class="split-panel right">

                        ${pageTwoHTML()}

                    </div>

                </div>

            </div>

        </section>
    `;
}


/* =========================================================
   EINEN KOMPLETTEN ZYKLUS BAUEN
   ========================================================= */

function createCycle() {

    const cycle = document.createElement("div");

    cycle.className = "cycle";

    cycle.innerHTML = `

        ${pageOneHTML()}

        ${transitionOneHTML()}

        ${pageTwoHTML()}

        ${transitionTwoHTML()}

    `;

    return cycle;
}


/* =========================================================
   MEHRERE IDENTISCHE ZYKLEN ERZEUGEN
   =========================================================

   Wir brauchen mehrere Kopien.

   Der Browser kann dadurch ganz normal nach unten
   scrollen.

   Wenn der Benutzer an eine äußere Kopie kommt,
   setzen wir ihn unsichtbar in die mittlere Kopie.

   Weil alle Kopien identisch sind,
   sieht man KEINEN Sprung.
   ========================================================= */

const loopContainer =
    document.getElementById("loop-container");


const NUMBER_OF_CYCLES = 5;


for (let i = 0; i < NUMBER_OF_CYCLES; i++) {

    loopContainer.appendChild(
        createCycle()
    );

}


/* =========================================================
   SCROLL-POSITION INITIALISIEREN
   ========================================================= */


/*
   Wir starten in der mittleren Kopie.

   Dadurch kann man sowohl nach unten als auch nach oben
   scrollen, ohne sofort am Anfang oder Ende anzukommen.
*/

let cycleHeight = 0;

let recentering = false;


function calculateCycleHeight() {

    const cycles =
        document.querySelectorAll(".cycle");

    if (!cycles.length) {
        return;
    }

    cycleHeight =
        cycles[0].getBoundingClientRect().height;

}


function startInMiddle() {

    calculateCycleHeight();

    if (cycleHeight <= 0) {
        return;
    }

    /*
       5 Kopien:

       0
       1
       2  ← hier starten wir
       3
       4
    */

    window.scrollTo(
        0,
        cycleHeight * 2
    );
}


window.addEventListener(
    "load",
    startInMiddle
);


/* =========================================================
   RESPONSIVE / RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        calculateCycleHeight();

    }
);


/* =========================================================
   DIE WICHTIGSTE FUNKTION:
   SPALT-BERECHNUNG
   ========================================================= */


/*
   Für jede Übergangszone wird anhand ihrer Position
   im Dokument berechnet, wie weit sie geöffnet sein soll.

   progress:

       0.00
       ↓
       komplett geschlossen

       0.25
       ↓
       kleiner Spalt

       0.50
       ↓
       halb geöffnet

       0.75
       ↓
       großer Spalt

       1.00
       ↓
       komplett geöffnet
*/

function updateSplits() {

    const transitions =
        document.querySelectorAll(
            ".split-transition"
        );


    const viewportHeight =
        window.innerHeight;


    transitions.forEach(
        transition => {

            const rect =
                transition.getBoundingClientRect();


            /*
               Der Übergang beginnt,
               wenn seine Oberkante den oberen
               Bildschirmrand erreicht.

               Deshalb:

               progress = -rect.top / rect.height
            */

            let progress =
                -rect.top /
                rect.height;


            /*
               Auf 0 bis 1 begrenzen.
            */

            progress =
                Math.max(
                    0,
                    Math.min(
                        1,
                        progress
                    )
                );


            transition.style
                .setProperty(
                    "--split-progress",
                    progress
                );

        }
    );

}


/* =========================================================
   SCROLL-LOOP
   ========================================================= */

function checkInfiniteLoop() {

    if (
        cycleHeight <= 0 ||
        recentering
    ) {
        return;
    }


    const y =
        window.scrollY;


    /*
       Wenn wir in die 4. Kopie kommen,
       gehen wir eine komplette Zyklus-Höhe zurück.

       Beispiel:

       Kopie 3
       ↓
       Kopie 2

       Die relative Position bleibt identisch.
    */

    if (
        y >= cycleHeight * 3
    ) {

        recentering = true;

        window.scrollTo(
            0,
            y - cycleHeight
        );

        recentering = false;

        return;
    }


    /*
       Wenn wir nach oben in die 2. Kopie
       bzw. Richtung 1. Kopie kommen,
       verschieben wir um einen Zyklus nach unten.
    */

    if (
        y < cycleHeight
    ) {

        recentering = true;

        window.scrollTo(
            0,
            y + cycleHeight
        );

        recentering = false;

    }

}


/* =========================================================
   EIN EINZIGER SCROLL-LOOP
   ========================================================= */

let ticking = false;


window.addEventListener(
    "scroll",
    () => {

        if (ticking) {
            return;
        }


        ticking = true;


        requestAnimationFrame(
            () => {

                updateSplits();

                checkInfiniteLoop();

                ticking = false;

            }
        );

    },
    {
        passive: true
    }
);


/* =========================================================
   ERSTE BERECHNUNG
   ========================================================= */

calculateCycleHeight();

updateSplits();


</script>

</body>
</html>
