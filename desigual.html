  <script>
    (function () {
      // Release-Zeitpunkt: 31.07.2026, 00:00 Uhr Schweizer Zeit (CEST, UTC+2)
      const targetDate = new Date("2026-07-31T00:00:00+02:00").getTime();
      const el = document.getElementById("awb-countdown-timer");
      if (!el) return;

      function updateCountdown() {
        const now = Date.now();
        const diff = targetDate - now;

        if (diff <= 0) {
          el.textContent = "OUT NOW";
          clearInterval(timer);
          return;
        }

        const seconds = Math.floor(diff / 1000);
        const days = Math.floor(seconds / (3600 * 24));
        const hours = Math.floor((seconds % (3600 * 24)) / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;

        const hh = String(hours).padStart(2, "0");
        const mm = String(mins).padStart(2, "0");
        const ss = String(secs).padStart(2, "0");

        el.textContent = (days > 0)
          ? (days + "d " + hh + ":" + mm + ":" + ss)
          : (hh + ":" + mm + ":" + ss);
      }

      updateCountdown();
      const timer = setInterval(updateCountdown, 1000);
    })();
  </script>

  <script>
    /* =========================================================
       ✅ WELTWEITE RELEASE-TIMELINE
       Der Song wird um 00:00 Uhr Lokalzeit released – Zeitzone
       für Zeitzone, von Ost (UTC+14) nach West (UTC-11).
       ========================================================= */
    (function () {
      const RELEASE_YEAR = 2026, RELEASE_MONTH = 6, RELEASE_DAY = 31; // Monat 0-indexiert -> Juli

      // Sichtbare Timeline-Stationen (Auswahl repräsentativer Länder/Städte je Zeitzone)
      const COUNTRIES = [
        { name: "Kiribati",        flag: "🇰🇮", offset: 14 },
        { name: "Tonga",           flag: "🇹🇴", offset: 13 },
        { name: "Samoa",           flag: "🇼🇸", offset: 13 },
        { name: "New Zealand",     flag: "🇳🇿", offset: 12 },
        { name: "Australia",       flag: "🇦🇺", offset: 10 },
        { name: "Japan",           flag: "🇯🇵", offset: 9 },
        { name: "South Korea",     flag: "🇰🇷", offset: 9 },
        { name: "Singapore",       flag: "🇸🇬", offset: 8 },
        { name: "India",           flag: "🇮🇳", offset: 5.5 },
        { name: "UAE",             flag: "🇦🇪", offset: 4 },
        { name: "Germany",         flag: "🇩🇪", offset: 2 },
        { name: "Switzerland",     flag: "🇨🇭", offset: 2 },
        { name: "United Kingdom",  flag: "🇬🇧", offset: 1 },
        { name: "New York",        flag: "🇺🇸", offset: -4 },
        { name: "Los Angeles",     flag: "🇺🇸", offset: -7 },
        { name: "Hawaii",          flag: "🇺🇸", offset: -10 }
      ];

      // Anzahl Länder je UTC-Zeitzone (grobe, weltweite Verteilung), Summe = 251
      const ZONE_WEIGHTS = {
        "14": 1, "13": 5, "12": 8, "11": 7, "10": 6, "9": 6, "8": 12, "7": 8,
        "6.5": 1, "6": 5, "5.75": 1, "5.5": 2, "5": 7, "4.5": 1, "4": 9,
        "3.5": 1, "3": 24, "2": 37, "1": 30, "0": 12, "-1": 3, "-2": 2,
        "-3": 10, "-3.5": 1, "-4": 19, "-5": 10, "-6": 9, "-7": 6, "-8": 3,
        "-9": 1, "-9.5": 1, "-10": 2, "-11": 1
      };
      const TOTAL_COUNTRIES = 251;

      function releaseInstant(offsetHours) {
        // UTC-Zeitpunkt, an dem es an diesem Ort lokal Mitternacht des Release-Tages wird
        return Date.UTC(RELEASE_YEAR, RELEASE_MONTH, RELEASE_DAY, 0, 0, 0) - offsetHours * 3600 * 1000;
      }

      const countEl = document.getElementById("released-count");
      const listEl = document.getElementById("timeline-list");
      if (!countEl || !listEl) return;

      function formatCountdown(ms) {
        const seconds = Math.max(0, Math.floor(ms / 1000));
        const days = Math.floor(seconds / (3600 * 24));
        const hours = Math.floor((seconds % (3600 * 24)) / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        const hh = String(hours).padStart(2, "0");
        const mm = String(mins).padStart(2, "0");
        const ss = String(secs).padStart(2, "0");
        return (days > 0) ? (days + "d " + hh + ":" + mm + ":" + ss) : (hh + ":" + mm + ":" + ss);
      }

      function render() {
        const now = Date.now();

        // Gesamtzähler über alle Zeitzonen der Welt
        let releasedTotal = 0;
        for (const key in ZONE_WEIGHTS) {
          if (releaseInstant(parseFloat(key)) <= now) {
            releasedTotal += ZONE_WEIGHTS[key];
          }
        }
        releasedTotal = Math.min(releasedTotal, TOTAL_COUNTRIES);
        countEl.textContent = String(releasedTotal).padStart(3, "0");

        // Sichtbare Timeline-Zeile für Zeile aufbauen
        const rows = COUNTRIES.map(c => ({
          ...c,
          instant: releaseInstant(c.offset),
          isLive: releaseInstant(c.offset) <= now
        }));

        const nextIndex = rows.findIndex(r => !r.isLive);

        listEl.innerHTML = "";
        rows.forEach((r, i) => {
          const row = document.createElement("div");
          let statusHtml, rowClass;

          if (r.isLive) {
            statusHtml = '<span class="status-dot">🟢</span><span class="flag">' + r.flag + '</span><span class="country-name">' + r.name + '</span><span class="status-text">LIVE</span>';
            rowClass = "is-live";
          } else if (i === nextIndex) {
            statusHtml = '<span class="status-dot">▶</span><span class="flag">' + r.flag + '</span><span class="country-name">' + r.name + '</span><span class="status-text">in ' + formatCountdown(r.instant - now) + '</span>';
            rowClass = "is-next";
          } else {
            statusHtml = '<span class="status-dot">○</span><span class="flag">' + r.flag + '</span><span class="country-name">' + r.name + '</span>';
            rowClass = "is-upcoming";
          }

          row.className = "timeline-row " + rowClass;
          row.innerHTML = statusHtml;
          listEl.appendChild(row);
        });
      }

      render();
      setInterval(render, 1000);
    })();
  </script>

  <script>
    (function(){
      const cross = document.getElementById('crosshair');
      const lineX = cross?.querySelector('.line-x');
      const lineY = cross?.querySelector('.line-y');
      if(!cross || !lineX || !lineY) return;

      if(!window.matchMedia('(pointer: fine)').matches){
        cross.style.display = 'none';
        return;
      }

      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        cross.style.display = 'none';
        return;
      }

      let x = -9999, y = -9999;
      let raf = null;

      function render(){
        lineX.style.top = y + 'px';
        lineY.style.left = x + 'px';
        raf = null;
      }

      window.addEventListener('mousemove', (e) => {
        x = e.clientX;
        y = e.clientY;
        if(!raf) raf = requestAnimationFrame(render);
      }, { passive: true });

      window.addEventListener('mouseleave', () => {
        x = -9999; y = -9999;
        render();
      });
    })();
  </script>
